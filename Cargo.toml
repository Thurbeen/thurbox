[package]
name = "thurbox"
# Development version marker: real version injected at build time from git tags
version = "0.0.0-dev"
edition = "2021"
# Build script injects version from THURBOX_RELEASE_VERSION env variable (set by CI)
# Fallback to version above for local development builds
build = "build.rs"
# `cargo run` (no --bin) launches the TUI; thurbox-cli is the headless binary.
default-run = "thurbox"
authors = ["LeTuR <magicletur@protonmail.com>"]
license = "MIT"
description = "A TUI for orchestrating multiple coding-agent CLI sessions in persistent tmux panels"
repository = "https://github.com/Thurbeen/thurbox"
keywords = ["tui", "agent", "tmux", "git", "cli"]
categories = ["command-line-utilities"]

[dependencies]
# TUI framework
ratatui = "0.30"
crossterm = "0.29"
tui-term = "0.3"

# Terminal emulation
vt100 = "0.16"

# Display-width math for clickable-link column positions (wide CJK/emoji cells)
unicode-width = "0.2"

# Markdown parsing (task description rendering)
pulldown-cmark = { version = "0.13", default-features = false }

# Base64 payload framing for the Windows-host remote file copy (already in the
# dependency tree transitively; pinned to the same resolved version)
base64 = "0.23"

# v2 plugin kernel: the Lua runtime plugins are written in, and the filesystem
# watch that reloads them on save. Lua 5.4 is vendored so no system Lua is
# needed; the `send` feature is deliberately NOT enabled, which makes "plugins
# never touch the render thread" a compile error rather than a review rule
# (design.md D10).
mlua = { version = "0.12", default-features = false, features = ["lua54", "vendored"] }
notify = "8.2"

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "signal", "net"] }

# Session management
uuid = { version = "1", features = ["v4", "serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

# Configuration
serde = { version = "1", features = ["derive"] }
toml = "1.0"
toml_edit = "0.25"

# Storage
rusqlite = { version = "0.40", features = ["bundled"] }

# System metrics
sysinfo = "0.39"

# Error handling
anyhow = "1.0"

# Clipboard (text only — the default `image-data` feature pulls in the
# image/png/moxcms decoding stack we never use; thurbox only copies/pastes text)
arboard = { version = "3", default-features = false }

# Temporary directories (used by tests and session_ops)
tempfile = "3"

# JSON (session metadata, keybindings, agent config)
serde_json = "1"

# CLI argument parsing (thurbox-cli)
clap = { version = "4", features = ["derive"] }

# Date/time + cron scheduling (automations)
chrono = { version = "0.4", default-features = false, features = ["clock"] }
chrono-tz = "0.10"
cron = "0.17"
serde_ignored = "0.1.14"

# OS notifications. Linux-only: dbus with action callbacks (click-to-focus
# works). macOS dispatches via `terminal-notifier` if installed, else the
# system `osascript` binary — both inside `src/notifications.rs`, neither
# needs notify-rust. notify-rust's macOS backend (`mac-notification-sys`)
# rides the deprecated `NSUserNotificationCenter` API and is non-functional
# for unbundled CLIs on macOS 12+, so it isn't pulled in there. Windows
# (WSL toast) shells out to `powershell.exe`, also no notify-rust.
[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4"

[[bin]]
name = "thurbox-cli"
path = "src/bin/thurbox-cli.rs"

# Development tool requirements (install with `cargo binstall` or `cargo install`)
[package.metadata.dev-tools]
prek = "0.2.0"
cocogitto = "6.2.0"
cargo-nextest = "0.9.0"
cargo-deny = "0.16.0"
cargo-audit = "0.21.0"
rumdl = "0.1.19"

[profile.dev]
# Our own crate: enough optimisation to be usable, still quick to rebuild.
#
# v2 renders through an embedded Lua VM, so a dev build runs interpreter-heavy
# work on every frame in a way v1 never did. At opt-level 0 that is felt as lag
# in the TUI itself, and `cargo run` is the documented way to
# run it -- so the dev profile is part of how fast thurbox v2 *is*, not just
# how fast it builds.
opt-level = 1

# Dependencies: fully optimised even in a dev build.
#
# These are compiled once and then cached, so the build-time cost is paid on
# the first build and never again, while every frame pays the runtime cost.
# mlua (and its vendored Lua C), ratatui and vt100 are all on the render path.
[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 1

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.release-with-debug]
inherits = "release"
debug = true
strip = false

[dev-dependencies]
# Property/fuzz testing — proves thurbox's terminal pipeline is byte- and
# render-transparent (control_mode transport + terminal_view rendering). Runs in
# the normal `cargo nextest --all`.
proptest = "1"
