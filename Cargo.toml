[workspace]
members = ["crates/*"]
exclude = ["vendor/crossterm", "vendor/tui-term"]
resolver = "3"

[workspace.package]
version = "0.0.0-dev"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/Thurbeen/thurbox"
publish = false

[workspace.dependencies]
fleet-plugin = { path = "crates/fleet-plugin" }
jsonschema = { version = "0.61.0", default-features = false }
fleet-api = { path = "crates/fleet-api" }
fleet-controllers = { path = "crates/fleet-controllers" }
fleet-store = { path = "crates/fleet-store" }
fleet-runtime = { path = "crates/fleet-runtime" }
fleet-manager = { path = "crates/fleet-manager" }
fleet-exec = { path = "crates/fleet-exec" }
fleet-forge = { path = "crates/fleet-forge" }
fleet-gateway = { path = "crates/fleet-gateway" }
term-stream = { path = "crates/term-stream" }
portable-pty = "0.9.0"
clap = { version = "4.6.7", features = ["derive"] }
process-wrap = { version = "10.0.1", default-features = false, features = ["std", "process-group", "job-object", "kill-on-drop"] }
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
syn = { version = "3.0.9", features = ["full", "visit"] }
thiserror = "2.0.21"
toml = "1.1.8"
ctrlc = { version = "3.5.2", features = ["termination"] }
gethostname = "1.1.0"
otel-env = { path = "crates/otel-env" }
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace", "metrics"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["trace", "metrics", "http-proto", "reqwest-blocking-client"] }
opentelemetry-proto = { version = "0.33.1", default-features = false, features = ["gen-tonic-messages", "trace", "metrics"] }
prost = "0.14.4"
croner = "4.0.3"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
serde_path_to_error = "0.1.20"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.dev]
debug = "line-tables-only"

opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 1

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.release-with-debug]
inherits = "release"
debug = true
strip = false

[patch.crates-io]
crossterm = { path = "vendor/crossterm" }

tui-term = { path = "vendor/tui-term" }
