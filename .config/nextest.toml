# Nextest configuration
# See: https://nexte.st/book/configuration.html

[profile.default]
# Number of retries for failing tests
retries = 0

# Number of threads to use for running tests
test-threads = "num-cpus"

# Show slow tests that take more than 60 seconds
slow-timeout = { period = "60s", terminate-after = 2 }

# Fail fast - stop after first failure
fail-fast = false

# Success output
success-output = "immediate"

# Failure output
failure-output = "immediate-final"

# Status level
status-level = "pass"

[profile.ci]
# CI-specific configuration
retries = 2
fail-fast = true
slow-timeout = { period = "30s" }

# tests/tui_e2e.rs drives the real binary on a real pty/tmux session with
# wall-clock waits. Run alongside the rest of the (much larger) suite at full
# parallelism, they starve each other of CPU and blow their timeouts under
# load even though each passes cleanly in isolation — serialize this one
# binary so it never contends with itself or the rest of the run.
[test-groups]
e2e-pty = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'binary_id(thurbox::tui_e2e)'
test-group = 'e2e-pty'

[[profile.ci.overrides]]
filter = 'binary_id(thurbox::tui_e2e)'
test-group = 'e2e-pty'

