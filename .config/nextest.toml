[profile.default]
retries = 0
test-threads = "num-cpus"
slow-timeout = { period = "60s", terminate-after = 2 }
fail-fast = false
success-output = "immediate"
failure-output = "immediate-final"
status-level = "pass"

[profile.ci]
retries = 2
fail-fast = true
slow-timeout = { period = "30s" }

[test-groups]
e2e-pty = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'binary_id(thurbox::tui_e2e)'
test-group = 'e2e-pty'
priority = 100

[[profile.ci.overrides]]
filter = 'binary_id(thurbox::tui_e2e)'
test-group = 'e2e-pty'
priority = 100

[[profile.default.overrides]]
filter = 'binary_id(fleet-cli::e2e_runtime_exec) & test(a_task_dispatched_beside_running_tasks)'
slow-timeout = { period = "60s", terminate-after = 4 }
