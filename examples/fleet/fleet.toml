version = 1
[data]
dir = "data"
[runtime]
kind = "fake"
dir = "fake-host"
[forge]
draftPolicy = "checks"
[forge.hosts]
"forge.example" = { kind = "fake", dir = "fake-forge" }
# Hosted Bitbucket Cloud uses an externally authenticated curl client:
# "bitbucket.org" = { kind = "bitbucket-cloud", cli = "curl" }
[forge.readyPolicies.checks]
checksPassed = true
[forge.readyPolicies.checks-and-bots]
botReviewsAddressed = true
checksPassed = true
[forge.readyPolicies.strict]
botReviewsAddressed = true
checksPassed = true
noUnresolvedThreads = true
