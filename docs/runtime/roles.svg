<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 250" role="img" aria-labelledby="title desc">
<title id="title">Two roles: a runtime and a workspace provider</title>
<desc id="desc">Fleet calls a runtime through the runtime protocol. A runtime is any program that answers the protocol at a place: runtime-mux, the shipped one, or your own. A runtime turns a workspace URL into a directory, and runtime-mux runs a workspace provider for that: workspace-git, the shipped one, or your own program that answers the same four calls.</desc>
<style>
  svg { color-scheme:light dark }
  .background{fill:#fff} .ink{fill:#182b3d} .muted{fill:#405367}
  .box{stroke:#7890a6;stroke-width:1.5}
  .engine{fill:#e9f5ef} .runtime{fill:#f3f4f5} .provider{fill:#fff2de} .yours{fill:none;stroke:#7890a6;stroke-width:1.5;stroke-dasharray:6 5}
  .arrow{fill:none;stroke:#405367;stroke-width:2;marker-end:url(#arrow)} .arrowhead{fill:#405367}
  @media (prefers-color-scheme: light) { .background{fill:#fff} .ink{fill:#182b3d} }
  @media (prefers-color-scheme: dark) {
    .background{fill:#101820} .ink{fill:#e6edf3} .muted{fill:#a9bdd0} .box{stroke:#71869a}
    .engine{fill:#173b2d} .runtime{fill:#202a33} .provider{fill:#493517} .yours{stroke:#71869a}
    .arrow{stroke:#a9bdd0} .arrowhead{fill:#a9bdd0}
  }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="arrowhead" d="M0 0 L10 5 L0 10 Z"/></marker></defs>
<rect class="background" width="980" height="250" rx="12"/>
<g font-family="system-ui,-apple-system,Segoe UI,sans-serif" class="ink">
  <text x="30" y="36" font-size="20" font-weight="700">Two roles, each a program you can replace</text>
  <g class="box">
    <rect class="engine" x="30" y="70" width="200" height="130" rx="8"/>
    <rect class="runtime" x="330" y="70" width="270" height="56" rx="8"/>
    <rect class="yours" x="330" y="144" width="270" height="56" rx="8"/>
    <rect class="provider" x="700" y="70" width="250" height="56" rx="8"/>
    <rect class="yours" x="700" y="144" width="250" height="56" rx="8"/>
  </g>
  <text x="50" y="104" font-size="18" font-weight="650">Fleet</text>
  <text x="50" y="132" font-size="13">calls a runtime for each</text>
  <text x="50" y="150" font-size="13">Task, at its place</text>
  <text x="50" y="182" font-size="12" class="muted">knows no runtime's code</text>
  <text x="330" y="60" font-size="12" font-weight="650" class="muted">RUNTIME · runs the process</text>
  <text x="346" y="95" font-size="15" font-weight="650">runtime-mux</text>
  <text x="346" y="114" font-size="12" class="muted">shipped · tmux, psmux</text>
  <text x="346" y="169" font-size="15" font-weight="650">your runtime</text>
  <text x="346" y="188" font-size="12" class="muted">containers, VMs, a service…</text>
  <text x="700" y="60" font-size="12" font-weight="650" class="muted">WORKSPACE PROVIDER · URL → directory</text>
  <text x="716" y="95" font-size="15" font-weight="650">workspace-git</text>
  <text x="716" y="114" font-size="12" class="muted">shipped · git URLs</text>
  <text x="716" y="169" font-size="15" font-weight="650">your provider</text>
  <text x="716" y="188" font-size="12" class="muted">the same four calls</text>
  <g class="arrow">
    <path d="M230 98 H328"/><path d="M230 172 H328"/>
    <path d="M600 98 H698"/><path d="M600 172 H698"/>
  </g>
  <g class="muted" font-size="11" text-anchor="middle">
    <text x="279" y="90">runtime protocol</text>
    <text x="279" y="164">runtime protocol</text>
    <text x="649" y="90">make · release</text>
    <text x="649" y="164">make · release</text>
  </g>
  <text x="30" y="232" font-size="12" class="muted">fleet runtime check tests a runtime. runtime-mux runs the provider its config names (workspace.program); a runtime can also make workspaces with no provider.</text>
</g>
</svg>
