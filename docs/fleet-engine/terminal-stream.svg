<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 600" role="img" aria-labelledby="title desc">
<title id="title">The terminal stream: how a view attaches to a session on any runtime</title>
<desc id="desc">A view asks fleet attach for a Task. Fleet asks the runtime's attach verb, which answers either a stream command that speaks the terminal stream protocol, or a raw tty command. Fleet passes a stream command through and wraps a tty command in fleet term-bridge, so the view always gets a stream. The view runs the command and exchanges length-prefixed frames over its stdin and stdout: downstream hello, snapshot, output, resized, sized_elsewhere, resync, state and exit; upstream input, paste, resize and detach. For runtime-mux the stream command is runtime-mux view, its control-mode client encoded as frames. For a container or a VM it is term-holder connect over docker exec, ssh or vsock, where term-holder keeps the screen and scrollback inside the place. In thurbox the stream pane decodes frames into the PaneChunks WiredPane already consumes.</desc>
<style>
  svg { color-scheme:light dark }
  .background{fill:#fff} .ink{fill:#182b3d} .muted{fill:#405367}
  .box{stroke:#7890a6;stroke-width:1.5}
  .interface{fill:#edf3f8} .engine{fill:#e9f5ef} .runtime{fill:#f3f4f5} .place{fill:#fff2de}
  .arrow{fill:none;stroke:#405367;stroke-width:2;marker-end:url(#arrow)} .arrowhead{fill:#405367}
  .stream{fill:none;stroke:#2c7a5b;stroke-width:3;marker-end:url(#arrowg)} .arrowheadg{fill:#2c7a5b}
  .icon{fill:none;stroke:#405367;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .frame{fill:#fff;stroke:#7890a6;stroke-width:1}
  @media (prefers-color-scheme: dark) {
    .background{fill:#101820} .ink{fill:#e6edf3} .muted{fill:#a9bdd0} .box{stroke:#71869a}
    .interface{fill:#1d2a36} .engine{fill:#173b2d} .runtime{fill:#202a33} .place{fill:#493517}
    .arrow{stroke:#a9bdd0} .arrowhead{fill:#a9bdd0} .stream{stroke:#5fc79a} .arrowheadg{fill:#5fc79a} .icon{stroke:#a9bdd0} .frame{fill:#1a2430;stroke:#71869a}
  }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="arrowhead" d="M0 0 L10 5 L0 10 Z"/></marker>
  <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="arrowheadg" d="M0 0 L10 5 L0 10 Z"/></marker>
  <symbol id="i-terminal" viewBox="0 0 24 24"><rect class="icon" x="2" y="4" width="20" height="16" rx="2"/><path class="icon" d="M6 9l3 3-3 3M12 15h6"/></symbol>
  <symbol id="i-engine" viewBox="0 0 24 24"><circle class="icon" cx="12" cy="12" r="3"/><path class="icon" d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></symbol>
  <symbol id="i-mux" viewBox="0 0 24 24"><rect class="icon" x="2" y="3" width="20" height="18" rx="2"/><path class="icon" d="M2 9h20M9 9v12M15 9v12"/></symbol>
  <symbol id="i-container" viewBox="0 0 24 24"><path class="icon" d="M3 8l9-4 9 4v8l-9 4-9-4z"/><path class="icon" d="M3 8l9 4 9-4M12 12v8"/></symbol>
  <symbol id="i-bridge" viewBox="0 0 24 24"><path class="icon" d="M3 17h18M5 17V9M19 17V9M5 9c3-4 11-4 14 0M9 17v-6M15 17v-6M12 17v-7"/></symbol>
  <symbol id="i-screen" viewBox="0 0 24 24"><rect class="icon" x="3" y="3" width="18" height="18" rx="2"/><path class="icon" d="M7 8h10M7 12h7M7 16h4"/></symbol>
</defs>
<rect class="background" width="1080" height="600" rx="12"/>
<g font-family="system-ui,-apple-system,Segoe UI,sans-serif" class="ink">
  <text x="30" y="36" font-size="21" font-weight="700">Contract 3: the terminal stream</text>
  <text x="30" y="61" font-size="14">A view runs one process and speaks frames with it, whatever keeps the screen.</text>

  <!-- view -->
  <g class="box"><rect class="interface" x="30" y="96" width="250" height="150" rx="8"/></g>
  <use href="#i-terminal" x="48" y="112" width="28" height="28"/>
  <text x="88" y="131" font-size="17" font-weight="650">a view</text>
  <text x="48" y="162" font-size="13">thurbox stream pane</text>
  <text x="48" y="182" font-size="13">fleet attach in a plain terminal</text>
  <text x="48" y="202" font-size="13">any other client</text>
  <text x="48" y="230" font-size="12" class="muted">decodes frames → grid (vt100)</text>

  <!-- fleet -->
  <g class="box"><rect class="engine" x="340" y="96" width="250" height="150" rx="8"/></g>
  <use href="#i-engine" x="358" y="112" width="28" height="28"/>
  <text x="398" y="131" font-size="17" font-weight="650">fleet attach</text>
  <text x="358" y="162" font-size="13">asks the runtime's attach verb</text>
  <text x="358" y="182" font-size="13">stream → passed through</text>
  <text x="358" y="202" font-size="13">tty → wrapped in term-bridge</text>
  <text x="358" y="230" font-size="12" class="muted">carries no terminal bytes</text>

  <!-- runtime attach answers -->
  <g class="box">
    <rect class="runtime" x="650" y="96" width="400" height="66" rx="8"/>
    <rect class="runtime" x="650" y="180" width="400" height="66" rx="8"/>
  </g>
  <use href="#i-screen" x="666" y="112" width="26" height="26"/>
  <text x="702" y="124" font-size="14" font-weight="650">{stream: {argv}}</text>
  <text x="702" y="146" font-size="12" class="muted">the command speaks the protocol: the full answer</text>
  <use href="#i-bridge" x="666" y="196" width="26" height="26"/>
  <text x="702" y="208" font-size="14" font-weight="650">{tty: {argv}}</text>
  <text x="702" y="230" font-size="12" class="muted">raw command: docker attach, virsh console · no history</text>

  <g class="arrow">
    <path d="M280 140 H338"/><path d="M590 128 H648"/><path d="M590 212 H648"/>
  </g>
  <text x="286" y="131" font-size="12" class="muted">fleet attach</text>

  <!-- the stream -->
  <g class="box"><rect class="place" x="30" y="290" width="1020" height="118" rx="8"/></g>
  <text x="48" y="314" font-size="14" font-weight="650">the stream · length-prefixed frames on stdin and stdout · output and input are raw bytes, the rest JSON</text>
  <g font-size="12">
    <g class="frame">
      <rect x="48" y="328" width="60" height="24" rx="4"/><rect x="116" y="328" width="80" height="24" rx="4"/><rect x="204" y="328" width="66" height="24" rx="4"/><rect x="278" y="328" width="70" height="24" rx="4"/><rect x="356" y="328" width="120" height="24" rx="4"/><rect x="484" y="328" width="66" height="24" rx="4"/><rect x="558" y="328" width="56" height="24" rx="4"/><rect x="622" y="328" width="50" height="24" rx="4"/>
      <rect x="48" y="368" width="58" height="24" rx="4"/><rect x="114" y="368" width="58" height="24" rx="4"/><rect x="180" y="368" width="62" height="24" rx="4"/><rect x="250" y="368" width="64" height="24" rx="4"/>
    </g>
    <g text-anchor="middle">
      <text x="78" y="344">hello</text><text x="156" y="344">snapshot</text><text x="237" y="344">output</text><text x="313" y="344">resized</text><text x="416" y="344">sized_elsewhere</text><text x="517" y="344">resync</text><text x="586" y="344">state</text><text x="647" y="344">exit</text>
      <text x="77" y="384">input</text><text x="143" y="384">paste</text><text x="211" y="384">resize</text><text x="282" y="384">detach</text>
    </g>
    <text x="690" y="344" class="muted">↓ down: capabilities, the screen now, then what follows</text>
    <text x="330" y="384" class="muted">↑ up: typed, pasted, a size request the screen keeper arbitrates, leave without stopping</text>
  </g>
  <path class="stream" d="M155 246 V288"/><path class="stream" d="M185 288 V248"/>

  <!-- screen keepers -->
  <g class="box">
    <rect class="runtime" x="30" y="450" width="320" height="120" rx="8"/>
    <rect class="runtime" x="380" y="450" width="340" height="120" rx="8"/>
    <rect class="runtime" x="750" y="450" width="300" height="120" rx="8"/>
  </g>
  <use href="#i-mux" x="48" y="466" width="26" height="26"/>
  <text x="84" y="484" font-size="15" font-weight="650">runtime-mux view &lt;key&gt;</text>
  <text x="48" y="510" font-size="12">tmux · psmux · rmux keep the screen</text>
  <text x="48" y="528" font-size="12">control mode encoded as frames</text>
  <text x="48" y="552" font-size="12" class="muted">scrollback · resize · reconnection over ssh, WSL</text>

  <use href="#i-container" x="398" y="466" width="26" height="26"/>
  <text x="434" y="484" font-size="15" font-weight="650">term-holder connect &lt;key&gt;</text>
  <text x="398" y="510" font-size="12">over docker exec -i · ssh · vsock · kubectl exec -i</text>
  <text x="398" y="528" font-size="12">term-holder serve owns the pty inside the place</text>
  <text x="398" y="552" font-size="12" class="muted">screen · scrollback · viewers · capture · send</text>

  <use href="#i-bridge" x="768" y="466" width="26" height="26"/>
  <text x="804" y="484" font-size="15" font-weight="650">fleet term-bridge -- argv</text>
  <text x="768" y="510" font-size="12">local pty + a vt100 screen of it</text>
  <text x="768" y="528" font-size="12">for a runtime with nothing better</text>
  <text x="768" y="552" font-size="12" class="muted">history starts now, and hello says so</text>

  <g class="arrow"><path d="M190 448 V410"/><path d="M550 448 V410"/><path d="M900 448 V410"/></g>
</g>
</svg>
