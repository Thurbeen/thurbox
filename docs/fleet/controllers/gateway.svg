<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" role="img" aria-labelledby="title desc">
<title id="title">Gateway controller state machine</title>
<desc id="desc">A Conversation mirrors one chat thread. The receive verb, or Fleet opening a thread for a Task's Question, creates it Untied; a thread Fleet opened is tied at once to the Task its opening post's marker names. An admitted mention in an Untied thread creates a Task and ties it. When the tied Task is readably gone the Conversation is Orphaned, and the next admitted message creates a new Task joined with the thread's history. While Tied, GatewayController relays new messages into the Task's inbox and posts what the Task declares. A Conversation with no message for its retention that is Untied, Orphaned, or tied to a Concluded Task retires: its controller deletes the Task, the manager removes the thread directory it created, and the controller deletes the Conversation; nothing on the platform changes.</desc>
<style>
  svg { color-scheme:light dark }
  @media (prefers-color-scheme: light) { svg &gt; rect{fill:#fff} svg &gt; g{fill:#182b3d} }
  @media (prefers-color-scheme: dark) { svg &gt; rect{fill:#101820} svg &gt; g{fill:#e6edf3} [stroke="#7890a6"]{stroke:#71869a} [stroke="#405367"]{stroke:#a9bdd0} [stroke="#c9d3dd"]{stroke:#405367} [fill="#405367"]{fill:#a9bdd0} [fill="#edf3f8"]{fill:#1d2a36} [fill="#f5f7fa"]{fill:#18232d} [fill="#e9f5ef"]{fill:#173b2d} }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#405367"/></marker></defs>
<rect width="1040" height="470" rx="12" fill="#ffffff"/>
<g font-family="system-ui,-apple-system,Segoe UI,sans-serif" fill="#182b3d">
<text x="24" y="35" font-size="21" font-weight="700">One chat thread, as a Conversation, and the Task tied to it</text>
<text x="24" y="60" font-size="14">Conversation phases are ConversationController's; the tie on the Task is GatewayController's.</text>
<g stroke="#7890a6" stroke-width="1.5" fill="#edf3f8">
<rect id="receive" x="30" y="160" width="180" height="64" rx="8" fill="#f5f7fa" stroke-dasharray="5 4"/>
<rect id="untied" x="270" y="160" width="190" height="64" rx="8"/>
<rect id="tied" x="530" y="160" width="190" height="64" rx="8" fill="#e9f5ef"/>
<rect id="orphaned" x="800" y="160" width="200" height="64" rx="8"/>
<rect id="task" x="530" y="310" width="190" height="64" rx="8" fill="#f5f7fa" stroke-dasharray="5 4"/>
<rect id="deleted" x="800" y="310" width="200" height="64" rx="8" fill="#f5f7fa" stroke-dasharray="5 4"/>
</g>
<g text-anchor="middle" font-size="17" font-weight="650">
<text x="120" y="187">receive verb</text><text x="365" y="187">Untied</text><text x="625" y="187">Tied</text><text x="900" y="187">Orphaned</text>
<text x="625" y="337">Task</text><text x="900" y="337">deleted</text>
</g>
<g text-anchor="middle" font-size="12">
<text x="120" y="209">a listener's event</text><text x="365" y="209">no Task · refusals only</text>
<text x="625" y="209">one Task per thread</text><text x="900" y="209">Task gone · messages kept</text>
<text x="625" y="359">status.gateway · inbox</text><text x="900" y="359">by its own controller</text>
</g>
<g fill="none" stroke="#405367" stroke-width="1.8" marker-end="url(#arrow)">
<path id="create" d="M210 192 H268"/>
<path id="mention" d="M460 192 H528"/>
<path id="opened" d="M625 110 V158"/>
<path id="gone" d="M720 180 H798"/>
<path id="again" d="M800 206 H722"/>
<path id="relay" d="M600 224 V308"/>
<path id="post" d="M650 308 V226"/>
<path id="retain-orphaned" d="M900 224 V308"/>
<path id="retain-untied" d="M365 224 V410 H900 V376"/>
</g>
<g font-size="12" fill="#405367">
<text x="625" y="100" text-anchor="middle">opened for a Question, tied by its marker</text>
<text x="494" y="134" text-anchor="middle">admitted mention</text>
<text x="494" y="148" text-anchor="middle">creates a Task</text>
<text x="759" y="172" text-anchor="middle">Task gone, or retired once Concluded</text>
<text x="760" y="244" text-anchor="middle">admitted message:</text>
<text x="760" y="258" text-anchor="middle">new Task, whole history</text>
<text x="590" y="292" text-anchor="end">relay into the inbox</text>
<text x="660" y="292">post what it declares</text>
<text x="910" y="270">retention</text>
<text x="380" y="402">retirement: no message for gateway.retainMs; the thread directory goes too</text>
</g>
<path d="M25 428 H1015" stroke="#c9d3dd"/>
<text x="25" y="452" font-size="14">The Gateway never runs a model. Admission, the tie and moving messages are all it decides; every admitted message is a worker turn.</text>
</g>
</svg>
