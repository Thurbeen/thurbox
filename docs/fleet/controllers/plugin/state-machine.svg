<g font-size="14" text-anchor="middle">
<text x="165" y="113" font-weight="700">fleet up: manifest</text>
<text x="165" y="133" font-size="12">once per plugin; unreadable refuses up</text>
<text x="455" y="113" font-weight="700">store serves the kinds</text>
<text x="455" y="133" font-size="12">spec validated by the plugin's schema</text>
<text x="135" y="213" font-weight="700">object due</text>
<text x="135" y="233" font-size="12">notBefore, generation, deleting</text>
<text x="370" y="213" font-weight="700">probes (pure)</text>
<text x="370" y="233" font-size="12">up to 3 rounds</text>
<text x="760" y="199" font-weight="700">answers</text>
<text x="760" y="219" font-size="12">object, list: from the store, no lease renewal</text>
<text x="760" y="239" font-size="12">plugin probes: observe, bounded, Known or Unknown</text>
<text x="135" y="321" font-weight="700">reconcile (pure)</text>
<text x="135" y="341" font-size="12">returns a plan</text>
<text x="370" y="321" font-weight="700">gate admits</text>
<text x="370" y="341" font-size="12">refused whole,</text>
<text x="370" y="357" font-size="12">or typed writes</text>
<text x="630" y="321" font-weight="700">CAS write status</text>
<text x="630" y="341" font-size="12">with each effect's intent,</text>
<text x="630" y="357" font-size="12">under the lease</text>
<text x="895" y="321" font-weight="700">verbs</text>
<text x="895" y="341" font-size="12">creates, amends, patches,</text>
<text x="895" y="357" font-size="12">appends, declares, deletes</text>
<text x="255" y="427" font-weight="700">deleting with a finalizer</text>
<text x="255" y="447" font-size="12">reconciled each pass until the plan says removeFinalizer</text>
<text x="630" y="427" font-weight="700">perform (bounded)</text>
<text x="630" y="447" font-size="12">once per key, never repeated</text>
<text x="895" y="427" font-weight="700">receipt written</text>
<text x="895" y="447" font-size="12">done, failed or unknown</text>
</g>
