<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 430" role="img" aria-labelledby="title desc">
<title id="title">CronTask controller: one scheduled time</title>
<desc id="desc">At each scheduled time the controller skips the time when the CronTask is suspended, when the time came later than its starting deadline, or when the Forbid policy finds a Task that still runs. With the Replace policy it deletes the running Task, and the new Task waits until the old one is gone. Then it writes the create's intent, the manager creates the Task, and the manager writes the receipt. The next reconcile is at the next scheduled time.</desc>
<style>
  svg { color-scheme:light dark }
  @media (prefers-color-scheme: light) { svg &gt; rect{fill:#fff} svg &gt; g{fill:#182b3d} }
  @media (prefers-color-scheme: dark) { svg &gt; rect{fill:#101820} svg &gt; g{fill:#e6edf3} [stroke="#7890a6"]{stroke:#71869a} [stroke="#405367"]{stroke:#a9bdd0} [stroke="#c9d3dd"]{stroke:#405367} [fill="#405367"]{fill:#a9bdd0} [fill="#edf3f8"]{fill:#1d2a36} [fill="#e9f5ef"]{fill:#173b2d} [fill="#fff2de"]{fill:#493517} }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#405367"/></marker></defs>
<rect width="1040" height="430" rx="12" fill="#ffffff"/>
<g font-family="system-ui,-apple-system,Segoe UI,sans-serif" fill="#182b3d">
<text x="24" y="35" font-size="21" font-weight="700">CronTask: one scheduled time</text>
<text x="24" y="60" font-size="14">The latest time at or before now that is not yet decided. Earlier missed times are dropped.</text>
<g stroke="#7890a6" stroke-width="1.5" fill="#edf3f8">
<rect id="due" x="30" y="150" width="150" height="68" rx="8"/>
<rect id="checks" x="250" y="150" width="190" height="68" rx="8"/>
<rect id="replace" x="510" y="150" width="170" height="68" rx="8" fill="#fff2de"/>
<rect id="create" x="750" y="150" width="250" height="68" rx="8" fill="#e9f5ef"/>
<rect id="skip" x="250" y="290" width="190" height="68" rx="8" fill="#fff2de"/>
</g>
<g text-anchor="middle" font-size="17" font-weight="650">
<text x="105" y="177">Time T due</text><text x="345" y="177">Checks</text><text x="595" y="177">Replace</text><text x="875" y="177">Create Task</text><text x="345" y="317">Skip T</text>
</g>
<g text-anchor="middle" font-size="12">
<text x="105" y="199">notBefore came</text>
<text x="345" y="199">suspend, deadline, Forbid</text>
<text x="595" y="199">delete, wait until gone</text>
<text x="875" y="199">intent, create, receipt</text>
<text x="345" y="339">Skipped=True with its reason</text>
</g>
<g fill="none" stroke="#405367" stroke-width="1.8" marker-end="url(#arrow)">
<path id="to-checks" d="M180 184 H248"/>
<path id="to-replace" d="M440 184 H508"/>
<path id="to-create" d="M680 184 H748"/>
<path id="to-skip" d="M345 218 V288"/>
<path id="allow" d="M345 150 V110 H875 V148"/>
</g>
<g font-size="12" fill="#405367" text-anchor="middle">
<text x="474" y="176">Replace</text>
<text x="610" y="102">Allow, Forbid with no running Task, Replace with none</text>
<text x="410" y="258">a check fails</text>
</g>
<path d="M25 380 H1015" stroke="#c9d3dd"/>
<g font-size="14">
<text x="25" y="404">The Task is named &lt;name&gt;-&lt;T in minutes&gt;: a repeated decision finds it and adopts it, never a second Task.</text>
</g>
</g>
</svg>
