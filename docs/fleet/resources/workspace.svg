<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 318" role="img" aria-labelledby="title desc">
<title id="title">How a Workspace works</title>
<desc id="desc">In: Task spec.workspace, The repositories. The place&#x27;s runtime: workspace-git adds a worktree per URL, on branch &lt;key&gt;, cut from the base. Out: &lt;root&gt;/&lt;key&gt;/&lt;name&gt;/, Task status.workspace, The agent.</desc>
<style>
  svg { color-scheme:light dark } .background{fill:#fff} .ink{fill:#182b3d} .muted{fill:#405367}
  .box{stroke:#7890a6;stroke-width:1.5} .pure{fill:#e9f5ef} .adapter{fill:#f3f4f5} .process{fill:#fff2de}
  .arrow{fill:none;stroke:#405367;stroke-width:2;marker-end:url(#arrow)} .arrowhead{fill:#405367}
  @media (prefers-color-scheme: light) { .background{fill:#fff} .ink{fill:#182b3d} }
  @media (prefers-color-scheme: dark) { .background{fill:#101820} .ink{fill:#e6edf3} .muted{fill:#a9bdd0} .box{stroke:#71869a} .pure{fill:#173b2d} .adapter{fill:#202a33} .process{fill:#493517} .arrow{stroke:#a9bdd0} .arrowhead{fill:#a9bdd0} }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="arrowhead" d="M0 0 L10 5 L0 10 Z"/></marker></defs>
<rect class="background" width="900" height="318" rx="12"/>
<g font-family="system-ui,-apple-system,Segoe UI,sans-serif" class="ink">
<text x="20" y="34" font-size="19" font-weight="700">How a Workspace works</text>
<text x="20" y="70" font-size="13" font-weight="700" class="muted">in</text>
<text x="320" y="70" font-size="13" font-weight="700" class="muted">what it does</text>
<text x="620" y="70" font-size="13" font-weight="700" class="muted">out</text>
<rect class="box adapter" x="20" y="128" width="260" height="58" rx="8"/>
<text x="32" y="151" font-size="13.5" font-weight="650">Task spec.workspace</text>
<text x="32" y="171" font-size="12.5" class="muted">URLs, in order</text>
<rect class="box adapter" x="20" y="200" width="260" height="58" rx="8"/>
<text x="32" y="223" font-size="13.5" font-weight="650">The repositories</text>
<text x="32" y="243" font-size="12.5" class="muted">your checkout, or a bare source</text>
<rect class="box process" x="620" y="92" width="260" height="58" rx="8"/>
<text x="632" y="115" font-size="13.5" font-weight="650">&lt;root&gt;/&lt;key&gt;/&lt;name&gt;/</text>
<text x="632" y="135" font-size="12.5" class="muted">one directory per URL</text>
<rect class="box process" x="620" y="164" width="260" height="58" rx="8"/>
<text x="632" y="187" font-size="13.5" font-weight="650">Task status.workspace</text>
<text x="632" y="207" font-size="12.5" class="muted">key, place, dirs</text>
<rect class="box process" x="620" y="236" width="260" height="58" rx="8"/>
<text x="632" y="259" font-size="13.5" font-weight="650">The agent</text>
<text x="632" y="279" font-size="12.5" class="muted">starts in the first directory</text>
<rect class="box pure" x="320" y="92" width="260" height="202" rx="8"/>
<text x="450" y="166" font-size="14.5" font-weight="700" text-anchor="middle">The place&#x27;s runtime</text>
<text x="450" y="188" font-size="12.5" text-anchor="middle">workspace-git adds a worktree</text>
<text x="450" y="206" font-size="12.5" text-anchor="middle">per URL, on branch &lt;key&gt;,</text>
<text x="450" y="224" font-size="12.5" text-anchor="middle">cut from the base</text>
