<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 910" role="img" aria-labelledby="title desc">
<title id="title">Fleet execution architecture</title>
<desc id="desc">The CLI constructs store, runtime and forge adapters and calls manager verbs. The manager leases and reconciles Tasks and ChangeRequests through its built-in pure controllers. The Task controller drives sessions through the Runtime port. The ChangeRequest controller mirrors changes through the Forge port. The Forge controller follows declared changes, relays feedback and may request mark-ready. The PluginController host runs registered external controllers: pure plugin decisions pass through a gate before manager-owned writes, while the fleet-plugin adapter runs bounded observe and perform calls through fleet-exec. Runtime and Forge also use fleet-exec for bounded external processes. All layers share fleet-api contracts. The manager also calls the GatewayController, ConversationController and ListenerController, which reach chat platforms through a Gateway port and the fleet-gateway adapters, while a separate listener hands platform events to the fleet gateway receive verb, through which it also reports its own health.</desc>
