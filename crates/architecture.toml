# Fleet's architecture rules, enforced by crates/arch-rules (its
# `architecture` test) on every gate and CI run. docs/fleet/contracts.md explains
# each rule; the arch-rules crate docs say what static checking cannot see.
#
# The graph, bottom up:
#
#   fleet-api            pure   types and ports
#   fleet-controllers    pure   decisions          -> api
#   fleet-exec           adapter the one process spawner
#   fleet-store          adapter                   -> api
#   fleet-runtime        adapter runtime, term-bridge -> api, exec, term-stream
#   fleet-forge          adapter                   -> api, exec
#   fleet-gateway        adapter                   -> api, exec
#   fleet-plugin         adapter                   -> api, exec
#   fleet-telemetry      adapter OTLP export, off unless OTEL_* asks
#   fleet-manager        orchestration             -> api, controllers
#   fleet-cli            edge   parse, wire, print -> api, manager, store, runtime, forge, plugin, gateway, telemetry
#   arch-rules, fleet-dev  tooling
#
# The other components share the workspace and none of the graph above:
#
#   term-stream          the terminal stream's frames: a wire format
#   runtime-mux          component the multiplexer runtime: tmux, psmux, rmux -> term-stream
#   workspace-git        component makes workspaces from git URLs; runtimes run its program
#   thurbox              component the interface; reaches Fleet only by
#                                  running its CLI   -> term-stream, and
#                                  runtime-mux until Fleet drives its sessions
#
# docs/README.md is the rule between components: no Rust dependency crosses
# from one to another; term-stream, a wire format, is the one shared crate.

[crates.fleet-api]
role = "pure"
deps = []
external = ["serde", "serde_json", "thiserror", "toml"]
probes = ["fleet-store", "fleet-controllers", "fleet-exec", "fleet-runtime", "fleet-forge", "fleet-plugin", "fleet-gateway", "fleet-telemetry"]

[crates.fleet-controllers]
role = "pure"
deps = ["fleet-api"]
external = ["serde_json"]
probes = ["fleet-store", "fleet-runtime", "fleet-forge", "fleet-plugin", "fleet-manager", "fleet-exec", "fleet-gateway", "fleet-telemetry"]

# The only crate that starts a process: bounded, its whole tree killed past
# the bound.
[crates.fleet-exec]
role = "adapter"
deps = []

[crates.fleet-store]
role = "adapter"
deps = ["fleet-api"]

[crates.fleet-runtime]
role = "adapter"
deps = ["fleet-api", "fleet-exec", "term-stream"]

# The only crate that knows a forge CLI (`gh`, `glab`, `az`, `curl`) exists:
# every forge call is one
# bounded process through fleet-exec, and no forge-specific name appears
# above the port.
[crates.fleet-forge]
role = "adapter"
deps = ["fleet-api", "fleet-exec"]

# The only crate that will know a chat platform's client exists: every
# platform call is one bounded process through fleet-exec, the fake runs
# none, and no platform name appears above the Gateway port.
[crates.fleet-gateway]
role = "adapter"
deps = ["fleet-api", "fleet-exec"]

# The only crate that knows an OpenTelemetry SDK and exporter exist: it
# installs them as the process's providers when the OTEL_* variables ask.
# Every other crate records through the `opentelemetry` API alone, which is
# a no-op without a provider.
[crates.fleet-telemetry]
role = "adapter"
deps = []

[crates.fleet-plugin]
role = "adapter"
deps = ["fleet-api", "fleet-exec"]

[crates.fleet-manager]
role = "orchestration"
deps = ["fleet-api", "fleet-controllers"]

[crates.fleet-cli]
role = "edge"
deps = ["fleet-api", "fleet-manager", "fleet-runtime", "fleet-store", "fleet-forge", "fleet-plugin", "fleet-gateway", "fleet-telemetry"]
# The end-to-end tests speak the terminal stream to what `fleet attach` names.
dev_deps = ["term-stream"]
# Every write is the manager's: the CLI parses, calls a verb, and prints.
forbidden_methods = [
  "create", "create_fenced", "update_spec", "update_status", "append_inbox", "record_delivery",
  "record_relay", "remove_finalizer", "delete", "delete_fenced", "acquire_lease",
  "renew_lease", "release_lease", "reconcile", "probes", "create_dir", "remove_dir", "spawn", "release",
  "change", "mark_ready", "whoami", "call", "admit", "plugin_mutate",
  "history", "capabilities", "post", "react",
  "receive_event", "record_received", "record_beat", "record_refusal", "retire_conversation_task",
]

# Sessions on a terminal multiplexer, local or on a host over ssh or wsl.exe.
# Knows nothing of thurbox: what it needs from settings and from where
# thurbox keeps its files is passed in (`MuxSettings`, `HostsConfig`). Its
# module rules follow; the boundary's shape (the adapters are peers, only the
# factory names one) is crates/runtime-mux/tests/architecture_rules.rs.
[crates.runtime-mux]
role = "component"
deps = ["term-stream"]
# The crate root only declares and re-exports; `main` is the `runtime-mux`
# program's composition root, which calls the factory as an embedder does.
exempt = ["lib", "main"]
governed = ["tmux_compat"]

[crates.runtime-mux.modules]
# The host model a route names: pure data, the sink.
host = { use = [] }
# Pure values: the identity a window is stamped with, the hyperlink runs a
# pane records, what the embedder injects, and the TOML parse.
session_id = { use = [] }
hyperlink = { use = [] }
settings = { use = [] }
toml_file = { use = [] }
# Process lookups: `PATH` and the WSL distro this process runs in.
path_lookup = { use = [] }
# How a command reaches a machine: quoting, ssh and `wsl.exe` launchers.
# `host` for the one conversion from a host entry to its launcher.
shell = { use = ["host"] }
# `hosts.toml`: loading, WSL discovery and the loopback repair plan.
hosts = { use = ["host", "path_lookup", "shell", "toml_file"] }
# A host's `PATH` and the multiplexers on it, probed once and cached.
host_path = { use = ["host", "shell"] }
# Whether the binaries a session needs are installed.
preflight = { use = ["host", "path_lookup", "shell"] }
# The contract every adapter implements and the values that cross it. Names
# no adapter, no protocol helper and no host config: the bottom of the
# boundary.
contract = { use = [] }
# Which window is whose (ADR-25), over the listing the contract defines.
identity = { use = ["contract"] }
# Which server an instance's sessions live on (ADR-12).
instance = { use = ["host", "settings"] }
# The pane machinery every backend's stream is wired into: the reader loop,
# the vt100 parser, the signals it raises.
pane = { use = ["contract", "hyperlink", "identity", "osc8", "output_wake", "session_id"] }
osc8 = { use = ["hyperlink"] }
output_wake = { use = [] }
# A container of backends. Knows the contract and nothing that builds one.
registry = { use = ["host", "contract"] }
# The runtime protocol over one backend it is handed: the contract and nothing
# that builds one.
protocol = { use = ["contract", "identity", "workspace"] }
# The `workspace` verb's side: the runtime's config, the workspace-git program
# it runs, and its setup and teardown steps.
workspace = { use = [] }
# One pane as a terminal stream, over one backend it is handed.
view = { use = ["contract"] }
# What fills the registry: the only module that names an adapter.
wiring = { use = ["host", "shell", "settings", "contract", "registry", "tmux", "psmux", "rmux"] }
# The tmux command and control-mode protocol the adapters speak. Shared
# grammar, not an adapter: its root only declares the modules below.
tmux_compat = { use = [] }
"tmux_compat::server" = { use = [
  "host", "shell", "settings", "path_lookup", "host_path", "preflight", "contract",
  "identity", "instance", "session_id", "tmux_compat::control_mode", "tmux_compat::transport",
] }
"tmux_compat::control_mode" = { use = ["shell", "contract", "tmux_compat::transport"] }
"tmux_compat::transport" = { use = ["shell", "preflight"] }
# The adapters are peers: each reaches the protocol helper and never the
# other; nothing reaches one but the factory.
tmux = { use = [
  "host", "shell", "settings", "contract",
  "tmux_compat::control_mode", "tmux_compat::server", "tmux_compat::transport",
] }
psmux = { use = [
  "host", "shell", "settings", "contract", "instance",
  "tmux_compat::control_mode", "tmux_compat::server", "tmux_compat::transport",
] }
rmux = { use = [
  "host", "shell", "settings", "contract",
  "tmux_compat::control_mode", "tmux_compat::server", "tmux_compat::transport",
] }

# Makes a runtime's workspaces from git URLs: a worktree per URL, work
# preserved on release (docs/runtime/README.md, "workspace-git"). A runtime
# runs its program where its files belong; no crate links it.
[crates.workspace-git]
role = "component"
deps = []

# The terminal stream's frames and codec: a wire format, not a component.
# No process, no runtime, no transport; every component may depend on it.
[crates.term-stream]
role = "component"
deps = []

# The interface. Its module rules follow; checks particular to thurbox (the
# runtime gateways, session purity, atomic writes, the kernel's workers) are
# crates/thurbox/tests/architecture_rules.rs.
# Transitional: thurbox links the runtime directly until Fleet drives the
# runtimes (step 5 of the v3 migration), when this edge goes.
[crates.thurbox]
role = "component"
deps = ["runtime-mux", "term-stream"]
# The crate roots: the library, `main` and the `thurbox-cli` binary.
# `coordinator` is not exempt: it is `main`'s own body split across files, and
# "wires everything" was never the same claim as "may reach anything".
exempt = ["lib", "main", "thurbox-cli"]
# Every file module of these, at any depth, is a module of its own, so a new
# file there is a decision rather than something its parent's rule covers.
governed = ["agent", "config", "update"]

# `use` grants a module in any form; `path_only` only by a fully-qualified
# path, never an import, so the crossing stays visible at each call site.
[crates.thurbox.modules]
# Pure data: the dependency sink. No crate-internal references at all.
session = { use = [] }
# The downloads plugins and the updater make, and keyboard input. Never a
# session backend: the multiplexer runtime (`backend`) is reached through its
# own module. Every file is a module of its own, so a grant names what it
# reads and a file added here is reachable by nobody until that is decided.
# The root only declares them.
agent = { use = [] }
"agent::fetch" = { use = ["paths"] }
"agent::input" = { use = [] }
# thurbox's own config files beside config.toml. `config::file` is the one
# loader: where a file lives, seeding it, parsing it with unknown keys
# reported, and writing it back atomically. Each file is a module of its own
# so a consumer names the config it reads; none reaches another, so a file's
# degradation is its own.
config = { use = [] }
# automations.json beside settings.toml: the schedule thurbox keeps while
# Fleet has no schedule kind. The schedule math is `session`'s.
"config::automations" = { use = ["session", "config::file"] }
"config::file" = { use = ["paths"] }
# What the interface remembers between runs (`interface.json`): data in, the
# editor mode's type from `session`.
"config::interface_state" = { use = ["session", "config::file"] }
# hosts.toml in thurbox's config directory: the runtime's loader bound to
# `config::file`. A module of its own so that reading global host config is a
# visible decision.
"config::hosts" = { use = ["session", "config::file"] }
"config::settings" = { use = ["session", "config::file"] }
"config::themes" = { use = ["theme", "config::file"] }
# Self-update: whether a newer release exists, and installing it.
update = { use = [] }
"update::self_update" = { use = ["paths", "shell", "agent::fetch", "update::version_check"] }
"update::version_check" = { use = ["paths", "agent::fetch"] }
# The gateway to the multiplexer runtime (`runtime_mux`, ADR-41): its
# re-exports, and what thurbox injects into it: `session` for the settings
# type, `paths` for the data directory, `config::hosts` for the hosts the
# factory registers. Every crossing into the runtime is an edge to this
# module, judged by the item it names (the concrete-backend check).
backend = { use = ["session", "paths", "config::hosts"] }
git = { use = ["session", "paths", "shell"] }
# The theme presets and the user's overrides, in `ratatui` colours: data, but
# rendering data, which `session_is_pure_data` keeps out of the sink.
theme = { use = [] }
# The interface's diagnostic-log bridge (ADR-38), built by `coordinator`,
# which hands it the identity it exports under. The settings come from
# `session`.
telemetry = { use = ["session"] }
# Thin headless dispatch: must not depend on the TUI or the live backend.
# `kernel` for the two subcommands that drive the interface's own files:
# `plugin` (`check` loads the real host: the failures worth reporting are
# declaration-shaped, no `render`, an unplaced slot, a clashing key, and a
# syntax check passes all of them) and `config` (the interface directory and
# its `ui.json` overrides). Both are kernel-owned surfaces asked about from
# outside.
cli = { use = ["session", "paths", "notifications", "ui_control", "theme", "fleet_link"], path_only = [
  "kernel", "backend", "config::file", "config::hosts", "config::automations",
  "config::interface_state", "config::settings", "config::themes",
  "update::self_update", "update::version_check",
] }
# The plugin kernel: hosts the Lua VM the whole UI is written in. Builds the
# snapshot plugins render from Fleet's rows (`session` for the types, `paths`
# for the interface's files and plugin directories).
#
# `git` IS allowed, and the rule is about where: the worker-backed stores
# (`diff`, `repos`, `packages`, `command`) shell out to it off-thread, which
# is rule 5 rather than an exception to it. What must not happen is a `git`
# call from a render path; the loop's shape enforces that (a plugin returns a
# tree; it cannot call Rust), not this allowlist.
#
# Live agent terminals: `kernel::terminal` adopts a session's real pane
# through the backend contract and paints its vt100 screen. Those crossings
# are path-only, as `cli`'s are, so every one into the side-effect layer is
# visible at its call site.
kernel = { use = ["session", "paths", "git", "notifications", "theme", "fleet_link"], path_only = [
  "agent::fetch", "backend", "config::hosts", "config::automations",
  "config::interface_state", "config::settings", "config::themes",
  "update::self_update", "update::version_check",
] }
# The one way to a Fleet's command line (ADR-41): every `fleet` call the
# kernel and the CLI make becomes a process here, on this machine or through
# `shell`'s launchers, so neither of them launches anything itself. `session`
# for the `[fleets.<name>]` entry a link is built from.
fleet_link = { use = ["session", "shell"] }
# Leaf utilities.
paths = { use = [] }
ui_control = { use = ["paths"] }
# The runtime's launchers and quoting rules, re-exported: a module of its own
# so a grant still says which modules may launch anything.
shell = { use = [] }
workspace = { use = ["paths"] }
# `main`'s own body, split across files: the loop, the workers and the
# chrome. It is the one module whose job is to wire the layers together, so
# its list is the widest; but it is a list, and a new layer reached from the
# loop is a decision recorded here rather than an exemption. It reaches the
# library by its crate name (`thurbox::`), the only spelling a binary has.
coordinator = { use = [
  "clipboard", "fleet_link", "kernel", "notifications", "paths", "session", "shell", "telemetry",
  "ui_control", "agent::input", "backend", "config::interface_state",
] }
# Leaf side-effect module: OS desktop notifications. Knows `session` (for
# `SessionId`), `paths` (for `PATH` lookups) and `shell` (the shared quoting
# rules; it grew a third copy of the PowerShell one before this was allowed).
notifications = { use = ["session", "paths", "shell"] }
# Leaf side-effect module: clipboard writes (native and OSC 52). Knows
# `session` only for the `ClipboardProvider` setting; writes to the tty and
# never reaches into agent or the interface.
clipboard = { use = ["paths", "session"] }

# What of the runtime a consumer must never reach by name: one multiplexer's
# adapter, or the protocol grammar only some multiplexers speak. Every verb a
# consumer needs (lifecycle, pane I/O, status, the heartbeat) goes through the
# contract. The `backend` gateway re-exports them, and nothing else may.
[[crates.thurbox.restricted]]
paths = ["runtime_mux::tmux", "runtime_mux::psmux", "runtime_mux::rmux", "runtime_mux::tmux_compat"]
allowed = ["backend"]
why = "consumers reach the runtime through the contract, never a concrete backend"

# The factory that fills the registry, reached only by the composition root
# (`main`'s body): a consumer that builds its own registry sees a different set
# of backends from the one the process was wired with.
[[crates.thurbox.restricted]]
paths = ["thurbox::backend::wiring", "runtime_mux::wiring"]
allowed = ["backend", "coordinator"]
why = "only the composition root builds the registry"

# A specific multiplexer is named only where a route is decided (`session`,
# the route grammar and its defaults). Anywhere else, `Multiplexer::Psmux`
# is a consumer choosing behaviour, or an OS, by multiplexer. A test may name
# the one it pins.
[[crates.thurbox.restricted]]
paths = [
  "runtime_mux::host::multiplexer::Multiplexer::Tmux",
  "runtime_mux::host::multiplexer::Multiplexer::Psmux",
  "runtime_mux::host::multiplexer::Multiplexer::Rmux",
  "runtime_mux::host::multiplexer::Multiplexer::Herdr",
]
allowed = ["session"]
production_only = true
why = "which multiplexer serves a session is the route's decision"

# Everything a user edits or thurbox reads back, through `std::fs` or
# `tokio::fs`, goes through `paths::write_atomically`, which a crash, a full
# disk or a second writer cannot leave half-written. A truncated
# `agents.toml`, manifest or plugin lock is a broken install; a cut log line
# or a stale cache is not. Each
# exception is exact, so a further write in an allowed file needs its own
# reason, and a write that moves to the atomic writer takes its exception
# with it.
[[crates.thurbox.restricted]]
paths = ["std::fs::write", "tokio::fs::write"]
allowed = ["paths"]
production_only = true
why = "write it through paths::write_atomically"
exceptions = [
  { file = "update/version_check.rs", sites = 1, why = "a cache: one that fails to parse is fetched again" },
  { file = "ui_control.rs", sites = 2, why = "stages the instance file under a private mode (Unix) or owner ACL (Windows), then renames it" },
]

[[crates.thurbox.restricted]]
paths = ["std::fs::copy", "tokio::fs::copy"]
allowed = ["paths"]
production_only = true
why = "write it through paths::write_atomically"
exceptions = [
  { file = "update/self_update.rs", sites = 1, why = "copies the new binary onto a staged .new file that is renamed into place" },
]

[[crates.thurbox.restricted]]
paths = ["std::fs::File::create", "tokio::fs::File::create"]
allowed = ["paths"]
production_only = true
why = "write it through paths::write_atomically"
exceptions = [
  { file = "ui_control.rs", sites = 1, why = "creates the empty audit log on Windows so its ACL is set before the first append" },
]

[[crates.thurbox.restricted]]
paths = ["std::fs::OpenOptions::new", "tokio::fs::OpenOptions::new"]
allowed = ["paths"]
production_only = true
why = "write it through paths::write_atomically"
exceptions = [
  { file = "kernel/snapshot/fleet.rs", sites = 1, why = "fleet up's standard error, created exclusively, unlinked once spawned and read once it exits" },
  { file = "clipboard.rs", sites = 1, why = "opens /dev/tty to send an OSC 52 sequence, not a file" },
  { file = "ui_control.rs", sites = 2, why = "appends to the control audit log, on Unix and on Windows" },
]

[crates.arch-rules]
role = "tooling"
deps = []

[crates.fleet-dev]
role = "tooling"
deps = ["fleet-exec"]

[pure]
forbidden_paths = [
  "std::fs", "std::process", "std::net", "std::env", "std::thread", "std::os",
  "std::io", "std::time::SystemTime", "std::time::Instant",
  "std::println", "std::eprintln", "std::print", "std::eprint", "std::dbg",
  "std::option_env", "std::include", "std::include_str", "std::include_bytes",
]
clippy_guards = [
  "std::fs::File", "std::process::Command", "std::time::Instant", "std::time::SystemTime",
  "std::env::var", "std::fs::read", "std::thread::sleep",
]

# Who may name each field manager. Naming one is how code writes as it, and
# how a caller of the typed inbox mutations names itself: `Cli` appends to
# `Task.status.inbox` through the manager's `send` verb and owns nothing;
# `ForgeController` owns `Task.status.forge` and `GatewayController`
# `Task.status.gateway`, each appending through the manager's relay write.
# `Listener` is an account's listener program,
# speaking through the manager's receive verb: it spools deliveries on a
# Conversation and records beats on its Listener, and owns nothing;
# `ConversationController` and `ListenerController` own the rest of those
# two kinds and are named by the controllers alone; `ConversationController`
# is also the one creator of a conversation Task, through the manager's
# fenced create, and the only writer that may set the
# `gateway.fleet.dev/conversation` labels.
[status_writers]
"fleet_api::store::FieldManager::Plugin" = ["fleet-api", "fleet-controllers"]
"fleet_api::store::FieldManager::TaskController" = ["fleet-api", "fleet-controllers"]
"fleet_api::store::FieldManager::ChangeRequestController" = ["fleet-api", "fleet-controllers"]
"fleet_api::store::FieldManager::ForgeController" = ["fleet-api", "fleet-controllers"]
"fleet_api::store::FieldManager::GatewayController" = ["fleet-api", "fleet-controllers"]
"fleet_api::store::FieldManager::ConversationController" = ["fleet-api", "fleet-controllers"]
"fleet_api::store::FieldManager::ListenerController" = ["fleet-api", "fleet-controllers"]
"fleet_api::store::FieldManager::Worker" = ["fleet-api", "fleet-manager"]
"fleet_api::store::FieldManager::Apply" = ["fleet-api", "fleet-manager", "fleet-store"]
"fleet_api::store::FieldManager::Cli" = ["fleet-api", "fleet-manager", "fleet-store"]
"fleet_api::store::FieldManager::Listener" = ["fleet-api", "fleet-manager", "fleet-store"]

# A restricted path binds the roles and crates its rule names in
# `applies_to`, except the crates it allows. Fleet's rules name every role but
# `component`: they are Fleet's, and another component keeps its own.

# One crate starts processes, so every program fleet runs (a runtime, the
# gate's tools) is bounded and has its tree killed the same way.
[[restricted]]
applies_to = ["pure", "adapter", "orchestration", "edge", "tooling"]
path = "std::process::Command"
allowed = ["fleet-exec"]
why = "every external program goes through fleet-exec: bounded and tree-killed"

[[restricted]]
applies_to = ["pure", "adapter", "orchestration", "edge", "tooling"]
path = "std::os::unix::process"
allowed = ["fleet-exec"]
why = "process groups and signals belong to fleet-exec"

[[restricted]]
applies_to = ["pure", "adapter", "orchestration", "edge", "tooling"]
path = "std::os::windows::process"
allowed = ["fleet-exec"]
why = "creation flags and job objects belong to fleet-exec"

[[restricted]]
applies_to = ["pure", "adapter", "orchestration", "edge", "tooling"]
path = "process_wrap"
allowed = ["fleet-exec"]
why = "a second way to start a process would bypass fleet-exec's bounds"

# Telemetry leaves the process through one crate, so what is exported, its
# batching and its shutdown bound are decided in one place.
[[restricted]]
applies_to = ["pure", "adapter", "orchestration", "edge", "tooling"]
path = "opentelemetry_sdk"
allowed = ["fleet-telemetry"]
why = "the SDK's providers, batching and shutdown belong to fleet-telemetry"

[[restricted]]
applies_to = ["pure", "adapter", "orchestration", "edge", "tooling"]
path = "opentelemetry_otlp"
allowed = ["fleet-telemetry"]
why = "the OTLP exporter, the one network client telemetry has, belongs to fleet-telemetry"

# The Forge port carries Fleet's one forge write, `mark_ready`. The port is
# defined by the API, implemented by fleet-forge, wired by the CLI and
# performed by the manager alone, after the intent is written and the lease
# renewed: no other adapter and no controller holds a handle that could
# mutate a change.
[[restricted]]
applies_to = ["pure", "adapter", "orchestration", "edge", "tooling"]
path = "fleet_api::forge::Forge"
allowed = ["fleet-api", "fleet-manager", "fleet-forge", "fleet-cli"]
why = "only the manager performs the mark-ready effect, through the port the CLI wired"

# The Gateway port carries Fleet's chat writes, `open`, `post` and `react`. As the
# Forge port, it is defined by the API, implemented by fleet-gateway, wired
# by the CLI and performed by the manager alone, after the intent is written
# and the lease renewed: no other adapter and no controller holds a handle
# that could post in a thread.
[[restricted]]
applies_to = ["pure", "adapter", "orchestration", "edge", "tooling"]
path = "fleet_api::gateway::Gateway"
allowed = ["fleet-api", "fleet-manager", "fleet-gateway", "fleet-cli"]
why = "only the manager performs the open, post and react effects, through the port the CLI wired"

[[restricted]]
applies_to = ["pure", "adapter", "orchestration", "edge", "tooling"]
path = "fleet_api::plugin::Plugins"
allowed = ["fleet-api", "fleet-plugin", "fleet-manager", "fleet-cli"]
why = "only the manager may invoke plugin observer and effect calls"
