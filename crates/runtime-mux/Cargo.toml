[package]
name = "runtime-mux"
version = "0.0.0-dev"
edition = "2021"
rust-version = "1.95"
build = "build.rs"
authors = ["LeTuR"]
license = "MIT"
description = "Agent sessions on a terminal multiplexer (tmux, psmux, rmux), locally or on a remote host"
repository = "https://github.com/Thurbeen/thurbox"
publish = false

[lib]
name = "runtime_mux"

[[bin]]
name = "runtime-mux"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
term-stream = { path = "../term-stream" }
otel-env = { path = "../otel-env" }
opentelemetry-appender-tracing = { version = "0.33.1", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
toml = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std"] }
unicode-width = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
vt100 = "0.18"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
proptest = "1"
libc = "0.2"

[features]
test-support = []
