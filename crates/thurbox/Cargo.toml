[package]
name = "thurbox"
version = "0.0.0-dev"
edition = "2021"
rust-version = "1.95"
build = "build.rs"
default-run = "thurbox"
authors = ["LeTuR"]
license = "MIT"
description = "A TUI for orchestrating multiple coding-agent CLI sessions in persistent tmux panels"
repository = "https://github.com/Thurbeen/thurbox"
keywords = ["tui", "agent", "tmux", "git", "cli"]
categories = ["command-line-utilities"]

[dependencies]
runtime-mux = { path = "../runtime-mux" }
process-wrap = { workspace = true }
term-stream = { path = "../term-stream" }

ratatui = "0.30"
crossterm = "0.29"
tui-term = "0.3"

vt100 = "0.18"

regex = "1.13"

unicode-width = "0.2"

base64 = "0.23"

sha2 = "0.11"

mlua = { version = "0.12", default-features = false, features = ["lua54", "vendored"] }
notify = "9.0"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "signal", "net", "fs"] }

uuid = { version = "1", features = ["v4", "serde"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

serde = { version = "1", features = ["derive"] }
toml = "1.0"
toml_edit = "0.25"

opentelemetry = { version = "0.33.1", default-features = false, features = ["trace"] }
opentelemetry-appender-tracing = { version = "0.33.1", default-features = false }
otel-env = { path = "../otel-env" }

sysinfo = "0.40"

anyhow = "1.0"

arboard = { version = "3", default-features = false }

serde_json = "1"

clap = { version = "4", features = ["derive"] }

serde_ignored = "0.1.14"

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
crossterm_winapi = "0.9"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[[bin]]
name = "thurbox-cli"
path = "src/bin/thurbox-cli.rs"

[package.metadata.dev-tools]
prek = "0.2.0"
cocogitto = "6.2.0"
cargo-nextest = "0.9.0"
cargo-deny = "0.16.0"
cargo-audit = "0.21.0"
rumdl = "0.1.19"

[[bench]]
name = "frame_cost"
harness = false

[[bench]]
name = "search_cost"
harness = false

[dev-dependencies]
runtime-mux = { path = "../runtime-mux", features = ["test-support"] }

tempfile = "3"

proptest = "1"

opentelemetry-proto = { version = "0.33.1", default-features = false, features = ["gen-tonic-messages", "trace", "metrics", "logs"] }
prost = "0.14"

libc = "0.2"

[target.'cfg(target_os = "linux")'.dev-dependencies]
zbus = { version = "6.1.0", default-features = false, features = ["tokio", "service"] }
