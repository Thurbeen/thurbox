[package]
name = "otel-env"
description = "OpenTelemetry export from the standard OTEL_* variables, the same in every program: off unless they name a collector."
version = "0.0.0-dev"
# thurbox and runtime-mux depend on it, so it builds on their edition and
# MSRV as well as Fleet's.
edition = "2021"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/Thurbeen/thurbox"
publish = false

[dependencies]
# The logs signal is compiled in for every program and asked for at run time
# by the one that records logs (thurbox), so feature unification never
# changes what another program reads.
opentelemetry = { workspace = true, features = ["logs"] }
opentelemetry_sdk = { workspace = true, features = ["logs"] }
opentelemetry-otlp = { workspace = true, features = ["logs"] }

[lints]
workspace = true
