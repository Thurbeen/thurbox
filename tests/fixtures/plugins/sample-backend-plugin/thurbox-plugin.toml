name = "sample-backend-plugin"
version = "0.1.0"
description = "Reference plugin contributing a 'sample' backend over a Unix socket"
author = "Thurbox example"
thurbox_plugin_api = 1

[process]
# The integration test rewrites this path before spawning the runtime so it
# points at the compiled `target/debug/examples/sample-backend-plugin`.
exec = "bin/sample-backend-plugin"
capabilities = ["backend"]
activation_events = ["onBackendSelected:sample"]

[[contributes.configuration]]
key = "echo_greeting"
type = "bool"
default = true
description = "Whether to send a greeting line on each new session"
