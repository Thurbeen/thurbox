[global]
# Skill and command files start with frontmatter and no h1, which MD041 rejects.
exclude = [".git", ".agents", ".claude", ".pi", ".opencode"]

[MD013]
line_length = 100
tables = false
code_blocks = false

[MD033]
allowed_elements = [
  "table", "tr", "td", "img", "picture", "source", "a", "br", "div",
  # GitHub renders markdown emphasis inside raw HTML inconsistently, so <summary> takes <b>.
  "details", "summary", "b",
]
