# Markdown lint, run by cargo xtask check markdown.
[global]
# The agent-tooling trees. A SKILL.md opens with YAML frontmatter rather than
# an h1, which MD041 rejects without anything being wrong with it — the file
# follows the skill convention, not the document convention. That holds at
# any depth: the bundled VEGA starter keeps its skills under its own .agents.
exclude = [".git", ".agents", ".claude", "**/.agents/**"]

[MD013]
# This repo's prose is hand-wrapped at 80.
line_length = 80
tables = false
code_blocks = false
