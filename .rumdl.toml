[global]
# The agent-tooling dirs plus "openspec": both the OpenSpec skills/commands and
# the change artifacts are generated from the CLI's own templates, so linting
# them would block commits on prose we don't author.
exclude = [".git", ".claude", ".pi", ".opencode", "openspec"]

[MD013]
line_length = 100
# Allow longer lines in tables and code blocks
tables = false
code_blocks = false

[MD033]
# Allow the HTML used for the README feature-wall layout
allowed_elements = [
  "table", "tr", "td", "img", "picture", "source", "a", "br", "div",
  # The README collapses its secondary install routes behind a disclosure;
  # <summary> takes <b> rather than ** because markdown emphasis inside raw
  # HTML renders inconsistently.
  "details", "summary", "b",
]
