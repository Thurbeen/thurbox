# The built-in "sessions-skill" extension.
#
# Installs one agent skill — `thurbox-sessions` — into every coding CLI's
# *personal* skill directory, so an agent in any thurbox session knows how to
# find the other sessions, read their context without disturbing them, and hand
# them a message or a prompt safely.
#
# It is `ui-skill`'s twin and ships the same way, for the same reason: an agent
# does not know other sessions are reachable until something tells it, and a
# user will not go looking for the extension that does. Opt out with:
#
#     thurbox-cli extension deactivate sessions-skill
#
# No session, no automation, no agent: one Markdown file delivered to a handful
# of well-known paths. SKILL.md carries the managed marker, so a copy the user
# took ownership of (marker line dropped) is left alone by `install`/`update`/
# `uninstall`; `reinstall` and `install --force` still overwrite.
#
# The skill teaches only commands `thurbox-cli` already has, and hard-codes no
# paths or ids: the caller's own identity comes from `THURBOX_SESSION`.

name = "sessions-skill"
description = "Teach any coding agent how to read and message other thurbox sessions (the `thurbox-sessions` skill)"
config_version = 1
version = "1.0.0"                # this extension's own version; bump on changes
min_thurbox_version = "0.113.0"  # needs the `extension install`/self-heal machinery
# No `home`, deliberately — see ui-skill's manifest: the built-in path pins
# `<config>/extensions/sessions-skill`, which is what the default resolves to.

[[files]]
path = "README.md"

# --- the skill, delivered to each CLI's personal skill dir ---------------------
#
# The same five destinations as ui-skill, each guarded by `requires_dir` so a CLI
# the user has not installed is a no-op. One payload serves them all.

# claude (Claude Code); opencode also reads this location.
[[external_files]]
path = "~/.claude/skills/thurbox-sessions/SKILL.md"
source = "SKILL.md"
requires_dir = "~/.claude"

# codex (OpenAI Codex CLI)
[[external_files]]
path = "~/.codex/skills/thurbox-sessions/SKILL.md"
source = "SKILL.md"
requires_dir = "~/.codex"

# opencode — its native global skill dir
[[external_files]]
path = "~/.config/opencode/skills/thurbox-sessions/SKILL.md"
source = "SKILL.md"
requires_dir = "~/.config/opencode"

# copilot (GitHub Copilot CLI)
[[external_files]]
path = "~/.copilot/skills/thurbox-sessions/SKILL.md"
source = "SKILL.md"
requires_dir = "~/.copilot"

# The agent-neutral shared personal location; written only if ~/.agents exists.
[[external_files]]
path = "~/.agents/skills/thurbox-sessions/SKILL.md"
source = "SKILL.md"
requires_dir = "~/.agents"
