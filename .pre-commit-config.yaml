default_stages: [pre-commit]
# Two speeds. A commit runs what is fast and catches most mistakes (format,
# clippy, the linters). A push runs what needs a full build or the network: the
# suite, rustdoc, cargo-deny and the Windows cross-check. The suite on every
# commit made each commit cost minutes; nothing reaches the pull request
# without passing the push stage, and CI stays the full gate.
#
# Commit messages are not walked at push: squash merge discards them, and the
# pull request title (.github/workflows/pr-title.yml) is the commit that lands.
default_install_hook_types:
  - commit-msg
  - pre-commit
  - pre-push
repos:
  - repo: local
    hooks:
      # Conventional commit validation (commit-msg stage)
      - id: cocogitto-verify
        name: Verify conventional commit message
        entry: cog verify
        language: system
        stages: [commit-msg]
        args: ["--file"]

      # Code quality (pre-commit stage)
      - id: cargo-fmt
        name: Cargo format check
        entry: cargo fmt
        language: system
        types: [rust]
        pass_filenames: false
        # `--check`, or this hook reformats every file in the workspace including
        # ones the developer did not stage — surprising, and not what its name
        # says. Matches `just fmt-check` and the CI job.
        args: ["--all", "--", "--check"]

      - id: cargo-clippy
        name: Cargo clippy
        entry: cargo clippy
        language: system
        types: [rust]
        pass_filenames: false
        args: ["--all-targets", "--all-features", "--", "-D", "warnings"]

      # No `cargo check`: clippy above type-checks the same targets (the reason
      # CI dropped its check job too).

      # The `Windows (clippy)` CI job, cross-checked from Linux (`just
      # clippy-windows`): code unused only under cfg(windows) otherwise fails
      # only after the push.
      - id: cargo-clippy-windows
        name: Cargo clippy (Windows target)
        entry: just clippy-windows
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-push]

      # git exports its location variables to a hook, and a test that runs git
      # in a scratch repository would act on this one instead. Fleet's tests
      # run git, cog and Fleet's own binaries without scrubbing them, so the
      # suite starts without them.
      - id: cargo-nextest
        name: Cargo nextest
        entry: env -u GIT_DIR -u GIT_WORK_TREE -u GIT_INDEX_FILE -u GIT_COMMON_DIR -u GIT_OBJECT_DIRECTORY -u GIT_ALTERNATE_OBJECT_DIRECTORIES -u GIT_PREFIX -u GIT_NAMESPACE cargo nextest run
        language: system
        types: [rust]
        pass_filenames: false
        args: ["--all"]
        stages: [pre-push]

      # No separate architecture-rules hook: tests/architecture_rules.rs is an
      # ordinary integration test, so the suite above already runs it.

      - id: cargo-deny-advisories
        name: Cargo deny advisories
        entry: cargo deny check advisories
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: cargo-deny-bans-licenses-sources
        name: Cargo deny bans licenses sources
        entry: cargo deny check bans licenses sources
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: cargo-doc
        name: Cargo doc
        entry: env RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --all-features
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: bash-install-tests
        name: Bash install script tests
        # From PATH: an absolute ~/.local/bin path fails under the flake (nix store),
        # under the package-manager route docs/thurbox/development.md documents, and in CI.
        entry: bats scripts/install.bats
        language: system
        files: scripts/install\.(sh|bats)
        pass_filenames: false

      - id: shellcheck
        name: ShellCheck
        entry: shellcheck
        language: system
        types: [shell]

      # Before the lint itself: an older local rumdl passes markdown that CI's
      # pinned one fails.
      - id: rumdl-version
        name: Markdown linter matches CI
        entry: scripts/ci/check-rumdl-version.sh
        language: system
        files: (\.md|^\.rumdl\.toml|^scripts/ci/check-rumdl-version\..*)$
        pass_filenames: false

      # CI twin: the `Markdown Lint` job.
      - id: rumdl-version-tests
        name: Markdown linter version check tests
        entry: bats scripts/ci/check-rumdl-version.bats
        language: system
        files: ^(scripts/ci/check-rumdl-version\..*|\.github/workflows/ci\.yml)$
        pass_filenames: false

      - id: rumdl-check
        name: Markdown lint check
        entry: rumdl check .
        language: system
        types: [markdown]
        pass_filenames: false

      # The plugin interface. `selene` also enforces the VM's sandbox: its
      # standard library (`thurbox.yml`) declares only what `plugin_stdlib`
      # grants, so a plugin reaching for `os` or `io` fails here rather than at
      # runtime.
      - id: selene
        name: Lua lint
        entry: selene ui examples
        language: system
        types: [lua]
        pass_filenames: false

      - id: stylua
        name: Lua format check
        entry: stylua --check ui examples
        language: system
        types: [lua]
        pass_filenames: false

      # Website linting (pre-commit stage)
      # Page .html files carry YAML front matter and are partial templates, so
      # Prettier/HTMLHint run on the CSS/JS sources and on the *built* _site
      # output rather than the page sources.
      - id: prettier-check
        name: Prettier format check
        entry: npx prettier --check
        language: system
        files: ^(website/.*\.(css|js)|eleventy\.config\.js)$
        pass_filenames: true

      - id: htmlhint
        name: HTMLHint (built site)
        entry: sh -c 'npx @11ty/eleventy --quiet && npx htmlhint "_site/**/*.html"' --
        language: system
        files: ^(website/|website/_includes/|eleventy\.config\.js)
        pass_filenames: false

      - id: stylelint
        name: Stylelint
        entry: npx stylelint
        language: system
        files: ^website/.*\.css$
        pass_filenames: true

      - id: eslint
        name: ESLint
        entry: npx eslint
        language: system
        files: ^website/.*\.js$
        pass_filenames: true

  # Every committed version of a file stays in the history each clone
  # downloads: re-recorded demo GIFs/MP4s grew the pack to 478 MiB while the
  # tree is 39 MiB. prek's Rust-native copy of pre-commit-hooks'
  # check-added-large-files, so nothing is fetched. `--enforce-all` weighs a
  # modified file too, not only an added one, which is what CI's `--all-files`
  # run (the `Large Files` job) checks. The exclusions are the files already
  # over the cap when it arrived: shrink one and drop it, never add to them.
  - repo: builtin
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024", "--enforce-all"]
        exclude: ^website/assets/performance-v2-observations\.json$
