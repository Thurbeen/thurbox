default_stages: [pre-commit]
default_install_hook_types:
  - commit-msg
  - pre-commit
  - pre-push
repos:
  - repo: local
    hooks:
      # Conventional commit validation (commit-msg stage)
      - id: cocogitto-verify
        name: Verify conventional commit message
        entry: cog verify
        language: system
        stages: [commit-msg]
        args: ["--file"]

      # Code quality (pre-commit stage)
      - id: cargo-fmt
        name: Cargo format check
        entry: cargo fmt
        language: system
        types: [rust]
        pass_filenames: false
        # `--check`, or this hook reformats every file in the workspace including
        # ones the developer did not stage — surprising, and not what its name
        # says. Matches `just fmt-check` and the CI job.
        args: ["--all", "--", "--check"]

      - id: cargo-clippy
        name: Cargo clippy
        entry: cargo clippy
        language: system
        types: [rust]
        pass_filenames: false
        args: ["--all-targets", "--all-features", "--", "-D", "warnings"]

      - id: cargo-check
        name: Cargo check
        entry: cargo check
        language: system
        types: [rust]
        pass_filenames: false
        args: ["--all"]

      - id: cargo-nextest
        name: Cargo nextest
        entry: cargo nextest run
        language: system
        types: [rust]
        pass_filenames: false
        args: ["--all"]

      - id: architecture-rules
        name: Architecture rules
        entry: cargo test --test architecture_rules
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-deny-advisories
        name: Cargo deny advisories
        entry: cargo deny check advisories
        language: system
        pass_filenames: false
        always_run: true

      - id: cargo-deny-bans-licenses-sources
        name: Cargo deny bans licenses sources
        entry: cargo deny check bans licenses sources
        language: system
        pass_filenames: false
        always_run: true

      - id: cargo-doc
        name: Cargo doc
        entry: env RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --all-features
        language: system
        pass_filenames: false
        always_run: true

      - id: bash-install-tests
        name: Bash install script tests
        # From PATH: an absolute ~/.local/bin path fails under the flake (nix store),
        # under the package-manager route docs/DEVELOPMENT.md documents, and in CI.
        entry: bats scripts/install.bats
        language: system
        files: scripts/install\.(sh|bats)
        pass_filenames: false

      - id: extension-script-tests
        name: Extension script tests
        # The extensions' shell scripts have bats files beside them; without
        # this hook (and its CI twin) nothing ran them, so the guards they add
        # pinned nothing. Globbed rather than passed filenames: a .bats file
        # and the .sh it drives are different paths, and either changing means
        # the whole suite should run.
        entry: bash -c 'bats extensions/*/scripts/*.bats'
        language: system
        files: ^extensions/.*\.(sh|bats)$
        pass_filenames: false

      - id: shellcheck
        name: ShellCheck
        entry: shellcheck
        language: system
        types: [shell]

      - id: rumdl-check
        name: Markdown lint check
        entry: rumdl check .
        language: system
        types: [markdown]
        pass_filenames: false

      # The plugin interface. `selene` also enforces the VM's sandbox: its
      # standard library (`thurbox.yml`) declares only what `plugin_stdlib`
      # grants, so a plugin reaching for `os` or `io` fails here rather than at
      # runtime.
      - id: selene
        name: Lua lint
        entry: selene ui examples
        language: system
        types: [lua]
        pass_filenames: false

      - id: stylua
        name: Lua format check
        entry: stylua --check ui examples
        language: system
        types: [lua]
        pass_filenames: false

      # Website linting (pre-commit stage)
      # Page .html files carry YAML front matter and are partial templates, so
      # Prettier/HTMLHint run on the CSS/JS sources and on the *built* _site
      # output rather than the page sources.
      - id: prettier-check
        name: Prettier format check
        entry: npx prettier --check
        language: system
        files: ^(website/.*\.(css|js)|eleventy\.config\.js)$
        pass_filenames: true

      - id: htmlhint
        name: HTMLHint (built site)
        entry: sh -c 'npx @11ty/eleventy --quiet && npx htmlhint "_site/**/*.html"' --
        language: system
        files: ^(website/|website/_includes/|eleventy\.config\.js)
        pass_filenames: false

      - id: stylelint
        name: Stylelint
        entry: npx stylelint
        language: system
        files: ^website/.*\.css$
        pass_filenames: true

      - id: eslint
        name: ESLint
        entry: npx eslint
        language: system
        files: ^website/.*\.js$
        pass_filenames: true

      - id: cocogitto-check
        name: Check commit history
        entry: cog check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
