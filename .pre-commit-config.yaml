default_stages: [pre-commit]
default_install_hook_types:
  - commit-msg
  - pre-commit
  - pre-push
repos:
  - repo: local
    hooks:
      - id: cocogitto-verify
        name: Verify conventional commit message
        entry: cog verify
        language: system
        stages: [commit-msg]
        args: ["--file"]

      - id: cargo-fmt
        name: Cargo format check
        entry: cargo fmt
        language: system
        types: [rust]
        pass_filenames: false
        args: ["--all", "--", "--check"]

      - id: cargo-clippy
        name: Cargo clippy
        entry: cargo clippy
        language: system
        types: [rust]
        pass_filenames: false
        args: ["--all-targets", "--all-features", "--", "-D", "warnings"]

      - id: cargo-clippy-windows
        name: Cargo clippy (Windows target)
        entry: just clippy-windows
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-push]

      # git exports its location variables to a hook, and the suite must not inherit them.
      - id: cargo-nextest
        name: Cargo nextest
        entry: env -u GIT_DIR -u GIT_WORK_TREE -u GIT_INDEX_FILE -u GIT_COMMON_DIR -u GIT_OBJECT_DIRECTORY -u GIT_ALTERNATE_OBJECT_DIRECTORIES -u GIT_PREFIX -u GIT_NAMESPACE cargo nextest run
        language: system
        types: [rust]
        pass_filenames: false
        args: ["--all"]
        stages: [pre-push]

      - id: cargo-deny-advisories
        name: Cargo deny advisories
        entry: cargo deny check advisories
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: cargo-deny-bans-licenses-sources
        name: Cargo deny bans licenses sources
        entry: cargo deny check bans licenses sources
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: cargo-doc
        name: Cargo doc
        entry: env RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --all-features
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: bash-install-tests
        name: Bash install script tests
        entry: bats scripts/install.bats
        language: system
        files: scripts/install\.(sh|bats)
        pass_filenames: false

      - id: shellcheck
        name: ShellCheck
        entry: shellcheck
        language: system
        types: [shell]

      - id: rumdl-version
        name: Markdown linter matches CI
        entry: scripts/ci/check-rumdl-version.sh
        language: system
        files: (\.md|^\.rumdl\.toml|^scripts/ci/check-rumdl-version\..*)$
        pass_filenames: false

      - id: rumdl-version-tests
        name: Markdown linter version check tests
        entry: bats scripts/ci/check-rumdl-version.bats
        language: system
        files: ^(scripts/ci/check-rumdl-version\..*|\.github/workflows/ci\.yml)$
        pass_filenames: false

      - id: rumdl-check
        name: Markdown lint check
        entry: rumdl check .
        language: system
        types: [markdown]
        pass_filenames: false

      - id: selene
        name: Lua lint
        entry: selene ui examples
        language: system
        types: [lua]
        pass_filenames: false

      - id: stylua
        name: Lua format check
        entry: stylua --check ui examples
        language: system
        types: [lua]
        pass_filenames: false

      - id: prettier-check
        name: Prettier format check
        entry: npx prettier --check
        language: system
        files: ^(website/.*\.(css|js)|eleventy\.config\.js)$
        pass_filenames: true

      - id: htmlhint
        name: HTMLHint (built site)
        entry: sh -c 'npx @11ty/eleventy --quiet && npx htmlhint "_site/**/*.html"' --
        language: system
        files: ^(website/|website/_includes/|eleventy\.config\.js)
        pass_filenames: false

      - id: stylelint
        name: Stylelint
        entry: npx stylelint
        language: system
        files: ^website/.*\.css$
        pass_filenames: true

      - id: eslint
        name: ESLint
        entry: npx eslint
        language: system
        files: ^website/.*\.js$
        pass_filenames: true

  - repo: builtin
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024", "--enforce-all"]
