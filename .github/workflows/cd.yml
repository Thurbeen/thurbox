name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]

# Prevent concurrent releases
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Analyze commits and determine if release is needed
  check-release:
    name: Analyze commits for release
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.parse.outputs.should_release }}
      version: ${{ steps.parse.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0  # Full history for cocogitto

      - name: Check for releasable commits
        # Pinned to v4.2.0 (same SHA as the other cocogitto-action steps below);
        # used here in install-only mode to provide the `cog` binary.
        uses: cocogitto/cocogitto-action@52d0023b4396897f1815648e553db2ab8d782f3a # v4.2.0
        id: check
        with:
          install-only: true

      - name: Parse release decision
        id: parse
        run: |
          # cog prints the next tag (e.g. "v0.99.1") when a bump is due, but a
          # human-readable "No conventional commits…" message when none is. Match
          # only a real semver so that non-bump message never reaches
          # $GITHUB_OUTPUT — writing its multi-line text there previously failed
          # this step (and the whole workflow) on every docs/ci/chore push.
          RAW="$(cog bump --auto --disable-bump-commit --dry-run 2>/dev/null || true)"
          echo "cog output: $RAW"
          VERSION="$(printf '%s\n' "$RAW" | grep -oE '^v?[0-9]+\.[0-9]+\.[0-9]+[A-Za-z0-9.+-]*' | head -1 || true)"
          if [ -n "$VERSION" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "✅ Release needed: $VERSION"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "ℹ️  No releasable commits detected"
          fi

  # Create git tag (only if release needed)
  create-tag:
    name: Create release tag
    needs: check-release
    if: needs.check-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to push the version tag
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Create version tag
        uses: cocogitto/cocogitto-action@52d0023b4396897f1815648e553db2ab8d782f3a # v4.2.0
        id: bump
        with:
          command: bump
          args: --auto --disable-bump-commit
          git-user: 'github-actions[bot]'
          git-user-email: 'github-actions[bot]@users.noreply.github.com'

      - name: Push tag to repository
        uses: ad-m/github-push-action@881a6320fdb16eb5318c5054f31c218aec2b324c # v1.3.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tags: true

  # Build binaries for all platforms (only if tag created)
  build:
    name: Build ${{ matrix.target }}
    needs: [check-release, create-tag]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
          - target: aarch64-apple-darwin
            os: macos-14
            use_cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false

    steps:
      - name: Checkout code at tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.check-release.outputs.version }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --locked

      - name: Build release binary
        shell: bash
        env:
          THURBOX_RELEASE_VERSION: ${{ needs.check-release.outputs.version }}
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      # Unix archive: .tar.gz with the bare binaries + LICENSE.
      - name: Create archive (Unix)
        if: runner.os != 'Windows'
        run: |
          VERSION="${{ needs.check-release.outputs.version }}"
          TARGET="${{ matrix.target }}"
          ARCHIVE_NAME="thurbox-${VERSION}-${TARGET}.tar.gz"

          # Stage LICENSE next to the binaries so a single `tar czf` ships all
          # three. (`tar --append` cannot operate on a gzip archive, so the old
          # two-step append silently omitted LICENSE.) No `|| true`: a packaging
          # failure must fail the job.
          cp LICENSE "target/$TARGET/release/"
          cd target/$TARGET/release
          tar czf "../../../$ARCHIVE_NAME" thurbox thurbox-cli LICENSE
          cd ../../..

      # Windows archive: .zip with the .exe binaries + LICENSE. install.ps1
      # extracts this with the built-in Expand-Archive (no tar dependency).
      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ needs.check-release.outputs.version }}"
          $target = "${{ matrix.target }}"
          $archive = "thurbox-$version-$target.zip"
          $rel = "target/$target/release"
          Compress-Archive -Force -DestinationPath $archive -Path `
            "$rel/thurbox.exe", "$rel/thurbox-cli.exe", "LICENSE"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.target }}
          path: |
            thurbox-*.tar.gz
            thurbox-*.zip
          if-no-files-found: error

  # Generate checksums for all binaries
  checksums:
    name: Generate checksums
    needs: [check-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Generate SHA256 checksums
        run: |
          VERSION="${{ needs.check-release.outputs.version }}"
          cd artifacts

          # Flatten directory structure (tar.gz for Unix, zip for Windows)
          find . \( -name "*.tar.gz" -o -name "*.zip" \) -exec mv {} . \;

          # Generate checksums over every release archive
          sha256sum thurbox-*.tar.gz thurbox-*.zip > "thurbox-${VERSION}-checksums.txt"

          cat "thurbox-${VERSION}-checksums.txt"

      - name: Upload checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checksums
          path: artifacts/thurbox-*-checksums.txt

  # Generate CHANGELOG from commits
  generate-changelog:
    name: Generate changelog
    needs: [check-release, create-tag]
    runs-on: ubuntu-latest
    outputs:
      changelog: ${{ steps.changelog.outputs.stdout }}
    steps:
      - name: Checkout code at tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.check-release.outputs.version }}
          fetch-depth: 0

      - name: Generate changelog for release
        uses: cocogitto/cocogitto-action@52d0023b4396897f1815648e553db2ab8d782f3a # v4.2.0
        id: changelog
        with:
          command: changelog
          args: --at ${{ needs.check-release.outputs.version }}

  # Publish GitHub Release
  publish:
    name: Publish GitHub Release
    needs: [check-release, create-tag, build, checksums, generate-changelog]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to create releases
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release-assets/ \;
          find artifacts -type f -name "*checksums.txt" -exec cp {} release-assets/ \;
          ls -lh release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.check-release.outputs.version }}
          name: thurbox ${{ needs.check-release.outputs.version }}
          body: |
            ${{ needs.generate-changelog.outputs.changelog || '## Changes

            See commit history for details.' }}
          files: release-assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publish the Arch Linux AUR packages.
  # Runs after `publish` so the GitHub Release assets (needed by thurbox-bin)
  # and the tag's source tarball (needed by thurbox) are both available.
  # Requires the AUR_SSH_PRIVATE_KEY secret; skipped automatically if unset.
  publish-aur:
    name: Publish AUR (${{ matrix.pkgname }})
    needs: [check-release, create-tag, publish]
    if: needs.check-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    # Hoisted so the publish step can be skipped when the secret is unset
    # (the `secrets` context cannot be used directly in an `if` condition).
    env:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    strategy:
      fail-fast: false
      matrix:
        pkgname: [thurbox, thurbox-bin]
    steps:
      - name: Checkout code at tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.check-release.outputs.version }}

      - name: Bump pkgver to the release version
        run: |
          PKGVER="${{ needs.check-release.outputs.version }}"
          PKGVER="${PKGVER#v}"   # PKGBUILD pkgver is the bare semver
          PKGBUILD="packaging/aur/${{ matrix.pkgname }}/PKGBUILD"
          sed -i "s/^pkgver=.*/pkgver=${PKGVER}/" "$PKGBUILD"
          sed -i "s/^pkgrel=.*/pkgrel=1/" "$PKGBUILD"
          echo "Set ${{ matrix.pkgname }} to pkgver=${PKGVER}"

      - name: Publish to the AUR
        if: env.AUR_SSH_PRIVATE_KEY != ''
        uses: KSXGitHub/github-actions-deploy-aur@da03e160361ce01bf087e790b6ffd196d7dccff7 # v4.1.3
        with:
          pkgname: ${{ matrix.pkgname }}
          pkgbuild: packaging/aur/${{ matrix.pkgname }}/PKGBUILD
          updpkgsums: true   # recompute sha256sums from the freshly released sources
          commit_username: thurbox-release-bot
          commit_email: magicletur@protonmail.com
          ssh_private_key: ${{ env.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ needs.check-release.outputs.version }}"

  # Publish the Homebrew formula to the tap (Thurbeen/homebrew-thurbox).
  # Runs after `publish` so the release tarballs + checksums.txt exist.
  # Pushes over SSH using HOMEBREW_TAP_DEPLOY_KEY — a write-enabled deploy key
  # registered on the tap repo (the Thurbeen org blocks cross-repo PATs, so a
  # repo-scoped deploy key is the credential). Skipped automatically if the
  # secret is unset (e.g. on forks).
  publish-homebrew:
    name: Publish Homebrew formula
    needs: [check-release, create-tag, publish]
    if: needs.check-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    # Hoisted so the push step can be skipped when the secret is unset
    # (the `secrets` context cannot be used directly in an `if` condition).
    env:
      HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
    steps:
      - name: Checkout code at tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.check-release.outputs.version }}

      - name: Download release checksums
        if: env.HOMEBREW_TAP_DEPLOY_KEY != ''
        run: |
          VERSION="${{ needs.check-release.outputs.version }}"
          curl -fsSL -o checksums.txt \
            "https://github.com/${{ github.repository }}/releases/download/${VERSION}/thurbox-${VERSION}-checksums.txt"
          cat checksums.txt

      - name: Bump formula to the release version
        if: env.HOMEBREW_TAP_DEPLOY_KEY != ''
        run: |
          python3 packaging/homebrew/bump-formula.py \
            "${{ needs.check-release.outputs.version }}" \
            packaging/homebrew/Formula/thurbox.rb \
            checksums.txt
          cat packaging/homebrew/Formula/thurbox.rb

      - name: Push formula to the tap
        if: env.HOMEBREW_TAP_DEPLOY_KEY != ''
        run: |
          VERSION="${{ needs.check-release.outputs.version }}"
          mkdir -p ~/.ssh
          printf '%s\n' "$HOMEBREW_TAP_DEPLOY_KEY" > ~/.ssh/tap_key
          chmod 600 ~/.ssh/tap_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_key -o IdentitiesOnly=yes"
          git clone --depth 1 git@github.com:Thurbeen/homebrew-thurbox.git tap
          mkdir -p tap/Formula
          cp packaging/homebrew/Formula/thurbox.rb tap/Formula/thurbox.rb
          cd tap
          git config user.name thurbox-release-bot
          git config user.email magicletur@protonmail.com
          if git diff --quiet; then
            echo "Formula already up to date; nothing to push."
            exit 0
          fi
          git add Formula/thurbox.rb
          git commit -m "Update to ${VERSION}"
          git push origin HEAD

  # Publish the Chocolatey package to the community repo.
  # Runs after `publish` so the release zip + checksums.txt exist. The choco CLI
  # is Windows-only, so this runs on windows-latest. Requires the
  # CHOCOLATEY_API_KEY secret; skipped automatically if unset (e.g. on forks).
  # New versions are held for community-repo moderation before going live.
  publish-chocolatey:
    name: Publish Chocolatey package
    needs: [check-release, create-tag, publish]
    if: needs.check-release.outputs.should_release == 'true'
    runs-on: windows-latest
    # Hoisted so the steps can be skipped when the secret is unset
    # (the `secrets` context cannot be used directly in an `if` condition).
    env:
      CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
    steps:
      - name: Checkout code at tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.check-release.outputs.version }}

      - name: Download release checksums
        if: env.CHOCOLATEY_API_KEY != ''
        shell: pwsh
        run: |
          $version = "${{ needs.check-release.outputs.version }}"
          $repo = "${{ github.repository }}"
          Invoke-WebRequest -UseBasicParsing `
            -Uri "https://github.com/$repo/releases/download/$version/thurbox-$version-checksums.txt" `
            -OutFile checksums.txt
          Get-Content checksums.txt

      - name: Bump package to the release version
        if: env.CHOCOLATEY_API_KEY != ''
        shell: pwsh
        run: |
          python packaging/chocolatey/bump-nuspec.py `
            "${{ needs.check-release.outputs.version }}" `
            packaging/chocolatey `
            checksums.txt
          Get-Content packaging/chocolatey/thurbox.nuspec
          Get-Content packaging/chocolatey/tools/chocolateyinstall.ps1

      - name: Pack the package
        if: env.CHOCOLATEY_API_KEY != ''
        shell: pwsh
        run: |
          # Version is read from the bumped nuspec — do not pass --version.
          choco pack packaging/chocolatey/thurbox.nuspec --outputdirectory packaging/chocolatey

      - name: Push to the Chocolatey community repo
        if: env.CHOCOLATEY_API_KEY != ''
        shell: pwsh
        run: |
          $nupkg = Get-ChildItem packaging/chocolatey/thurbox.*.nupkg | Select-Object -First 1
          choco push $nupkg.FullName --source https://push.chocolatey.org/ --api-key $env:CHOCOLATEY_API_KEY

  # Submit the winget manifests to microsoft/winget-pkgs.
  # Runs after `publish` so the release zip + checksums.txt exist. wingetcreate
  # is Windows-only, so this runs on windows-latest. Requires the WINGET_TOKEN
  # secret (a classic PAT with `public_repo` scope that can fork/PR against
  # microsoft/winget-pkgs); skipped automatically if unset (e.g. on forks).
  # New versions go through winget-pkgs PR review before going live.
  publish-winget:
    name: Publish winget manifest
    needs: [check-release, create-tag, publish]
    if: needs.check-release.outputs.should_release == 'true'
    runs-on: windows-latest
    # Hoisted so the steps can be skipped when the secret is unset
    # (the `secrets` context cannot be used directly in an `if` condition).
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: Checkout code at tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.check-release.outputs.version }}

      - name: Download release checksums
        if: env.WINGET_TOKEN != ''
        shell: pwsh
        run: |
          $version = "${{ needs.check-release.outputs.version }}"
          $repo = "${{ github.repository }}"
          Invoke-WebRequest -UseBasicParsing `
            -Uri "https://github.com/$repo/releases/download/$version/thurbox-$version-checksums.txt" `
            -OutFile checksums.txt
          Get-Content checksums.txt

      - name: Bump manifests to the release version
        if: env.WINGET_TOKEN != ''
        shell: pwsh
        run: |
          python packaging/winget/bump-manifests.py `
            "${{ needs.check-release.outputs.version }}" `
            packaging/winget/manifests `
            checksums.txt
          Get-Content packaging/winget/manifests/Thurbeen.thurbox.installer.yaml

      - name: Install wingetcreate
        if: env.WINGET_TOKEN != ''
        shell: pwsh
        run: |
          Invoke-WebRequest -UseBasicParsing `
            -Uri https://aka.ms/wingetcreate/latest `
            -OutFile wingetcreate.exe

      # `submit` validates the bumped manifests and opens a PR against
      # microsoft/winget-pkgs from a fork of the WINGET_TOKEN account. Works for
      # both the first submission and every subsequent version from the same
      # in-repo manifest set. WINGET_TOKEN MUST be a classic PAT with the
      # `public_repo` scope — wingetcreate rejects fine-grained tokens as
      # invalid (microsoft/winget-create#595). The token is passed via
      # WINGET_CREATE_GITHUB_TOKEN (Microsoft's recommended CI path) instead of
      # --token, which wingetcreate warns can leak the token into logs.
      - name: Submit manifests to winget-pkgs
        if: env.WINGET_TOKEN != ''
        shell: pwsh
        env:
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          .\wingetcreate.exe submit packaging/winget/manifests
