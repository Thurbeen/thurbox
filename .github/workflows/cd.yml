name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact version to release (e.g. 1.0.0). Empty = auto from commits."
        required: false
        default: ""
        type: string
  push:
    branches: [main]

env:
  PACKAGE_CHANNELS_MAJOR: "2"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-release:
    name: Analyze commits for release
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.parse.outputs.should_release == 'true' && steps.shipped.outputs.shipped != 'false' && steps.line.outputs.held != 'true' }}
      version: ${{ steps.parse.outputs.version }}
      bump_args: ${{ steps.parse.outputs.bump_args }}
      newest: ${{ steps.newest.outputs.newest }}
      channels: ${{ steps.line.outputs.channels }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # Full history for cocogitto

      - name: Check for releasable commits
        uses: cocogitto/cocogitto-action@52d0023b4396897f1815648e553db2ab8d782f3a # v4.2.0
        id: check
        with:
          install-only: true

      - name: Parse release decision
        id: parse
        env:
          FORCED_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$FORCED_VERSION" ]; then
            VERSION="v${FORCED_VERSION#v}"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            # `cog bump --version` takes a bare semver; cog.toml's tag_prefix adds the `v`.
            echo "bump_args=--version ${VERSION#v} --disable-bump-commit" >> "$GITHUB_OUTPUT"
            echo "✅ Forced release: $VERSION"
            exit 0
          fi

          # cog prints prose, not a tag, when no bump is due.
          RAW="$(cog bump --auto --disable-bump-commit --dry-run 2>/dev/null || true)"
          echo "cog output: $RAW"
          VERSION="$(printf '%s\n' "$RAW" | grep -oE '^v?[0-9]+\.[0-9]+\.[0-9]+[A-Za-z0-9.+-]*' | head -1 || true)"
          if [ -n "$VERSION" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "bump_args=--auto --disable-bump-commit" >> "$GITHUB_OUTPUT"
            echo "✅ Release needed: $VERSION"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "bump_args=--auto --disable-bump-commit" >> "$GITHUB_OUTPUT"
            echo "ℹ️  No releasable commits detected"
          fi

      - name: Check the release touches a shipped artifact
        id: shipped
        if: steps.parse.outputs.should_release == 'true' && inputs.version == ''
        run: |
          SHIPPED_PATHS='^(crates/|ui/|examples/|Cargo\.toml$|Cargo\.lock$|rust-toolchain\.toml$|Cross\.toml$|packaging/|scripts/install\.(sh|ps1)$|scripts/ci/release-archive\.sh$|\.github/workflows/cd\.yml$)'

          LAST_TAG="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"

          if [ -z "$LAST_TAG" ]; then
            LAST_TAG="(none)"
            RELEVANT="(no previous tag — first release)"
          else
            echo "Files changed since $LAST_TAG:"
            git diff --name-only "$LAST_TAG"..HEAD | sed 's/^/  /'
            RELEVANT="$(git diff --name-only "$LAST_TAG"..HEAD | grep -E "$SHIPPED_PATHS" || true)"
          fi

          if [ -n "$RELEVANT" ]; then
            echo "shipped=true" >> "$GITHUB_OUTPUT"
            echo "✅ Shipped artifact changed — releasing:"
            printf '%s\n' "$RELEVANT" | sed 's/^/  /'
          else
            echo "shipped=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping release ${{ steps.parse.outputs.version }} — no shipped artifact changed since $LAST_TAG (docs/website/CI only). The commits stay in history and ride along with the next real release."
          fi

      - name: Is this the highest version ever tagged
        id: newest
        run: |
          TARGET="${{ steps.parse.outputs.version }}"
          HIGHEST="$(git tag --list 'v*' | sort -V | tail -1)"
          echo "cutting ${TARGET:-(nothing)}; highest existing tag ${HIGHEST:-(none)}"
          if [ -z "$TARGET" ]; then
            echo "newest=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$HIGHEST" ] \
            || [ "$(printf '%s\n%s\n' "$HIGHEST" "$TARGET" | sort -V | tail -1)" = "$TARGET" ]; then
            echo "newest=true" >> "$GITHUB_OUTPUT"
            echo "$TARGET leads the line — release as latest, push to every channel"
          else
            echo "newest=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$TARGET is behind $HIGHEST — cutting it as a maintenance release: tagged and published with binaries, but not marked latest."
          fi

      - name: Is this release on the source's major line
        id: line
        if: steps.parse.outputs.should_release == 'true' && steps.shipped.outputs.shipped != 'false'
        # `shell: bash` enables pipefail, so `tee` cannot hide the script's refusal.
        shell: bash
        run: |
          scripts/ci/release-line.sh "${{ steps.parse.outputs.version }}" "$PACKAGE_CHANNELS_MAJOR" \
            | tee -a "$GITHUB_OUTPUT"

  create-tag:
    name: Create release tag
    needs: check-release
    if: needs.check-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Create version tag
        uses: cocogitto/cocogitto-action@52d0023b4396897f1815648e553db2ab8d782f3a # v4.2.0
        id: bump
        with:
          command: bump
          args: ${{ needs.check-release.outputs.bump_args }}
          git-user: 'github-actions[bot]'
          git-user-email: 'github-actions[bot]@users.noreply.github.com'

      - name: Push tag to repository
        run: git push origin "refs/tags/${{ needs.check-release.outputs.version }}"

  build:
    name: Build ${{ matrix.target }}
    needs: [check-release, create-tag]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
          - target: aarch64-apple-darwin
            os: macos-15
            use_cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false

    steps:
      - name: Checkout code at tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.check-release.outputs.version }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --locked

      - name: Build release binaries
        shell: bash
        env:
          THURBOX_RELEASE_VERSION: ${{ needs.check-release.outputs.version }}
        run: |
          export FLEET_RELEASE_VERSION="${THURBOX_RELEASE_VERSION#v}"
          bins=()
          for bin in $(scripts/ci/release-archive.sh --binaries); do bins+=(--bin "$bin"); done
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} "${bins[@]}"
          else
            cargo build --release --target ${{ matrix.target }} "${bins[@]}"
          fi

      - name: Create archive
        shell: bash
        run: |
          scripts/ci/release-archive.sh "${{ needs.check-release.outputs.version }}" \
            "${{ matrix.target }}" "target/${{ matrix.target }}/release"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.target }}
          path: |
            thurbox-*.tar.gz
            thurbox-*.zip
          if-no-files-found: error

  checksums:
    name: Generate checksums
    needs: [check-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code at tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.check-release.outputs.version }}

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Generate SHA256 checksums
        run: |
          find artifacts \( -name "*.tar.gz" -o -name "*.zip" \) -exec mv {} artifacts/ \;
          sums="$(scripts/ci/release-archive.sh --sums "${{ needs.check-release.outputs.version }}" artifacts)"
          cat "$sums"

      - name: Upload checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checksums
          path: artifacts/thurbox-*-sha256sums.txt
          if-no-files-found: error

  generate-changelog:
    name: Generate changelog
    needs: [check-release, create-tag]
    runs-on: ubuntu-latest
    outputs:
      changelog: ${{ steps.changelog.outputs.stdout }}
    steps:
      - name: Checkout code at tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.check-release.outputs.version }}
          fetch-depth: 0

      - name: Generate changelog for release
        uses: cocogitto/cocogitto-action@52d0023b4396897f1815648e553db2ab8d782f3a # v4.2.0
        id: changelog
        with:
          command: changelog
          args: --at ${{ needs.check-release.outputs.version }}

  publish:
    name: Publish GitHub Release
    needs: [check-release, create-tag, build, checksums, generate-changelog]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release-assets/ \;
          find artifacts -type f -name "*-sha256sums.txt" -exec cp {} release-assets/ \;
          ls -lh release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.check-release.outputs.version }}
          name: thurbox ${{ needs.check-release.outputs.version }}
          body: |
            ${{ needs.generate-changelog.outputs.changelog || '## Changes

            See commit history for details.' }}
          files: release-assets/*
          draft: false
          prerelease: false
          make_latest: ${{ needs.check-release.outputs.newest }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-aur:
    name: Publish AUR (${{ matrix.pkgname }})
    needs: [check-release, create-tag, publish]
    if: needs.check-release.outputs.should_release == 'true'
      && needs.check-release.outputs.channels == 'true'
    runs-on: ubuntu-latest
    # The `secrets` context is not available in `if:`.
    env:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    strategy:
      fail-fast: false
      matrix:
        pkgname: [thurbox, thurbox-bin]
    steps:
      - name: Checkout code at tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.check-release.outputs.version }}

      - name: Bump pkgver to the release version
        run: |
          PKGVER="${{ needs.check-release.outputs.version }}"
          PKGVER="${PKGVER#v}"
          PKGBUILD="packaging/aur/${{ matrix.pkgname }}/PKGBUILD"
          sed -i "s/^pkgver=.*/pkgver=${PKGVER}/" "$PKGBUILD"
          sed -i "s/^pkgrel=.*/pkgrel=1/" "$PKGBUILD"
          echo "Set ${{ matrix.pkgname }} to pkgver=${PKGVER}"

      - name: Publish to the AUR
        if: env.AUR_SSH_PRIVATE_KEY != ''
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: ${{ matrix.pkgname }}
          pkgbuild: packaging/aur/${{ matrix.pkgname }}/PKGBUILD
          updpkgsums: true
          commit_username: thurbox-release-bot
          commit_email: magicletur@protonmail.com
          ssh_private_key: ${{ env.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ needs.check-release.outputs.version }}"

  publish-homebrew:
    name: Publish Homebrew formula
    needs: [check-release, create-tag, publish]
    if: needs.check-release.outputs.should_release == 'true'
      && needs.check-release.outputs.channels == 'true'
    runs-on: ubuntu-latest
    # The `secrets` context is not available in `if:`.
    env:
      HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
    steps:
      - name: Checkout code at tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.check-release.outputs.version }}

      - name: Download release checksums
        if: env.HOMEBREW_TAP_DEPLOY_KEY != ''
        run: |
          VERSION="${{ needs.check-release.outputs.version }}"
          curl -fsSL -o checksums.txt \
            "https://github.com/${{ github.repository }}/releases/download/${VERSION}/thurbox-${VERSION#v}-sha256sums.txt"
          cat checksums.txt

      - name: Bump formula to the release version
        if: env.HOMEBREW_TAP_DEPLOY_KEY != ''
        run: |
          python3 packaging/homebrew/bump-formula.py \
            "${{ needs.check-release.outputs.version }}" \
            packaging/homebrew/Formula/thurbox.rb \
            checksums.txt
          cat packaging/homebrew/Formula/thurbox.rb

      - name: Push formula to the tap
        if: env.HOMEBREW_TAP_DEPLOY_KEY != ''
        run: |
          VERSION="${{ needs.check-release.outputs.version }}"
          mkdir -p ~/.ssh
          printf '%s\n' "$HOMEBREW_TAP_DEPLOY_KEY" > ~/.ssh/tap_key
          chmod 600 ~/.ssh/tap_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_key -o IdentitiesOnly=yes"
          git clone --depth 1 git@github.com:Thurbeen/homebrew-thurbox.git tap
          mkdir -p tap/Formula
          cp packaging/homebrew/Formula/thurbox.rb tap/Formula/thurbox.rb
          cd tap
          git config user.name thurbox-release-bot
          git config user.email magicletur@protonmail.com
          if git diff --quiet; then
            echo "Formula already up to date; nothing to push."
            exit 0
          fi
          git add Formula/thurbox.rb
          git commit -m "Update to ${VERSION}"
          git push origin HEAD

  publish-chocolatey:
    name: Publish Chocolatey package
    needs: [check-release, create-tag, publish]
    if: needs.check-release.outputs.should_release == 'true'
      && needs.check-release.outputs.channels == 'true'
    runs-on: windows-latest
    # The `secrets` context is not available in `if:`.
    env:
      CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
      THROTTLE_DAYS: "30"
    steps:
      - name: Checkout code at tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.check-release.outputs.version }}

      - name: Check throttle window
        id: throttle
        if: env.CHOCOLATEY_API_KEY != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $throttleDays = [int]$env:THROTTLE_DAYS
          $feed = "https://community.chocolatey.org/api/v2/Packages()?" +
            "`$filter=Id eq 'thurbox' and IsLatestVersion eq true&`$top=1&`$format=json"
          $shouldPush = $true
          $reason = ""
          try {
            $resp = Invoke-RestMethod -UseBasicParsing -Uri $feed
            $entry = @($resp.d.results) | Select-Object -First 1
            if (-not $entry) {
              $reason = "no published thurbox version found on Chocolatey — first push"
            } else {
              # OData dates arrive as ISO-8601 or `/Date(ms)/`; [datetime] parses only the first.
              $raw = "$($entry.Published)"
              if ($raw -match '/Date\((\d+)') {
                $published = [datetimeoffset]::FromUnixTimeMilliseconds([long]$Matches[1]).UtcDateTime
              } else {
                $published = ([datetime]$raw).ToUniversalTime()
              }
              $ageDays = ((Get-Date).ToUniversalTime() - $published).TotalDays
              if ($ageDays -lt $throttleDays) {
                $shouldPush = $false
                $reason = ("last Chocolatey push was {0:N1} days ago (< {1}d throttle)" -f $ageDays, $throttleDays)
              } else {
                $reason = ("last Chocolatey push was {0:N1} days ago (>= {1}d throttle)" -f $ageDays, $throttleDays)
              }
            }
          } catch {
            $reason = "could not read Chocolatey feed ($($_.Exception.Message)); proceeding with push"
          }
          "should_push=$($shouldPush.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          if ($shouldPush) {
            Write-Host "Chocolatey throttle: PUSH — $reason"
          } else {
            Write-Host "::warning title=Chocolatey push throttled::Skipping this release — $reason. It will be coalesced into the next monthly Chocolatey version."
            "Chocolatey push **throttled** (green): $reason." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }

      - name: Download release checksums
        if: env.CHOCOLATEY_API_KEY != '' && steps.throttle.outputs.should_push == 'true'
        shell: pwsh
        run: |
          $version = "${{ needs.check-release.outputs.version }}"
          $repo = "${{ github.repository }}"
          Invoke-WebRequest -UseBasicParsing `
            -Uri "https://github.com/$repo/releases/download/$version/thurbox-$($version.TrimStart('v'))-sha256sums.txt" `
            -OutFile checksums.txt
          Get-Content checksums.txt

      - name: Bump package to the release version
        if: env.CHOCOLATEY_API_KEY != '' && steps.throttle.outputs.should_push == 'true'
        shell: pwsh
        run: |
          python packaging/chocolatey/bump-nuspec.py `
            "${{ needs.check-release.outputs.version }}" `
            packaging/chocolatey `
            checksums.txt
          Get-Content packaging/chocolatey/thurbox.nuspec
          Get-Content packaging/chocolatey/tools/chocolateyinstall.ps1

      - name: Pack the package
        if: env.CHOCOLATEY_API_KEY != '' && steps.throttle.outputs.should_push == 'true'
        shell: pwsh
        run: |
          choco pack packaging/chocolatey/thurbox.nuspec --outputdirectory packaging/chocolatey

      - name: Push to the Chocolatey community repo
        if: env.CHOCOLATEY_API_KEY != '' && steps.throttle.outputs.should_push == 'true'
        shell: pwsh
        run: |
          $nupkg = Get-ChildItem packaging/chocolatey/thurbox.*.nupkg | Select-Object -First 1
          $out = choco push $nupkg.FullName --source https://push.chocolatey.org/ --api-key $env:CHOCOLATEY_API_KEY 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -eq 0) {
            "Chocolatey push **succeeded** — held for community moderation." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            exit 0
          }
          if ($out -match '\b(403|409)\b' -or $out -match '(?i)rate limit|too many|already been submitted|pending') {
            Write-Host "::warning title=Chocolatey push deferred::choco push was rejected (rate limit / already pending). Exiting green; the version stays on GitHub Releases and will retry next window."
            "Chocolatey push **deferred** (green): rejected by the community repo (rate limit / already pending)." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            exit 0
          }
          Write-Error "choco push failed for a non-throttle reason (see log above)."
          exit 1

  publish-winget:
    name: Publish winget manifest
    needs: [check-release, create-tag, publish]
    if: needs.check-release.outputs.should_release == 'true'
      && needs.check-release.outputs.channels == 'true'
    runs-on: windows-latest
    continue-on-error: true
    # The `secrets` context is not available in `if:`.
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
      THROTTLE_DAYS: "0"
    steps:
      - name: Checkout code at tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.check-release.outputs.version }}

      - name: Decide whether to submit
        id: decide
        if: env.WINGET_TOKEN != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $shouldSubmit = $true
          $reason = ""
          try {
            $prs = gh pr list --repo microsoft/winget-pkgs --author "@me" `
              --search "Thurbeen.thurbox in:title" --state all `
              --json number,state,createdAt,title --limit 100
            if ($LASTEXITCODE -ne 0) { throw "gh pr list exited $LASTEXITCODE" }
            $decision = $prs |
              python packaging/winget/submit-decision.py decide --throttle-days $env:THROTTLE_DAYS |
              ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw "submit-decision.py exited $LASTEXITCODE" }
            $shouldSubmit = [bool]$decision.should_submit
            $reason = $decision.reason
          } catch {
            $reason = "could not read winget-pkgs PRs ($($_.Exception.Message)); proceeding with submission"
          }
          "should_submit=$($shouldSubmit.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          if ($shouldSubmit) {
            Write-Host "winget: SUBMIT — $reason"
          } else {
            Write-Host "::warning title=winget submission skipped::$reason. The version stays on GitHub Releases and the next release retries."
            "winget submission **skipped** (green): $reason." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }

      - name: Download release checksums
        if: env.WINGET_TOKEN != '' && steps.decide.outputs.should_submit == 'true'
        shell: pwsh
        run: |
          $version = "${{ needs.check-release.outputs.version }}"
          $repo = "${{ github.repository }}"
          Invoke-WebRequest -UseBasicParsing `
            -Uri "https://github.com/$repo/releases/download/$version/thurbox-$($version.TrimStart('v'))-sha256sums.txt" `
            -OutFile checksums.txt
          Get-Content checksums.txt

      - name: Bump manifests to the release version
        if: env.WINGET_TOKEN != '' && steps.decide.outputs.should_submit == 'true'
        shell: pwsh
        run: |
          python packaging/winget/bump-manifests.py `
            "${{ needs.check-release.outputs.version }}" `
            packaging/winget/manifests `
            checksums.txt
          Get-Content packaging/winget/manifests/Thurbeen.thurbox.installer.yaml

      - name: Install wingetcreate
        if: env.WINGET_TOKEN != '' && steps.decide.outputs.should_submit == 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest -UseBasicParsing `
            -Uri https://aka.ms/wingetcreate/latest `
            -OutFile wingetcreate.exe

      - name: Sync the winget-pkgs fork
        if: env.WINGET_TOKEN != '' && steps.decide.outputs.should_submit == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          $ErrorActionPreference = "Continue"
          $account = (gh api user --jq .login | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $account) {
            Write-Host "::warning title=winget fork sync skipped::could not resolve the WINGET_TOKEN account; leaving the fork to wingetcreate."
            exit 0
          }
          $fork = "$account/winget-pkgs"
          gh repo view $fork --json name | Out-Null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "No $fork yet — wingetcreate forks on first submit."
            exit 0
          }
          $out = gh repo sync $fork --source microsoft/winget-pkgs 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Synced $fork from microsoft/winget-pkgs."
            exit 0
          }
          Write-Host "::warning title=winget fork hard-reset::$fork could not be fast-forwarded; resetting its default branch to microsoft/winget-pkgs."
          gh repo sync $fork --source microsoft/winget-pkgs --force
          if ($LASTEXITCODE -ne 0) {
            Write-Error "could not sync $fork with microsoft/winget-pkgs — wingetcreate submit would fail on a stale fork."
            exit 1
          }

      # wingetcreate rejects fine-grained tokens (microsoft/winget-create#595) and warns that --token can leak.
      - name: Submit manifests to winget-pkgs
        id: submit
        if: env.WINGET_TOKEN != '' && steps.decide.outputs.should_submit == 'true'
        shell: pwsh
        env:
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          # The runner sets `$ErrorActionPreference = 'stop'`, which turns a native non-zero exit into a throw.
          $ErrorActionPreference = "Continue"
          $out = .\wingetcreate.exe submit packaging/winget/manifests 2>&1 | Out-String
          $submitExit = $LASTEXITCODE
          Write-Host $out
          $verdict = $out |
            python packaging/winget/submit-decision.py after-submit --exit-code $submitExit |
            ConvertFrom-Json
          if ($null -eq $verdict) {
            Write-Error "could not classify wingetcreate's outcome (submit exited $submitExit)."
            exit 1
          }
          "opened=$($verdict.opened.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          if ($verdict.opened) {
            "winget submission **succeeded** — PR opened on microsoft/winget-pkgs, awaiting review." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            exit 0
          }
          if ($verdict.deferrable) {
            Write-Host "::warning title=winget submission deferred::rejected by the channel ($($verdict.reason)). Exiting green; the version stays on GitHub Releases and the next release retries."
            "winget submission **deferred** (green): $($verdict.reason). No PR was opened, so any pending one is left alone." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            exit 0
          }
          Write-Error "wingetcreate submit failed for a non-channel reason (see log above)."
          exit 1

      - name: Close superseded winget-pkgs PRs
        if: env.WINGET_TOKEN != '' && steps.submit.outputs.opened == 'true'
        shell: pwsh
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          $ErrorActionPreference = "Continue"
          $version = "${{ needs.check-release.outputs.version }}".TrimStart("v")
          # wingetcreate always puts the package moniker in the PR title.
          $prs = gh pr list --repo microsoft/winget-pkgs --author "@me" `
            --state open --search "Thurbeen.thurbox in:title" `
            --json number,title,createdAt --limit 100 | ConvertFrom-Json
          if (-not $prs -or $prs.Count -le 1) {
            Write-Host "Nothing to close ($($prs.Count) open PR(s))."
            exit 0
          }
          $keep = $prs | Where-Object { $_.title -match [regex]::Escape("version $version") } | Select-Object -First 1
          if (-not $keep) {
            $keep = $prs | Sort-Object { [datetime]$_.createdAt } -Descending | Select-Object -First 1
          }
          Write-Host "Keeping #$($keep.number) ($($keep.title)); closing $($prs.Count - 1) superseded PR(s)."
          foreach ($pr in $prs | Where-Object { $_.number -ne $keep.number }) {
            gh pr close $pr.number --repo microsoft/winget-pkgs `
              --comment "Superseded by #$($keep.number) ($($keep.title)). Auto-closing this stale version-bump PR from thurbox release CI."
            Write-Host "Closed #$($pr.number) ($($pr.title))."
          }
