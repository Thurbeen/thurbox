name: Release

on:
  workflow_dispatch:
    # Cut a specific version by dispatching with `version` (e.g. `1.0.0`).
    # This is the only way to cross a major line: `cog bump --auto` maps a
    # breaking change to a *minor* bump while on a 0.x line (SemVer treats 0.x
    # as inherently unstable), so it can never reach 1.0.0 from 0.x on its own.
    # When `version` is set the workflow tags + releases that exact version;
    # when empty (the default, and always on a `push` trigger) it falls back to
    # the normal `cog bump --auto` from the commit history.
    inputs:
      version:
        description: "Exact version to release (e.g. 1.0.0). Empty = auto from commits."
        required: false
        default: ""
        type: string
  push:
    branches: [main]

# Prevent concurrent releases
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Analyze commits and determine if release is needed
  check-release:
    name: Analyze commits for release
    runs-on: ubuntu-latest
    outputs:
      # Gated by BOTH the commit-type decision (`parse`) and the
      # artifact-relevance gate (`shipped`): a `feat`/`fix` that touches only
      # the website, docs, or CI config bumps nothing shippable, so it must not
      # cut a release. See the `shipped` step for the rationale + path list.
      should_release: ${{ steps.parse.outputs.should_release == 'true' && steps.shipped.outputs.shipped != 'false' }}
      version: ${{ steps.parse.outputs.version }}
      # The exact `cog bump` args create-tag runs. Computed here in bash (not
      # via a YAML `${{ && || }}` ternary in create-tag) so the forced-version
      # path is deterministic — the ternary form silently fell back to `--auto`
      # when an output briefly evaluated empty, defeating the forced cut.
      bump_args: ${{ steps.parse.outputs.bump_args }}
      # Whether this cut is the highest version the repository has ever tagged.
      # A maintenance release off `v1.x` is not: everything downstream of the
      # tag points at "the current thurbox" rather than at a version, so a 1.8.x
      # cut would drag all of it backwards past 2.x. See the `newest` step.
      newest: ${{ steps.newest.outputs.newest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # Full history for cocogitto

      - name: Check for releasable commits
        # Pinned to v4.2.0 (same SHA as the other cocogitto-action steps below);
        # used here in install-only mode to provide the `cog` binary.
        uses: cocogitto/cocogitto-action@52d0023b4396897f1815648e553db2ab8d782f3a # v4.2.0
        id: check
        with:
          install-only: true

      - name: Parse release decision
        id: parse
        env:
          # '' on a push trigger or an empty dispatch; a bare version otherwise.
          FORCED_VERSION: ${{ inputs.version }}
        run: |
          # Two paths pick the target version:
          #
          # 1. Forced (workflow_dispatch with `version`): use it verbatim. This
          #    is how a major cut is made — `cog bump --auto` can't reach 1.0.0
          #    from a 0.x line (breaking maps to minor there), so an explicit
          #    version is the only route across a major boundary.
          # 2. Auto (push, or dispatch with an empty `version`): the next tag
          #    `cog bump --auto` computes from the commits since the last tag.
          #
          # cog prints the next tag (e.g. "v0.99.1") when a bump is due, but a
          # human-readable "No conventional commits…" message when none is. Match
          # only a real semver so that non-bump message never reaches
          # $GITHUB_OUTPUT — writing its multi-line text there previously failed
          # this step (and the whole workflow) on every docs/ci/chore push.
          if [ -n "$FORCED_VERSION" ]; then
            # Strip a leading `v` if the caller included one (UI convenience).
            VERSION="v${FORCED_VERSION#v}"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            # `cog bump --version` parses a bare semver (no `v`); the tag_prefix
            # in cog.toml re-adds the `v` on the created tag. `version` (above)
            # keeps the `v` because the tag_name / `ref: <tag>` lookups need it.
            echo "bump_args=--version ${VERSION#v} --disable-bump-commit" >> "$GITHUB_OUTPUT"
            echo "✅ Forced release: $VERSION"
            exit 0
          fi

          RAW="$(cog bump --auto --disable-bump-commit --dry-run 2>/dev/null || true)"
          echo "cog output: $RAW"
          VERSION="$(printf '%s\n' "$RAW" | grep -oE '^v?[0-9]+\.[0-9]+\.[0-9]+[A-Za-z0-9.+-]*' | head -1 || true)"
          if [ -n "$VERSION" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "bump_args=--auto --disable-bump-commit" >> "$GITHUB_OUTPUT"
            echo "✅ Release needed: $VERSION"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "bump_args=--auto --disable-bump-commit" >> "$GITHUB_OUTPUT"
            echo "ℹ️  No releasable commits detected"
          fi

      - name: Check the release touches a shipped artifact
        id: shipped
        if: steps.parse.outputs.should_release == 'true' && inputs.version == ''
        run: |
          # Commit *type* alone over-releases: cocogitto sees `fix`/`feat` and
          # bumps, but Renovate labels a GitHub-Actions pin bump `fix(deps)` and
          # the website is versioned as `feat(ui)`/`fix(ui)`. Those change no
          # byte of the shipped binary, yet each cut a release (v1.2.13..v1.3.0
          # were four CSS-only releases, one of them a *minor*). Every such
          # release also re-runs the 4-platform build and pushes to Homebrew/AUR/
          # Chocolatey/winget — the moderated channels that then rate-limit us.
          #
          # So gate on the diff as well: release only when something a user
          # actually installs changed. The range is the whole span since the last
          # tag, NOT this single push — a website-only push landing on top of an
          # unreleased `src/` commit still owes that release.
          #
          # A forced `workflow_dispatch` version skips this gate entirely (the
          # `if:` above): an explicit human cut is always honoured.
          SHIPPED_PATHS='^(src/|tests/|build\.rs$|Cargo\.toml$|Cargo\.lock$|rust-toolchain\.toml$|Cross\.toml$|extensions/|packaging/|scripts/install\.(sh|ps1)$|\.github/workflows/cd\.yml$)'

          LAST_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"

          if [ -z "$LAST_TAG" ]; then
            # No tag yet: nothing to diff against, so the first release always
            # ships. Reported as a single pseudo-path so the decision below
            # stays a plain "is RELEVANT empty?" test for both branches.
            LAST_TAG="(none)"
            RELEVANT="(no previous tag — first release)"
          else
            echo "Files changed since $LAST_TAG:"
            git diff --name-only "$LAST_TAG"..HEAD | sed 's/^/  /'
            RELEVANT="$(git diff --name-only "$LAST_TAG"..HEAD | grep -E "$SHIPPED_PATHS" || true)"
          fi

          if [ -n "$RELEVANT" ]; then
            echo "shipped=true" >> "$GITHUB_OUTPUT"
            echo "✅ Shipped artifact changed — releasing:"
            printf '%s\n' "$RELEVANT" | sed 's/^/  /'
          else
            echo "shipped=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping release ${{ steps.parse.outputs.version }} — no shipped artifact changed since $LAST_TAG (docs/website/CI only). The commits stay in history and ride along with the next real release."
          fi

      - name: Is this the highest version ever tagged
        id: newest
        run: |
          # The release line is not a single line any more: 2.x ships from
          # `main` while 1.8.x is maintained on `v1.x`, and a v1 patch is cut by
          # dispatching this workflow from that ref. Nothing downstream of the
          # tag knows that. The GitHub Release would claim "Latest" — which is
          # what `scripts/install.{sh,ps1}` resolve, so every fresh install would
          # land on the older line — and the Homebrew formula and the AUR
          # PKGBUILDs would be rewritten to it, moving 2.x users *backwards* on
          # their next upgrade. The moderated channels (Chocolatey, winget) would
          # merely reject a version behind what they already carry.
          #
          # So compare the cut against every tag that exists. Behind the highest
          # one means this is a maintenance release: still tagged, still built,
          # still published with its binaries, but not marked latest and not
          # pushed to any channel. The version is the whole test — not the ref —
          # because that is the property those consumers care about, and a hotfix
          # cut from some other ref that *is* the newest version should still
          # ship everywhere.
          TARGET="${{ steps.parse.outputs.version }}"
          HIGHEST="$(git tag --list 'v*' | sort -V | tail -1)"
          echo "cutting ${TARGET:-(nothing)}; highest existing tag ${HIGHEST:-(none)}"
          if [ -z "$TARGET" ]; then
            # No release is being cut; the value is unused but must not be empty.
            echo "newest=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$HIGHEST" ] \
            || [ "$(printf '%s\n%s\n' "$HIGHEST" "$TARGET" | sort -V | tail -1)" = "$TARGET" ]; then
            echo "newest=true" >> "$GITHUB_OUTPUT"
            echo "$TARGET leads the line — release as latest, push to every channel"
          else
            echo "newest=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$TARGET is behind $HIGHEST — cutting it as a maintenance release: tagged and published with binaries, but not marked latest and not pushed to Homebrew/AUR/Chocolatey/winget."
          fi

  # Create git tag (only if release needed)
  create-tag:
    name: Create release tag
    needs: check-release
    if: needs.check-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to push the version tag
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Create version tag
        uses: cocogitto/cocogitto-action@52d0023b4396897f1815648e553db2ab8d782f3a # v4.2.0
        id: bump
        with:
          command: bump
          # `bump_args` is resolved by check-release: `--version <v>` for a
          # forced cut (the only way across a major boundary on a 0.x line),
          # `--auto` otherwise. Computed in bash upstream to stay deterministic.
          args: ${{ needs.check-release.outputs.bump_args }}
          git-user: 'github-actions[bot]'
          git-user-email: 'github-actions[bot]@users.noreply.github.com'

      # Push the tag and nothing else. `ad-m/github-push-action` stood here and
      # defaults its `branch` to the repository's default: from `main` that is
      # the ref already checked out, so pushing it is a no-op and the tag rides
      # along — but from `v1.x` it tries to push this branch's tip onto `main`,
      # is rejected as a non-fast-forward, and the tag it was there to deliver
      # never leaves the runner. A tag push is what this step means; say so.
      - name: Push tag to repository
        run: git push origin "refs/tags/${{ needs.check-release.outputs.version }}"

  # Build binaries for all platforms (only if tag created)
  build:
    name: Build ${{ matrix.target }}
    needs: [check-release, create-tag]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
          - target: aarch64-apple-darwin
            os: macos-14
            use_cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false

    steps:
      - name: Checkout code at tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.check-release.outputs.version }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --locked

      - name: Build release binary
        shell: bash
        env:
          THURBOX_RELEASE_VERSION: ${{ needs.check-release.outputs.version }}
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      # Unix archive: .tar.gz with the bare binaries + LICENSE.
      - name: Create archive (Unix)
        if: runner.os != 'Windows'
        run: |
          VERSION="${{ needs.check-release.outputs.version }}"
          TARGET="${{ matrix.target }}"
          ARCHIVE_NAME="thurbox-${VERSION}-${TARGET}.tar.gz"

          # Stage LICENSE next to the binaries so a single `tar czf` ships all
          # three. (`tar --append` cannot operate on a gzip archive, so the old
          # two-step append silently omitted LICENSE.) No `|| true`: a packaging
          # failure must fail the job.
          cp LICENSE "target/$TARGET/release/"
          cd target/$TARGET/release
          tar czf "../../../$ARCHIVE_NAME" thurbox thurbox-cli LICENSE
          cd ../../..

      # Windows archive: .zip with the .exe binaries + LICENSE. install.ps1
      # extracts this with the built-in Expand-Archive (no tar dependency).
      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ needs.check-release.outputs.version }}"
          $target = "${{ matrix.target }}"
          $archive = "thurbox-$version-$target.zip"
          $rel = "target/$target/release"
          Compress-Archive -Force -DestinationPath $archive -Path `
            "$rel/thurbox.exe", "$rel/thurbox-cli.exe", "LICENSE"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.target }}
          path: |
            thurbox-*.tar.gz
            thurbox-*.zip
          if-no-files-found: error

  # Generate checksums for all binaries
  checksums:
    name: Generate checksums
    needs: [check-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Generate SHA256 checksums
        run: |
          VERSION="${{ needs.check-release.outputs.version }}"
          cd artifacts

          # Flatten directory structure (tar.gz for Unix, zip for Windows)
          find . \( -name "*.tar.gz" -o -name "*.zip" \) -exec mv {} . \;

          # Generate checksums over every release archive
          sha256sum thurbox-*.tar.gz thurbox-*.zip > "thurbox-${VERSION}-checksums.txt"

          cat "thurbox-${VERSION}-checksums.txt"

      - name: Upload checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checksums
          path: artifacts/thurbox-*-checksums.txt

  # Generate CHANGELOG from commits
  generate-changelog:
    name: Generate changelog
    needs: [check-release, create-tag]
    runs-on: ubuntu-latest
    outputs:
      changelog: ${{ steps.changelog.outputs.stdout }}
    steps:
      - name: Checkout code at tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.check-release.outputs.version }}
          fetch-depth: 0

      - name: Generate changelog for release
        uses: cocogitto/cocogitto-action@52d0023b4396897f1815648e553db2ab8d782f3a # v4.2.0
        id: changelog
        with:
          command: changelog
          args: --at ${{ needs.check-release.outputs.version }}

  # Publish GitHub Release
  publish:
    name: Publish GitHub Release
    needs: [check-release, create-tag, build, checksums, generate-changelog]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to create releases
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release-assets/ \;
          find artifacts -type f -name "*checksums.txt" -exec cp {} release-assets/ \;
          ls -lh release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.check-release.outputs.version }}
          name: thurbox ${{ needs.check-release.outputs.version }}
          body: |
            ${{ needs.generate-changelog.outputs.changelog || '## Changes

            See commit history for details.' }}
          files: release-assets/*
          draft: false
          prerelease: false
          # A maintenance cut off an older line must not claim the pointer the
          # installers resolve. Not `prerelease`: 1.8.7 is a real release, it is
          # simply not the newest one.
          make_latest: ${{ needs.check-release.outputs.newest }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publish the Arch Linux AUR packages.
  # Runs after `publish` so the GitHub Release assets (needed by thurbox-bin)
  # and the tag's source tarball (needed by thurbox) are both available.
  # Requires the AUR_SSH_PRIVATE_KEY secret; skipped automatically if unset.
  publish-aur:
    name: Publish AUR (${{ matrix.pkgname }})
    needs: [check-release, create-tag, publish]
    if: needs.check-release.outputs.should_release == 'true'
      && needs.check-release.outputs.newest == 'true'
    runs-on: ubuntu-latest
    # Hoisted so the publish step can be skipped when the secret is unset
    # (the `secrets` context cannot be used directly in an `if` condition).
    env:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    strategy:
      fail-fast: false
      matrix:
        pkgname: [thurbox, thurbox-bin]
    steps:
      - name: Checkout code at tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.check-release.outputs.version }}

      - name: Bump pkgver to the release version
        run: |
          PKGVER="${{ needs.check-release.outputs.version }}"
          PKGVER="${PKGVER#v}"   # PKGBUILD pkgver is the bare semver
          PKGBUILD="packaging/aur/${{ matrix.pkgname }}/PKGBUILD"
          sed -i "s/^pkgver=.*/pkgver=${PKGVER}/" "$PKGBUILD"
          sed -i "s/^pkgrel=.*/pkgrel=1/" "$PKGBUILD"
          echo "Set ${{ matrix.pkgname }} to pkgver=${PKGVER}"

      - name: Publish to the AUR
        if: env.AUR_SSH_PRIVATE_KEY != ''
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: ${{ matrix.pkgname }}
          pkgbuild: packaging/aur/${{ matrix.pkgname }}/PKGBUILD
          updpkgsums: true   # recompute sha256sums from the freshly released sources
          commit_username: thurbox-release-bot
          commit_email: magicletur@protonmail.com
          ssh_private_key: ${{ env.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ needs.check-release.outputs.version }}"

  # Publish the Homebrew formula to the tap (Thurbeen/homebrew-thurbox).
  # Runs after `publish` so the release tarballs + checksums.txt exist.
  # Pushes over SSH using HOMEBREW_TAP_DEPLOY_KEY — a write-enabled deploy key
  # registered on the tap repo (the Thurbeen org blocks cross-repo PATs, so a
  # repo-scoped deploy key is the credential). Skipped automatically if the
  # secret is unset (e.g. on forks).
  publish-homebrew:
    name: Publish Homebrew formula
    needs: [check-release, create-tag, publish]
    if: needs.check-release.outputs.should_release == 'true'
      && needs.check-release.outputs.newest == 'true'
    runs-on: ubuntu-latest
    # Hoisted so the push step can be skipped when the secret is unset
    # (the `secrets` context cannot be used directly in an `if` condition).
    env:
      HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
    steps:
      - name: Checkout code at tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.check-release.outputs.version }}

      - name: Download release checksums
        if: env.HOMEBREW_TAP_DEPLOY_KEY != ''
        run: |
          VERSION="${{ needs.check-release.outputs.version }}"
          curl -fsSL -o checksums.txt \
            "https://github.com/${{ github.repository }}/releases/download/${VERSION}/thurbox-${VERSION}-checksums.txt"
          cat checksums.txt

      - name: Bump formula to the release version
        if: env.HOMEBREW_TAP_DEPLOY_KEY != ''
        run: |
          python3 packaging/homebrew/bump-formula.py \
            "${{ needs.check-release.outputs.version }}" \
            packaging/homebrew/Formula/thurbox.rb \
            checksums.txt
          cat packaging/homebrew/Formula/thurbox.rb

      - name: Push formula to the tap
        if: env.HOMEBREW_TAP_DEPLOY_KEY != ''
        run: |
          VERSION="${{ needs.check-release.outputs.version }}"
          mkdir -p ~/.ssh
          printf '%s\n' "$HOMEBREW_TAP_DEPLOY_KEY" > ~/.ssh/tap_key
          chmod 600 ~/.ssh/tap_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_key -o IdentitiesOnly=yes"
          git clone --depth 1 git@github.com:Thurbeen/homebrew-thurbox.git tap
          mkdir -p tap/Formula
          cp packaging/homebrew/Formula/thurbox.rb tap/Formula/thurbox.rb
          cd tap
          git config user.name thurbox-release-bot
          git config user.email magicletur@protonmail.com
          if git diff --quiet; then
            echo "Formula already up to date; nothing to push."
            exit 0
          fi
          git add Formula/thurbox.rb
          git commit -m "Update to ${VERSION}"
          git push origin HEAD

  # Publish the Chocolatey package to the community repo.
  #
  # Chocolatey's community repo moderates + rate-limits every push, so it can't
  # keep up with thurbox's per-`feat`/`fix`/`perf` release cadence: versions
  # pile up in the queue and `choco push` starts returning 403 (rate/quota).
  # This job therefore *throttles* itself — it pushes at most once per
  # THROTTLE_DAYS window, coalescing the intervening patch releases into a
  # single Chocolatey version (the latest binary still ships immediately via
  # GitHub Releases + Homebrew/AUR/winget). When the window hasn't elapsed (or a
  # push still 403s despite the throttle), the job records a `::warning::` and
  # exits green — a backed-up Chocolatey channel must never turn the whole
  # release red.
  #
  # Runs after `publish` so the release zip + checksums.txt exist. The choco CLI
  # is Windows-only, so this runs on windows-latest. Requires the
  # CHOCOLATEY_API_KEY secret; skipped automatically if unset (e.g. on forks).
  publish-chocolatey:
    name: Publish Chocolatey package
    needs: [check-release, create-tag, publish]
    if: needs.check-release.outputs.should_release == 'true'
      && needs.check-release.outputs.newest == 'true'
    runs-on: windows-latest
    # Hoisted so the steps can be skipped when the secret is unset
    # (the `secrets` context cannot be used directly in an `if` condition).
    env:
      CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
      # Minimum days between Chocolatey pushes. One push/month keeps thurbox well
      # under the community-repo moderation/rate limits while still shipping a
      # recent version. Tune here if the queue clears faster/slower.
      THROTTLE_DAYS: "30"
    steps:
      - name: Checkout code at tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.check-release.outputs.version }}

      # Query the community feed for the last-published thurbox version and when
      # it went up. If that push is younger than THROTTLE_DAYS, skip this
      # release (green + warning) so patch releases coalesce into one monthly
      # Chocolatey version instead of hammering the moderation queue.
      - name: Check throttle window
        id: throttle
        if: env.CHOCOLATEY_API_KEY != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $throttleDays = [int]$env:THROTTLE_DAYS
          # OData v2 feed for the latest published thurbox version, as JSON
          # (`$format=json` → a stable `.d.results` array — far less fragile
          # than parsing the default Atom/XML shape).
          $feed = "https://community.chocolatey.org/api/v2/Packages()?" +
            "`$filter=Id eq 'thurbox' and IsLatestVersion eq true&`$top=1&`$format=json"
          $shouldPush = $true
          $reason = ""
          try {
            $resp = Invoke-RestMethod -UseBasicParsing -Uri $feed
            $entry = @($resp.d.results) | Select-Object -First 1
            if (-not $entry) {
              $reason = "no published thurbox version found on Chocolatey — first push"
            } else {
              # OData dates arrive as ISO-8601 or `/Date(ms)/`; [datetime] parses
              # the former, so strip the wrapper for the latter.
              $raw = "$($entry.Published)"
              if ($raw -match '/Date\((\d+)') {
                $published = [datetimeoffset]::FromUnixTimeMilliseconds([long]$Matches[1]).UtcDateTime
              } else {
                $published = ([datetime]$raw).ToUniversalTime()
              }
              $ageDays = ((Get-Date).ToUniversalTime() - $published).TotalDays
              if ($ageDays -lt $throttleDays) {
                $shouldPush = $false
                $reason = ("last Chocolatey push was {0:N1} days ago (< {1}d throttle)" -f $ageDays, $throttleDays)
              } else {
                $reason = ("last Chocolatey push was {0:N1} days ago (>= {1}d throttle)" -f $ageDays, $throttleDays)
              }
            }
          } catch {
            # A feed hiccup must not block a legitimate release; err toward pushing.
            $reason = "could not read Chocolatey feed ($($_.Exception.Message)); proceeding with push"
          }
          "should_push=$($shouldPush.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          if ($shouldPush) {
            Write-Host "Chocolatey throttle: PUSH — $reason"
          } else {
            Write-Host "::warning title=Chocolatey push throttled::Skipping this release — $reason. It will be coalesced into the next monthly Chocolatey version."
            "Chocolatey push **throttled** (green): $reason." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }

      - name: Download release checksums
        if: env.CHOCOLATEY_API_KEY != '' && steps.throttle.outputs.should_push == 'true'
        shell: pwsh
        run: |
          $version = "${{ needs.check-release.outputs.version }}"
          $repo = "${{ github.repository }}"
          Invoke-WebRequest -UseBasicParsing `
            -Uri "https://github.com/$repo/releases/download/$version/thurbox-$version-checksums.txt" `
            -OutFile checksums.txt
          Get-Content checksums.txt

      - name: Bump package to the release version
        if: env.CHOCOLATEY_API_KEY != '' && steps.throttle.outputs.should_push == 'true'
        shell: pwsh
        run: |
          python packaging/chocolatey/bump-nuspec.py `
            "${{ needs.check-release.outputs.version }}" `
            packaging/chocolatey `
            checksums.txt
          Get-Content packaging/chocolatey/thurbox.nuspec
          Get-Content packaging/chocolatey/tools/chocolateyinstall.ps1

      - name: Pack the package
        if: env.CHOCOLATEY_API_KEY != '' && steps.throttle.outputs.should_push == 'true'
        shell: pwsh
        run: |
          # Version is read from the bumped nuspec — do not pass --version.
          choco pack packaging/chocolatey/thurbox.nuspec --outputdirectory packaging/chocolatey

      - name: Push to the Chocolatey community repo
        if: env.CHOCOLATEY_API_KEY != '' && steps.throttle.outputs.should_push == 'true'
        shell: pwsh
        run: |
          $nupkg = Get-ChildItem packaging/chocolatey/thurbox.*.nupkg | Select-Object -First 1
          $out = choco push $nupkg.FullName --source https://push.chocolatey.org/ --api-key $env:CHOCOLATEY_API_KEY 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -eq 0) {
            "Chocolatey push **succeeded** — held for community moderation." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            exit 0
          }
          # Even with the throttle, a residual rate/quota rejection (403) or a
          # "version already submitted/pending" conflict (409) must stay green —
          # the version is safely on GitHub Releases and will be retried next
          # window. Any other failure (bad package, auth) is a real error.
          if ($out -match '\b(403|409)\b' -or $out -match '(?i)rate limit|too many|already been submitted|pending') {
            Write-Host "::warning title=Chocolatey push deferred::choco push was rejected (rate limit / already pending). Exiting green; the version stays on GitHub Releases and will retry next window."
            "Chocolatey push **deferred** (green): rejected by the community repo (rate limit / already pending)." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            exit 0
          }
          Write-Error "choco push failed for a non-throttle reason (see log above)."
          exit 1

  # Submit the winget manifests to microsoft/winget-pkgs.
  # Runs after `publish` so the release zip + checksums.txt exist. wingetcreate
  # is Windows-only, so this runs on windows-latest. Requires the WINGET_TOKEN
  # secret (a classic PAT with `public_repo` scope that can fork/PR against
  # microsoft/winget-pkgs); skipped automatically if unset (e.g. on forks).
  # New versions go through winget-pkgs PR review before going live.
  #
  # Like Chocolatey, winget-pkgs is a *manually moderated* repo that can't keep
  # up with thurbox's per-`feat`/`fix`/`perf` cadence — each `submit` opens a PR
  # a human has to review, so a release every few hours buries the maintainers
  # (30 open PRs at once, flagged in microsoft/winget-pkgs#405639). So this job
  # mirrors the Chocolatey throttle: it submits at most once per THROTTLE_DAYS
  # window, coalescing the intervening patch releases into a single winget
  # version (the latest binary still ships immediately via GitHub Releases +
  # Homebrew/AUR, and Chocolatey on its own monthly window). When the window
  # hasn't elapsed the job records a `::warning::` and exits green — a backed-up
  # winget channel must never turn the whole release red. The
  # close-superseded-PRs step below still runs as a second-line cleanup for any
  # PRs that did stack (e.g. a manual dispatch inside the window).
  publish-winget:
    name: Publish winget manifest
    needs: [check-release, create-tag, publish]
    if: needs.check-release.outputs.should_release == 'true'
      && needs.check-release.outputs.newest == 'true'
    runs-on: windows-latest
    # Hoisted so the steps can be skipped when the secret is unset
    # (the `secrets` context cannot be used directly in an `if` condition).
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
      # Minimum days between winget-pkgs submissions. One PR/month keeps thurbox
      # well within what the winget moderators can review while still shipping a
      # recent version. Mirrors the Chocolatey window; tune here.
      THROTTLE_DAYS: "30"
    steps:
      - name: Checkout code at tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.check-release.outputs.version }}

      # Find the most recent thurbox PR we've submitted to winget-pkgs (merged
      # = a version went live, or still-open = one is already awaiting review)
      # and when it was raised. If that is younger than THROTTLE_DAYS, skip this
      # release (green + warning) so patch releases coalesce into one monthly
      # winget submission instead of flooding the moderation queue. This is the
      # winget analog of the Chocolatey feed check (there the signal is the
      # community feed's Published date; here it is our own last PR's date).
      - name: Check throttle window
        id: throttle
        if: env.WINGET_TOKEN != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $throttleDays = [int]$env:THROTTLE_DAYS
          $shouldPush = $true
          $reason = ""
          try {
            # Newest thurbox PR from the token account in any state (merged or
            # open) — its creation time is the last time we touched the channel.
            $prs = gh pr list --repo microsoft/winget-pkgs --author "@me" `
              --search "Thurbeen.thurbox in:title" --state all `
              --json createdAt --limit 100 | ConvertFrom-Json
            $last = $prs | Sort-Object { [datetime]$_.createdAt } -Descending | Select-Object -First 1
            if (-not $last) {
              $reason = "no prior thurbox PR on winget-pkgs — first submission"
            } else {
              $ageDays = ((Get-Date).ToUniversalTime() - ([datetime]$last.createdAt).ToUniversalTime()).TotalDays
              if ($ageDays -lt $throttleDays) {
                $shouldPush = $false
                $reason = ("last winget submission was {0:N1} days ago (< {1}d throttle)" -f $ageDays, $throttleDays)
              } else {
                $reason = ("last winget submission was {0:N1} days ago (>= {1}d throttle)" -f $ageDays, $throttleDays)
              }
            }
          } catch {
            # A lookup hiccup must not block a legitimate release; err toward submitting.
            $reason = "could not query winget-pkgs PRs ($($_.Exception.Message)); proceeding with submission"
          }
          "should_push=$($shouldPush.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          if ($shouldPush) {
            Write-Host "winget throttle: SUBMIT — $reason"
          } else {
            Write-Host "::warning title=winget submission throttled::Skipping this release — $reason. It will be coalesced into the next monthly winget submission."
            "winget submission **throttled** (green): $reason." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }

      - name: Download release checksums
        if: env.WINGET_TOKEN != '' && steps.throttle.outputs.should_push == 'true'
        shell: pwsh
        run: |
          $version = "${{ needs.check-release.outputs.version }}"
          $repo = "${{ github.repository }}"
          Invoke-WebRequest -UseBasicParsing `
            -Uri "https://github.com/$repo/releases/download/$version/thurbox-$version-checksums.txt" `
            -OutFile checksums.txt
          Get-Content checksums.txt

      - name: Bump manifests to the release version
        if: env.WINGET_TOKEN != '' && steps.throttle.outputs.should_push == 'true'
        shell: pwsh
        run: |
          python packaging/winget/bump-manifests.py `
            "${{ needs.check-release.outputs.version }}" `
            packaging/winget/manifests `
            checksums.txt
          Get-Content packaging/winget/manifests/Thurbeen.thurbox.installer.yaml

      - name: Install wingetcreate
        if: env.WINGET_TOKEN != '' && steps.throttle.outputs.should_push == 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest -UseBasicParsing `
            -Uri https://aka.ms/wingetcreate/latest `
            -OutFile wingetcreate.exe

      # `submit` validates the bumped manifests and opens a PR against
      # microsoft/winget-pkgs from a fork of the WINGET_TOKEN account. Works for
      # both the first submission and every subsequent version from the same
      # in-repo manifest set. WINGET_TOKEN MUST be a classic PAT with the
      # `public_repo` scope — wingetcreate rejects fine-grained tokens as
      # invalid (microsoft/winget-create#595). The token is passed via
      # WINGET_CREATE_GITHUB_TOKEN (Microsoft's recommended CI path) instead of
      # --token, which wingetcreate warns can leak the token into logs.
      - name: Submit manifests to winget-pkgs
        if: env.WINGET_TOKEN != '' && steps.throttle.outputs.should_push == 'true'
        shell: pwsh
        env:
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          .\wingetcreate.exe submit packaging/winget/manifests

      # Second-line cleanup behind the throttle above: even at one submission per
      # window, a stray manual dispatch (or a race) can leave more than one open
      # Thurbeen.thurbox PR. wingetcreate has no "supersede the previous open PR"
      # mode (`--replace` only supersedes a *published* manifest version, not a
      # pending PR), so right after submitting the new version, close every
      # *older* still-open PR authored by the token account, keeping only the one
      # just opened. Runs only when the throttle let us submit (so it never
      # closes a pending PR we deliberately coalesced into). Best-effort: never
      # fail the release on a cleanup hiccup.
      - name: Close superseded winget-pkgs PRs
        if: env.WINGET_TOKEN != '' && steps.throttle.outputs.should_push == 'true'
        shell: pwsh
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          $ErrorActionPreference = "Continue"
          $version = "${{ needs.check-release.outputs.version }}".TrimStart("v")
          # Open PRs by the token account for this package. `search` matches the
          # package moniker in the title that wingetcreate always emits.
          $prs = gh pr list --repo microsoft/winget-pkgs --author "@me" `
            --state open --search "Thurbeen.thurbox in:title" `
            --json number,title,createdAt --limit 100 | ConvertFrom-Json
          if (-not $prs -or $prs.Count -le 1) {
            Write-Host "Nothing to close ($($prs.Count) open PR(s))."
            exit 0
          }
          # Keep the PR for the version we just submitted; fall back to the most
          # recently created one if the title match is somehow ambiguous.
          $keep = $prs | Where-Object { $_.title -match [regex]::Escape("version $version") } | Select-Object -First 1
          if (-not $keep) {
            $keep = $prs | Sort-Object { [datetime]$_.createdAt } -Descending | Select-Object -First 1
          }
          Write-Host "Keeping #$($keep.number) ($($keep.title)); closing $($prs.Count - 1) superseded PR(s)."
          foreach ($pr in $prs | Where-Object { $_.number -ne $keep.number }) {
            gh pr close $pr.number --repo microsoft/winget-pkgs `
              --comment "Superseded by #$($keep.number) ($($keep.title)). Auto-closing this stale version-bump PR from thurbox release CI."
            Write-Host "Closed #$($pr.number) ($($pr.title))."
          }
