name: CI

on:
  pull_request:
    branches: [main]
  # The merge queue re-runs the full suite against the temporary
  # `gh-readonly-queue/*` branch (PR rebased onto main). Without this trigger the
  # required "All Checks" gate never reports on a queued PR and it stalls until
  # the queue's check timeout, so the queue *needs* this to merge anything.
  merge_group:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Cancel a superseded run when a new commit is pushed to the same PR, so rapid
# re-pushes don't pile up parallel runs of the (heavy) Rust matrix. Each merge
# queue entry gets a distinct `github.ref`, so queued runs never cancel each
# other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Classify the PR diff into file-category outputs the other jobs gate on, so a
  # docs-only (or shell-only, website-only, …) PR skips the irrelevant jobs.
  # Job-level `if:` (not workflow-level `paths-ignore:`) is required so the
  # always-run `all-checks` gate still reports a status — a skipped job reports
  # `skipped`, which `all-checks` treats as success.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust || steps.all.outputs.all }}
      shell: ${{ steps.filter.outputs.shell || steps.all.outputs.all }}
      markdown: ${{ steps.filter.outputs.markdown || steps.all.outputs.all }}
      lua: ${{ steps.filter.outputs.lua || steps.all.outputs.all }}
      website: ${{ steps.filter.outputs.website || steps.all.outputs.all }}
      install_sh: ${{ steps.filter.outputs.install_sh || steps.all.outputs.all }}
      install_ps: ${{ steps.filter.outputs.install_ps || steps.all.outputs.all }}
    steps:
      # A merge queue entry already contains exactly the PR's changes; validate
      # the whole suite against it rather than diffing (paths-filter has no PR
      # base on a `merge_group` event). Every filter output falls back to this.
      - id: all
        if: github.event_name == 'merge_group'
        run: echo "all=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name == 'pull_request'
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          # Every filter includes `.github/workflows/ci.yml` so editing the
          # workflow re-runs all jobs — any job's definition may have changed.
          filters: |
            rust:
              - 'src/**'
              - 'tests/**'
              - 'build.rs'
              # The Lua trees are Rust inputs, not merely neighbours: they are
              # `include_str!`d into the binary, and the suite asserts on their
              # CONTENT — `tests/v2_new_session.rs` checks a string that exists
              # only in `ui/plugins/10_sessions.lua`. Without these, a Lua-only
              # change skips clippy, nextest and both Windows jobs, and can
              # red-build main while its own PR is
              # green. The `lua` filter below already lists all three.
              - 'ui/**'
              - 'ui-plugins/**'
              - 'docs/examples/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.config/nextest.toml'
              - 'deny.toml'
              # The configs that decide these jobs' verdicts, so changing a rule
              # re-runs what it rules on.
              - 'clippy.toml'
              - '.rustfmt.toml'
              - 'sonar-project.properties'
              - '.github/workflows/ci.yml'
            shell:
              - '**/*.sh'
              - '.shellcheckrc'
              - '.github/workflows/ci.yml'
            markdown:
              - '**/*.md'
              - '.rumdl.toml'
              - '.github/workflows/ci.yml'
            lua:
              - 'ui/**'
              # The starter is Lua that ships: it is embedded in the binary and is
              # what `thurbox-cli plugin new` writes, so it is linted like a pane.
              - 'docs/examples/**'
              # And the distributed panes, which are Lua somebody installs into
              # their interface — subject to the same sandbox as a bundled one.
              - 'ui-plugins/**'
              - 'selene.toml'
              - 'thurbox.yml'
              - 'stylua.toml'
              - '.luarc.json'
              - '.github/workflows/ci.yml'
            website:
              - 'website/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            install_sh:
              - 'scripts/install.sh'
              - 'scripts/install.bats'
              - '.github/workflows/ci.yml'
            install_ps:
              - 'scripts/install.ps1'
              - 'scripts/install.Tests.ps1'
              - '.github/workflows/ci.yml'

  # No `check` job. `clippy --all-targets -D warnings` below type-checks the
  # same targets, so a separate `cargo check` was a second full build on its
  # own runner asserting nothing extra — the reasoning the Windows gate already
  # applied when it dropped its own check pass.
  fmt:
    name: Rustfmt
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  nextest:
    name: Nextest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2.86.5
        with:
          tool: cargo-nextest
      # A real multiplexer, so the tests that drive one run here rather than
      # skip: `tests/create_e2e.rs`, `tests/v2_attach_by_name.rs`, and the
      # live-session scenario of `tests/tui_e2e.rs` — the real binary on a pty,
      # attached to a pane with a shell in it. Every one of them lands on a
      # private socket under a private `TMUX_TMPDIR`.
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - run: cargo nextest run --all --profile ci

  # Native-Windows gate (psmux backend selection, known-folder paths, toast
  # notifications, junction workspaces), split into two parallel jobs so the heavy
  # Windows compile isn't serialized: clippy-driver and rustc don't share
  # artifacts, so a single job ran two back-to-back full builds (~9 min). The
  # separate `cargo check` pass was dropped — `clippy -D warnings` already
  # type-checks, so it covers the compile gate. Each job excludes the build dirs
  # from Defender real-time scanning, the dominant Windows-runner overhead (it
  # scans every .rlib/.exe cargo writes). The local dockur VM
  # (scripts/dev/e2e/windows-vm.sh test-suite) runs the same suite from a
  # cross-built nextest archive; these jobs are the automated mirror.
  windows-clippy:
    name: Windows (clippy)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Exclude build dirs from Defender real-time scanning
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.rustup"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  windows-test:
    name: Windows (tests)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Exclude build dirs from Defender real-time scanning
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.rustup"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2.86.5
        with:
          tool: cargo-nextest
      # --no-fail-fast: surface every native-Windows test failure in one run
      # (the `ci` profile is fail-fast); easier to triage runner-specific issues.
      - run: cargo nextest run --all --profile ci --no-fail-fast

  # No `architecture` job: `tests/architecture_rules.rs` is an ordinary
  # integration test, so `nextest run --all` above already runs it, and the
  # dedicated job was a second build and run on its own runner.
  #
  # No `tui-smoke` job either. The bash smoke script it ran (a tmux pane,
  # `send-keys`, `capture-pane`) was replaced by `tests/tui_e2e.rs`, which runs
  # the real binary on a real pty inside the `nextest` job — against the build
  # that job already made — and sees the byte stream `capture-pane` discards
  # (alternate screen, mouse modes, a screen clear on a reflow).

  # No `acceptance` job. It ran `-E 'test(app::acceptance::)'`, which was v1's
  # in-process TEA harness under `src/app` — deleted when the kernel took the
  # binary name. The filter then matched nothing, nextest exited non-zero on "no
  # tests run", and the job was red on every push while asserting nothing. Its
  # successors are `tests/v2_*.rs`, which the `nextest` job already runs via
  # `--all`, so re-pointing it would only duplicate that.

  deny:
    name: Cargo Deny
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        checks:
          - advisories
          - bans licenses sources
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check ${{ matrix.checks }}
          log-level: warn

  docs:
    name: Documentation
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

  conventional-commits:
    name: Conventional Commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Check conventional commits
        uses: cocogitto/cocogitto-action@52d0023b4396897f1815648e553db2ab8d782f3a # v4.2.0
        with:
          command: check

  markdown-lint:
    name: Markdown Lint
    needs: changes
    if: needs.changes.outputs.markdown == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Lint markdown files
        uses: rvben/rumdl@023027472dbcb502aeb89760f4122e2235d36490 # v0.2.58
        with:
          report-type: annotations

  install-script:
    name: Install Script Tests
    needs: changes
    if: needs.changes.outputs.install_sh == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install bats-core
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Run install script tests
        run: bats scripts/install.bats

  install-script-ps:
    name: Install Script Tests (PowerShell)
    needs: changes
    if: needs.changes.outputs.install_ps == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # pwsh is preinstalled on GitHub-hosted runners. The install.ps1 helpers
      # are platform-independent (the tests set PROCESSOR_ARCHITECTURE
      # themselves), so they run on ubuntu rather than needing a windows runner.
      - name: Run install.ps1 helper tests (Pester)
        shell: pwsh
        run: |
          $mod = Get-Module -ListAvailable Pester |
            Sort-Object Version -Descending | Select-Object -First 1
          if (-not $mod -or $mod.Version.Major -lt 5) {
            Install-Module Pester -MinimumVersion 5.0.0 -Force -SkipPublisherCheck -Scope CurrentUser
          }
          Import-Module Pester -MinimumVersion 5.0.0
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = 'scripts/install.Tests.ps1'
          $cfg.Run.Exit = $true
          $cfg.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $cfg

  shellcheck:
    name: ShellCheck
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck

  lua:
    name: Lua Lint
    needs: changes
    if: needs.changes.outputs.lua == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install selene and stylua
        # Both are single Rust binaries, so this needs no Lua toolchain — which
        # is why they were chosen over luacheck (LuaRocks) for CI.
        uses: taiki-e/install-action@v2
        with:
          tool: selene,stylua
      - name: Lint the plugin interface
        # `selene.toml` points at `thurbox.yml`, the plugin VM's real standard
        # library — so this also checks that no plugin reaches for a capability
        # the kernel withholds.
        run: selene ui docs/examples ui-plugins
      - name: Check formatting
        run: stylua --check ui docs/examples ui-plugins
      - name: Install lua-language-server
        # Fetched from the release like neovim's own lint job does; there is no
        # pinned action for it. Version is explicit so a new release cannot change
        # what CI enforces without a commit.
        env:
          LUALS_VERSION: 3.19.1
        run: |
          curl -fsSL -o luals.tar.gz \
            "https://github.com/LuaLS/lua-language-server/releases/download/${LUALS_VERSION}/lua-language-server-${LUALS_VERSION}-linux-x64.tar.gz"
          mkdir -p "$HOME/.luals" && tar -xzf luals.tar.gz -C "$HOME/.luals"
          echo "$HOME/.luals/bin" >> "$GITHUB_PATH"
      - name: Type-check the plugin interface
        # The deeper pass, and what neovim gates its own Lua on. `.luarc.json`
        # disables the libraries the plugin VM withholds, so this catches an
        # `os.`/`io.`/`debug.`/`package.` reach as well as a type error.
        # Exits non-zero on any finding at Warning or above.
        #
        # `--configpath` must be ABSOLUTE: a relative one is resolved against the
        # server's own install directory, not the working directory, so it is
        # silently not found and every injected global reads as undefined — 79
        # phantom findings rather than an error saying the config was missed.
        run: lua-language-server --check ui --configpath "$PWD/.luarc.json" --checklevel=Warning

  website-lint:
    name: Website Lint
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # Page .html sources carry YAML front matter and are partial Eleventy
      # templates, so Prettier/HTMLHint run on the CSS/JS sources and on the
      # built _site output rather than the page sources. lint:website builds
      # the site first, then runs every linter.
      - name: Lint website
        run: npm run lint:website

  sonarqube:
    name: SonarQube
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: SonarQube Quality Gate check
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Informational only — tracks the release binary size so growth is visible in
  # the PR. Deliberately NOT in `all-checks.needs`, so it never blocks a merge.
  # See docs/PERFORMANCE.md (memory / binary size).
  binary-size:
    name: Binary Size
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build release binaries
        run: cargo build --release --bins
      - name: Record binary sizes
        run: |
          {
            echo "### Release binary sizes"
            echo ""
            echo "| Binary | Size |"
            echo "| ------ | ---- |"
            for bin in thurbox thurbox-cli; do
              path="target/release/$bin"
              [ -f "$path" ] || continue
              size=$(du -h "$path" | cut -f1)
              bytes=$(stat -c%s "$path")
              echo "| \`$bin\` | $size ($bytes bytes) |"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload binaries as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-binaries
          path: |
            target/release/thurbox
            target/release/thurbox-cli
          if-no-files-found: warn

  all-checks:
    name: All Checks
    if: always()
    needs:
      - changes
      - fmt
      - clippy
      - nextest
      - windows-clippy
      - windows-test
      - deny
      - docs
      - conventional-commits
      - markdown-lint
      - install-script
      - install-script-ps
      - shellcheck
      - lua
      - website-lint
      - sonarqube
    runs-on: ubuntu-latest
    steps:
      - name: Verify all checks passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]] || \
             [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more checks failed or were cancelled"
            exit 1
          fi
          echo "All checks passed"
