name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      shell: ${{ steps.filter.outputs.shell }}
      markdown: ${{ steps.filter.outputs.markdown }}
      doc_refs: ${{ steps.filter.outputs.doc_refs }}
      lua: ${{ steps.filter.outputs.lua }}
      website: ${{ steps.filter.outputs.website }}
      install_sh: ${{ steps.filter.outputs.install_sh }}
      install_ps: ${{ steps.filter.outputs.install_ps }}
      install_e2e: ${{ steps.filter.outputs.install_e2e }}
      winget: ${{ steps.filter.outputs.winget }}
      pr_title: ${{ steps.filter.outputs.pr_title }}
      release_line: ${{ steps.filter.outputs.release_line }}
      dev_scripts: ${{ steps.filter.outputs.dev_scripts }}
      nix: ${{ steps.filter.outputs.nix }}
      fleet: ${{ steps.filter.outputs.fleet }}
      runtime: ${{ steps.filter.outputs.runtime }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/thurbox/**'
              - 'crates/runtime-*/**'
              - 'crates/term-stream/**'
              - 'crates/workspace-git/**'
              - 'ui/**'
              - 'examples/lua/**'
              - 'examples/panes/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'vendor/**'
              - '.config/nextest.toml'
              - 'deny.toml'
              - 'clippy.toml'
              - '.rustfmt.toml'
              - 'sonar-project.properties'
              - '.github/workflows/ci.yml'
            shell:
              - '**/*.sh'
              - '.shellcheckrc'
              - '.github/workflows/ci.yml'
            markdown:
              - '**/*.md'
              - '.rumdl.toml'
              - 'scripts/ci/check-rumdl-version.*'
              - '.github/workflows/ci.yml'
            doc_refs:
              - '**/*.md'
              - 'examples/**'
              - '.github/workflows/ci.yml'
            lua:
              - 'ui/**'
              - 'examples/**'
              - 'selene.toml'
              - 'thurbox.yml'
              - 'stylua.toml'
              - '.luarc.json'
              - 'crates/thurbox/tests/fixtures/lua_types/**'
              - 'scripts/ci/check-lua-types.sh'
              - 'crates/thurbox/tests/fixtures/lua_std/**'
              - 'scripts/ci/check-lua-std.sh'
              - '.github/workflows/ci.yml'
            website:
              - 'website/**'
              - 'eleventy.config.js'
              - 'scripts/ci/*mods*.mjs'
              - 'scripts/ci/website.test.mjs'
              - 'scripts/docs/*.mjs'
              - 'crates/fleet-api/src/harness/bundled.rs'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            install_sh:
              - 'scripts/install.sh'
              - 'scripts/install.bats'
              - 'scripts/ci/release-archive.sh'
              - '.github/workflows/ci.yml'
            install_ps:
              - 'scripts/install.ps1'
              - 'scripts/install.Tests.ps1'
              - 'scripts/ci/release-archive.sh'
              - '.github/workflows/ci.yml'
            install_e2e:
              - 'scripts/install.sh'
              - 'scripts/install.ps1'
              - 'scripts/ci/release-archive.sh'
              - 'scripts/ci/install-e2e.sh'
              - 'crates/*/Cargo.toml'
              - '.github/workflows/cd.yml'
              - '.github/workflows/ci.yml'
            winget:
              - 'packaging/winget/**'
              - '.github/workflows/ci.yml'
            dev_scripts:
              - 'scripts/dev/e2e/windows-vm.sh'
              - 'scripts/dev/e2e/windows-vm.bats'
              - 'scripts/dev/e2e/lib/e2e-common.sh'
              - 'crates/runtime-mux/src/psmux.rs'
              - 'scripts/dev/lib/sandbox-env.sh'
              - 'scripts/dev/lib/sandbox-env.bats'
              - '.github/workflows/ci.yml'
            fleet:
              - 'crates/fleet-*/**'
              - 'crates/arch-rules/**'
              - 'crates/term-stream/**'
              - 'crates/architecture.toml'
              - 'crates/*/Cargo.toml'
              - 'examples/fleet/**'
              - 'examples/runtimes/**'
              - 'scripts/fleet/**'
              - 'docs/fleet/**'
              - '.agents/skills/**'
              - '.claude/skills/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'cog.toml'
              - 'rust-toolchain.toml'
              - '.cargo/config.toml'
              - '.config/nextest.toml'
              - 'deny.toml'
              - 'clippy.toml'
              - '.rustfmt.toml'
              - '.github/workflows/ci.yml'
            runtime:
              - 'crates/runtime-mux/**'
              - 'crates/runtime-herdr/**'
              - 'crates/term-stream/**'
              - 'crates/workspace-git/**'
              - '.github/workflows/ci.yml'
            nix:
              - 'flake.nix'
              - 'flake.lock'
              - 'nix/**'
              - 'crates/thurbox/**'
              - 'crates/runtime-mux/**'
              - 'crates/term-stream/**'
              - 'crates/*/Cargo.toml'
              - 'ui/**'
              - 'examples/lua/**'
              - 'examples/panes/**'
              - 'vendor/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
            pr_title:
              - 'scripts/ci/check-pr-title.sh'
              - 'scripts/ci/check-pr-title.bats'
              - 'cog.toml'
              - '.github/workflows/pr-title.yml'
              - '.github/workflows/ci.yml'
            release_line:
              - 'scripts/ci/release-line.sh'
              - 'scripts/ci/release-line.bats'
              - '.github/release-hold'
              - 'crates/thurbox/src/update/version_check.rs'
              - '.github/workflows/cd.yml'
              - '.github/workflows/ci.yml'

  fmt:
    name: Rustfmt
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.fleet == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --exclude 'fleet-*' --exclude arch-rules --all-targets --all-features -- -D warnings

  arm-clippy:
    name: Clippy (aarch64 Linux)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --exclude 'fleet-*' --exclude arch-rules --all-targets --all-features -- -D warnings

  nextest:
    name: Nextest
    needs: changes
    if: >-
      needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.fleet == 'true' ||
      needs.changes.outputs.doc_refs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-nextest
      - name: Install tmux, Xvfb, dbus, jq, sshd and sqlite3
        if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.fleet == 'true'
        run: sudo apt-get update && sudo apt-get install -y tmux xvfb dbus jq openssh-server sqlite3
      - name: Install herdr-core at the version nix/herdr-core.nix pins
        if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.fleet == 'true'
        env:
          HERDR_CORE_VERSION: 0.1.22
          HERDR_CORE_SHA256: 3054ec3992ce80c5715d721caa9dcefa6056721d15dc113f4750afce763ba5df
        run: |
          curl -fsSLo "$RUNNER_TEMP/herdr-core.tar.gz" "https://releases.herdr.dev/core/${HERDR_CORE_VERSION}/herdr-core-linux-x86_64.tar.gz"
          echo "${HERDR_CORE_SHA256}  $RUNNER_TEMP/herdr-core.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/herdr-core.tar.gz" -C "$RUNNER_TEMP" herdr-core
          sudo install -m755 "$RUNNER_TEMP/herdr-core" /usr/local/bin/herdr-core
      - name: Build fleet for the tests that drive a real Fleet
        if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.fleet == 'true'
        run: cargo build -p fleet-cli --bin fleet
      - if: needs.changes.outputs.rust == 'true'
        run: cargo nextest run --workspace --exclude 'fleet-*' --exclude arch-rules --profile ci
      - name: Run the thurbox tests that drive Fleet on a Fleet-only change
        if: needs.changes.outputs.rust != 'true' && needs.changes.outputs.fleet == 'true'
        run: |
          cargo build -p runtime-mux -p workspace-git --bin runtime-mux --bin workspace-git
          cargo nextest run -p thurbox --test fleet_engine_e2e --test tui_e2e --profile ci
      - name: Run the runtime protocol e2e test
        if: needs.changes.outputs.fleet == 'true' || needs.changes.outputs.runtime == 'true'
        run: |
          cargo build --locked -p runtime-herdr --bin runtime-herdr
          cargo nextest run --locked -p fleet-cli --test e2e_runtime_exec --profile ci
      - name: Run the architecture rules
        if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.fleet == 'true'
        run: cargo nextest run --locked -p arch-rules --profile ci
      - if: needs.changes.outputs.rust != 'true' && needs.changes.outputs.doc_refs == 'true'
        run: cargo nextest run -p thurbox --test doc_references --profile ci
      # Nextest cannot run doctests.
      - if: needs.changes.outputs.rust == 'true'
        run: cargo test --doc --workspace --exclude 'fleet-*' --exclude arch-rules --locked
      - name: Run the vendored crossterm patch's tests
        if: needs.changes.outputs.rust == 'true'
        run: cargo test --locked --manifest-path vendor/crossterm/Cargo.toml --target-dir target --lib thurbox_patch

  windows-clippy:
    name: Windows (clippy)
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.fleet == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Exclude build dirs from Defender real-time scanning
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.rustup"
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: needs.changes.outputs.rust == 'true'
        run: cargo clippy --workspace --exclude 'fleet-*' --exclude arch-rules --all-targets --all-features -- -D warnings
      - if: ${{ !cancelled() && needs.changes.outputs.fleet == 'true' }}
        run: cargo clippy -p 'fleet-*' --locked --all-targets --all-features -- -D warnings

  windows-test:
    name: Windows (tests)
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.fleet == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Exclude build dirs from Defender real-time scanning
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.rustup"
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-nextest
      - if: needs.changes.outputs.rust == 'true'
        run: cargo nextest run --workspace --exclude 'fleet-*' --exclude arch-rules --profile ci --no-fail-fast
      - name: Run Fleet's tests even when thurbox's fail
        if: ${{ !cancelled() && needs.changes.outputs.fleet == 'true' }}
        run: cargo nextest run -p 'fleet-*' --locked --all-features --profile ci --no-fail-fast

  deny:
    name: Cargo Deny
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.fleet == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        checks:
          - advisories
          - bans licenses sources
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2
        with:
          command: check ${{ matrix.checks }}
          log-level: warn

  docs:
    name: Documentation
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo doc --workspace --exclude 'fleet-*' --exclude arch-rules --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

  pr-title-checker:
    name: PR Title Checker
    needs: changes
    if: needs.changes.outputs.pr_title == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install cocogitto
        uses: cocogitto/cocogitto-action@52d0023b4396897f1815648e553db2ab8d782f3a # v4.2.0
        with:
          install-only: true
      - name: Install bats-core
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Test the PR title checker
        run: bats scripts/ci/check-pr-title.bats

  release-line:
    name: Release Line Gate
    needs: changes
    if: needs.changes.outputs.release_line == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install bats-core
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Test the release-line gate
        run: bats scripts/ci/release-line.bats

  markdown-lint:
    name: Markdown Lint
    needs: changes
    if: needs.changes.outputs.markdown == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Lint markdown files
        uses: rvben/rumdl@ba563d6780c6119bd526c869a730b492c1ad54e5 # v0.3.5
        with:
          version: 0.3.3
          report-type: annotations
      - name: Install bats-core
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Test the local rumdl version check against the pin above
        run: bats scripts/ci/check-rumdl-version.bats

  install-script:
    name: Install Script Tests
    needs: changes
    if: needs.changes.outputs.install_sh == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install bats-core
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Run install script tests
        run: bats scripts/install.bats

  install-script-ps:
    name: Install Script Tests (${{ matrix.shell }} on ${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.install_ps == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, shell: pwsh }
          - { os: windows-latest, shell: pwsh }
          - { os: windows-latest, shell: powershell }
    runs-on: ${{ matrix.os }}
    # A step's own `shell:` takes no expression; the job default does.
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run install.ps1 tests (Pester)
        run: |
          $mod = Get-Module -ListAvailable Pester |
            Sort-Object Version -Descending | Select-Object -First 1
          if (-not $mod -or $mod.Version.Major -lt 5) {
            Install-Module Pester -MinimumVersion 5.0.0 -Force -SkipPublisherCheck -Scope CurrentUser
          }
          Import-Module Pester -MinimumVersion 5.0.0
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = 'scripts/install.Tests.ps1'
          $cfg.Run.Exit = $true
          $cfg.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $cfg

  install-e2e:
    name: Clean install (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.install_e2e == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, cargo: cross }
          - { os: macos-15, target: aarch64-apple-darwin, cargo: cargo }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, cargo: cargo }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Exclude build dirs from Defender real-time scanning
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.rustup"
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: matrix.cargo == 'cross'
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cross
      - name: Build and pack the release archive
        run: |
          bins=()
          for bin in $(scripts/ci/release-archive.sh --binaries); do bins+=(--bin "$bin"); done
          ${{ matrix.cargo }} build --locked --target ${{ matrix.target }} "${bins[@]}"
          scripts/ci/release-archive.sh v0.0.0-ci ${{ matrix.target }} \
            target/${{ matrix.target }}/debug dist
      - name: Install and check on a clean Debian
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            docker.io/library/debian:trixie-slim@sha256:a72b4433de1cf7d6bae0c4cee74d0547f58601a643b3375f070c51600d63b6b2 \
            sh -c 'apt-get update -qq &&
              apt-get install -qq -y --no-install-recommends ca-certificates curl jq python3 tmux >/dev/null &&
              scripts/ci/install-e2e.sh dist v0.0.0-ci &&
              scripts/ci/install-e2e.sh dist v0.0.0-ci --fleet-only'
      - name: Install and check on macOS
        if: runner.os == 'macOS'
        run: |
          brew install tmux
          scripts/ci/install-e2e.sh dist v0.0.0-ci
          scripts/ci/install-e2e.sh dist v0.0.0-ci --fleet-only
      - name: Install and check on Windows
        if: runner.os == 'Windows'
        run: |
          scripts/ci/install-e2e.sh dist v0.0.0-ci
          scripts/ci/install-e2e.sh dist v0.0.0-ci --fleet-only

  winget-packaging:
    name: winget Packaging Tests
    needs: changes
    if: needs.changes.outputs.winget == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install bats-core
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Run winget packaging tests
        run: bats packaging/winget/winget.bats

  dev-scripts:
    name: Dev Script Tests
    needs: changes
    if: needs.changes.outputs.dev_scripts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install bats-core
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Run the psmux hook-status gate probe tests
        run: bats scripts/dev/e2e/windows-vm.bats
      - name: Run the sandbox environment tests
        run: bats scripts/dev/lib/sandbox-env.bats

  shellcheck:
    name: ShellCheck
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck

  large-files:
    name: Large Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: j178/prek-action@7b101f8338a08d2bd6fdb3625e4e7692428763a3 # v3.1.1
        with:
          prek-version: v0.5.11
          extra-args: check-added-large-files --all-files

  lua:
    name: Lua Lint
    needs: changes
    if: needs.changes.outputs.lua == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install selene and stylua
        uses: taiki-e/install-action@v2
        with:
          tool: selene,stylua
      - name: Lint the plugin interface
        run: selene ui examples
      - name: Check the standard library still declares what the kernel serves
        run: scripts/ci/check-lua-std.sh
      - name: Check formatting
        run: stylua --check ui examples
      - name: Install lua-language-server at a pinned release
        env:
          LUALS_VERSION: 3.19.1
        run: |
          curl -fsSL -o luals.tar.gz \
            "https://github.com/LuaLS/lua-language-server/releases/download/${LUALS_VERSION}/lua-language-server-${LUALS_VERSION}-linux-x64.tar.gz"
          mkdir -p "$HOME/.luals" && tar -xzf luals.tar.gz -C "$HOME/.luals"
          echo "$HOME/.luals/bin" >> "$GITHUB_PATH"
      - name: Type-check the plugin interface
        # lua-language-server resolves a relative --configpath against its own install directory.
        run: lua-language-server --check ui --configpath "$PWD/.luarc.json" --checklevel=Warning
      - name: Check the type definitions still catch a typo
        run: scripts/ci/check-lua-types.sh

  website-lint:
    name: Website Lint
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Lint website
        run: npm run lint:website
      - name: Validate mod registry URLs and live topic discovery
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run check:mods:links

  sonarqube:
    name: SonarQube
    needs: changes
    # GitHub hands no repository secret to a pull_request run from a fork.
    if: >-
      github.repository == 'Thurbeen/thurbox' &&
      needs.changes.outputs.rust == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: SonarQube Quality Gate check
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  binary-size:
    name: Binary Size
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build release binaries
        run: cargo build --release -p thurbox --bins
      - name: Record binary sizes
        run: |
          {
            echo "### Release binary sizes"
            echo ""
            echo "| Binary | Size |"
            echo "| ------ | ---- |"
            for bin in thurbox thurbox-cli; do
              path="target/release/$bin"
              [ -f "$path" ] || continue
              size=$(du -h "$path" | cut -f1)
              bytes=$(stat -c%s "$path")
              echo "| \`$bin\` | $size ($bytes bytes) |"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload binaries as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-binaries
          path: |
            target/release/thurbox
            target/release/thurbox-cli
          if-no-files-found: warn

  nix:
    name: Nix package
    needs: changes
    if: needs.changes.outputs.nix == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-gha-cache: true
          use-flakehub: false
          diagnostic-endpoint: ""
      - run: nix flake check --all-systems -L
      - run: nix build -L
      - run: ./result/bin/thurbox-cli version

  fleet:
    name: Fleet (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.fleet == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-26.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install the pinned toolchain
        shell: bash
        run: |
          rustup toolchain install
          rustup default "$(rustup show active-toolchain | cut -d' ' -f1)"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-nextest
      - uses: cocogitto/cocogitto-action@52d0023b4396897f1815648e553db2ab8d782f3a # v4.2.0
        with:
          install-only: true
      - run: cargo clippy -p 'fleet-*' -p arch-rules --locked --all-targets --all-features -- -D warnings
      - run: cargo nextest run -p 'fleet-*' --locked --all-features --profile ci --no-fail-fast -E 'not binary(e2e_runtime_exec)'
      - run: cargo test -p 'fleet-*' -p arch-rules --locked --all-features --doc
      - run: cargo doc -p 'fleet-*' -p arch-rules --locked --all-features --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  all-checks:
    name: All Checks
    if: always()
    needs:
      - changes
      - fmt
      - clippy
      - arm-clippy
      - nextest
      - windows-clippy
      - windows-test
      - deny
      - docs
      - pr-title-checker
      - release-line
      - markdown-lint
      - install-script
      - install-script-ps
      - install-e2e
      - winget-packaging
      - dev-scripts
      - nix
      - fleet
      - shellcheck
      - large-files
      - lua
      - website-lint
      - sonarqube
    runs-on: ubuntu-latest
    steps:
      - name: Verify all checks passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]] || \
             [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more checks failed or were cancelled"
            exit 1
          fi
          echo "All checks passed"
