name: CI

on:
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Cancel a superseded run when a new commit is pushed to the same PR, so rapid
# re-pushes don't pile up parallel runs of the (heavy) Rust matrix.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Classify the PR diff into file-category outputs the other jobs gate on, so a
  # docs-only (or shell-only, website-only, …) PR skips the irrelevant jobs.
  # Job-level `if:` (not workflow-level `paths-ignore:`) is required so the
  # always-run `all-checks` gate still reports a status — a skipped job reports
  # `skipped`, which `all-checks` treats as success.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      shell: ${{ steps.filter.outputs.shell }}
      markdown: ${{ steps.filter.outputs.markdown }}
      website: ${{ steps.filter.outputs.website }}
      install_sh: ${{ steps.filter.outputs.install_sh }}
      install_ps: ${{ steps.filter.outputs.install_ps }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          # Every filter includes `.github/workflows/ci.yml` so editing the
          # workflow re-runs all jobs — any job's definition may have changed.
          filters: |
            rust:
              - 'src/**'
              - 'tests/**'
              - 'build.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.config/nextest.toml'
              - 'deny.toml'
              - 'sonar-project.properties'
              - '.github/workflows/ci.yml'
            shell:
              - '**/*.sh'
              - '.shellcheckrc'
              - '.github/workflows/ci.yml'
            markdown:
              - '**/*.md'
              - '.rumdl.toml'
              - '.github/workflows/ci.yml'
            website:
              - 'website/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            install_sh:
              - 'scripts/install.sh'
              - 'scripts/install.bats'
              - '.github/workflows/ci.yml'
            install_ps:
              - 'scripts/install.ps1'
              - 'scripts/install.Tests.ps1'
              - '.github/workflows/ci.yml'

  check:
    name: Check
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo check --all

  fmt:
    name: Rustfmt
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo clippy --all-targets --all-features -- -D warnings

  nextest:
    name: Nextest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: taiki-e/install-action@8b3c737da4b541bf0fb5a3e0488ff20535badac9 # v2.82.1
        with:
          tool: cargo-nextest
      - run: cargo nextest run --all --profile ci

  windows:
    name: Windows (check + clippy)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: taiki-e/install-action@8b3c737da4b541bf0fb5a3e0488ff20535badac9 # v2.82.1
        with:
          tool: cargo-nextest
      # Native-Windows gate: compile (psmux backend selection, known-folder paths,
      # toast notifications, junction workspaces) AND run the full test suite. The
      # local dockur VM (scripts/dev/windows-test.sh test-suite) runs the same
      # suite from a cross-built nextest archive; this job is the automated mirror.
      - run: cargo check --all --all-targets
      - run: cargo clippy --all-targets --all-features -- -D warnings
      # --no-fail-fast: surface every native-Windows test failure in one run
      # (the `ci` profile is fail-fast); easier to triage runner-specific issues.
      - run: cargo nextest run --all --profile ci --no-fail-fast

  architecture:
    name: Architecture Rules
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo test --test architecture_rules

  tui-smoke:
    name: TUI Smoke Test
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Black-box TUI smoke test
        run: scripts/dev/tui-smoke-test.sh

  acceptance:
    name: Acceptance Tests
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: taiki-e/install-action@8b3c737da4b541bf0fb5a3e0488ff20535badac9 # v2.82.1
        with:
          tool: cargo-nextest
      - name: Run TUI acceptance (e2e) tests
        run: cargo nextest run --profile ci -E 'test(app::acceptance::)'

  deny:
    name: Cargo Deny
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        checks:
          - advisories
          - bans licenses sources
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
        with:
          command: check ${{ matrix.checks }}
          log-level: warn

  docs:
    name: Documentation
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

  conventional-commits:
    name: Conventional Commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
      - name: Check conventional commits
        uses: cocogitto/cocogitto-action@52d0023b4396897f1815648e553db2ab8d782f3a # v4.2.0
        with:
          command: check

  markdown-lint:
    name: Markdown Lint
    needs: changes
    if: needs.changes.outputs.markdown == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Lint markdown files
        uses: rvben/rumdl@e8147c3e3ebbcc4a7cddfc9869afb7ff0dd4402b # v0.2.20
        with:
          report-type: annotations

  install-script:
    name: Install Script Tests
    needs: changes
    if: needs.changes.outputs.install_sh == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Install bats-core
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Run install script tests
        run: bats scripts/install.bats

  install-script-ps:
    name: Install Script Tests (PowerShell)
    needs: changes
    if: needs.changes.outputs.install_ps == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      # pwsh is preinstalled on GitHub-hosted runners. The install.ps1 helpers
      # are platform-independent (the tests set PROCESSOR_ARCHITECTURE
      # themselves), so they run on ubuntu rather than needing a windows runner.
      - name: Run install.ps1 helper tests (Pester)
        shell: pwsh
        run: |
          $mod = Get-Module -ListAvailable Pester |
            Sort-Object Version -Descending | Select-Object -First 1
          if (-not $mod -or $mod.Version.Major -lt 5) {
            Install-Module Pester -MinimumVersion 5.0.0 -Force -SkipPublisherCheck -Scope CurrentUser
          }
          Import-Module Pester -MinimumVersion 5.0.0
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = 'scripts/install.Tests.ps1'
          $cfg.Run.Exit = $true
          $cfg.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $cfg

  shellcheck:
    name: ShellCheck
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck

  website-lint:
    name: Website Lint
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # Page .html sources carry YAML front matter and are partial Eleventy
      # templates, so Prettier/HTMLHint run on the CSS/JS sources and on the
      # built _site output rather than the page sources. lint:website builds
      # the site first, then runs every linter.
      - name: Lint website
        run: npm run lint:website

  sonarqube:
    name: SonarQube
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e # v8.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: SonarQube Quality Gate check
        uses: SonarSource/sonarqube-quality-gate-action@cf038b0e0cdecfa9e56c198bbb7d21d751d62c3b # v1.2.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Informational only — tracks the release binary size so growth is visible in
  # the PR. Deliberately NOT in `all-checks.needs`, so it never blocks a merge.
  # See docs/PERFORMANCE.md (memory / binary size).
  binary-size:
    name: Binary Size
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Build release binaries
        run: cargo build --release --bins
      - name: Record binary sizes
        run: |
          {
            echo "### Release binary sizes"
            echo ""
            echo "| Binary | Size |"
            echo "| ------ | ---- |"
            for bin in thurbox thurbox-cli; do
              path="target/release/$bin"
              [ -f "$path" ] || continue
              size=$(du -h "$path" | cut -f1)
              bytes=$(stat -c%s "$path")
              echo "| \`$bin\` | $size ($bytes bytes) |"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload binaries as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-binaries
          path: |
            target/release/thurbox
            target/release/thurbox-cli
          if-no-files-found: warn

  all-checks:
    name: All Checks
    if: always()
    needs:
      - changes
      - check
      - fmt
      - clippy
      - nextest
      - acceptance
      - architecture
      - windows
      - tui-smoke
      - deny
      - docs
      - conventional-commits
      - markdown-lint
      - install-script
      - install-script-ps
      - shellcheck
      - website-lint
      - sonarqube
    runs-on: ubuntu-latest
    steps:
      - name: Verify all checks passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]] || \
             [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more checks failed or were cancelled"
            exit 1
          fi
          echo "All checks passed"
