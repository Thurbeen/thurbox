name: Deploy Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      # Demo media is copied into website/assets/ at deploy time, so a change to
      # the rendered videos must also redeploy the site (e.g. after re-running
      # scripts/demo/record.sh). Without this the live site keeps stale mp4s.
      - 'docs/media/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 26
          cache: npm

      # Demo videos are copied into the Eleventy input (website/assets/) before the
      # build, so the passthrough-copy step picks them up into the built _site/.
      - name: Copy demo videos into website assets
        run: cp docs/media/*.mp4 website/assets/

      - name: Install dependencies
        run: npm ci

      - name: Build site with Eleventy
        run: npm run build:website

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
