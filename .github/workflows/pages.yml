name: Deploy Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'eleventy.config.js'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/ci/mods-gallery.mjs'
      - 'scripts/ci/validate-mods.mjs'
      - 'docs/fleet/**'
      - 'docs/runtime/**'
      - 'docs/thurbox/mods.md'
      - 'docs/thurbox/kernel.md'
      - 'docs/thurbox/architecture.md'
      - 'docs/observability.md'
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - name: Download demo videos into website assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download media --repo "${{ github.repository }}" --pattern '*.mp4' --dir website/assets

      - name: Install dependencies
        run: npm ci

      - name: Build site with Eleventy
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run build:website

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
