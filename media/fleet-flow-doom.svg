near infinite}@keyframes k1{0%,24.6%{opacity:0}25%,49.6%{opacity:1}50%,100%{opacity:0}}.k2{animation:k2 16s linear infinite}@keyframes k2{0%,49.6%{opacity:0}50%,74.6%{opacity:1}75%,100%{opacity:0}}.k3{animation:k3 16s linear infinite}@keyframes k3{0%,74.6%{opacity:0}75%,99.6%{opacity:1}}.n0{animation-delay:0.34s}.n1{animation-delay:1.34s}.n2{animation-delay:2.34s}.n3{animation-delay:3.34s}@media (prefers-reduced-motion: reduce){.spin,.node,.core,.k0,.k1,.k2,.k3{animation:none}.node,.core{opacity:1}.glow.on,.hot.on{opacity:1}.tok{display:none}.hudt.on{opacity:0}.hudt.k0{opacity:1}}</style></defs>
