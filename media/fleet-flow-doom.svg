<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 610" width="960" height="610" role="img" aria-labelledby="title desc">
<title id="title">VEGA and the Fleet reconcile loop</title>
<desc id="desc">A Doom-style mission control screen in red, black and gunmetal that shows how Fleet works. At the top, VEGA is Mission Control: Task/vega is an ordinary Task with no extra privileges whose agent applies worker Tasks, and each worker answers with fleet result. In the middle, fleet up starts VEGA, holds the manager lease and runs one loop for every due object: read its spec and status from the store; observe through ports, where Unknown never means absent; plan with a pure controller; act by persisting an intent, running the effect, then persisting its receipt. The loop takes each kind in turn. A Task runs one agent session through the Runtime port, where thurbox spawns, briefs and releases it. A ChangeRequest mirrors one forge change through the Forge port, which reads with gh, glab, az or curl, and whose one write is mark-ready; the Forge controller relays its feedback into the Task inbox. A plugin kind is reconciled by a controller written as a script, through bounded observe and perform calls. A Conversation mirrors a chat thread through the Gateway port; its relay to a Task is still a design. TaskConfig and EnvProvider are passive kinds with no controller, frozen into a Task launch. A status bar names the current kind, its controller and its port.</desc>
