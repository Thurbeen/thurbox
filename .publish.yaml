version: 1

forge: github
base: main

review:
  rules:
    - docs/thurbox/review.md
    - AGENTS.md
    - CONTRIBUTING.md

gate:
  - name: lint
    run:
      - just lint
      - RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --all-features
    fix: cargo fmt --all && stylua ui examples

  - name: test
    run: cargo nextest run --all

ci:
  required: true
  timeout: 30m
