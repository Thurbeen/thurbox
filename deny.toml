[advisories]
version = 2
ignore = [
    { id = "RUSTSEC-2026-0370", reason = "zvariant: unmaintained, via notify-rust -> zbus 5; drop after https://github.com/hoodie/notify-rust/pull/294" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: unmaintained, via notify-rust -> zbus 5; drop after https://github.com/hoodie/notify-rust/pull/294" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: unmaintained, via notify-rust -> zbus 5; drop after https://github.com/hoodie/notify-rust/pull/294" },
    { id = "RUSTSEC-2026-0543", reason = "chrono: unmaintained, no safe upgrade (https://github.com/chronotope/chrono/issues/1768); via fleet-api and croner" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "warn"
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []

[[licenses.exceptions]]
name = "borrow-or-share"
version = "=0.2.4"
allow = ["MIT-0"]
