# cargo-deny configuration
# See: https://embarkstudios.github.io/cargo-deny/

[advisories]
# Deny crates with security vulnerabilities
version = 2
ignore = [
    # Added 2026-10-18. zbus 6 absorbed these crates; notify-rust 4.18.2 (latest)
    # still requires zbus 5. Drop once https://github.com/hoodie/notify-rust/pull/294 ships.
    { id = "RUSTSEC-2026-0370", reason = "zvariant: unmaintained, via notify-rust -> zbus 5" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: unmaintained, via notify-rust -> zbus 5" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: unmaintained, via notify-rust -> zbus 5" },
]

[licenses]
# License policy — version 2 denies all licenses not explicitly allowed
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    # `notify`, the file watcher behind the plugin directory's auto-reload.
    # A public-domain dedication, so at least as permissive as everything above.
    "CC0-1.0",
]

[bans]
# Dependency bans
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
# Source validation
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
