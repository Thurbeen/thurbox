<text class="hud" x="48" y="444">A SESSION IS A TASK OF ONE FLEET</text>
<text class="l" x="48" y="468">It keeps running when thurbox quits. A Fleet that cannot be reached keeps its rows, marked unreachable.</text>
</svg>
