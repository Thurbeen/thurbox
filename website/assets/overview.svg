<text class="t" x="86" y="159">THURBOX</text>
<text class="l" x="52" y="198">one list of sessions</text>
<text class="l" x="52" y="218">from every Fleet in</text>
<text class="l" x="52" y="238">settings.toml</text>
<text class="dim" x="52" y="342">Ctrl+N picks a Fleet,</text>
<text class="dim" x="52" y="360">a place, a repository</text>
