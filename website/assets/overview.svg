<text class="lbl" x="642" y="104">RUNTIME</text>
<text class="dim" x="838" y="104" text-anchor="end">runs processes</text>
<path class="rule" d="M642 112H838"/>
<text class="lbl" x="914" y="104">PLACE</text>
<path class="rule" d="M914 112H1064"/>
<path class="wire" d="M232 186H318"/>
