<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" role="img" aria-labelledby="title desc">
<title id="title">thurbox, its Fleets, their runtimes and places</title>
<desc id="desc">A Doom-style diagram. thurbox shows one list of sessions from every Fleet that settings.toml lists. Fleet laptop runs on this machine, and thurbox starts its manager. Fleet box runs on another machine, and thurbox reaches it over ssh or WSL; a systemd unit there runs its manager. Each Fleet asks its runtime, runtime-mux over tmux or psmux, to start and stop each session. The runtime runs the coding agent at a place: local is the Fleet's own machine, so the laptop for Fleet laptop and box for Fleet box. A session is a Task of one Fleet and keeps running when thurbox quits.</desc>
<defs>
<linearGradient id="hell" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe0c8"/><stop offset=".4" stop-color="#ff3b24"/><stop offset="1" stop-color="#6a0a05"/></linearGradient>
<linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a1517"/><stop offset="1" stop-color="#140a0b"/></linearGradient>
<linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a4244"/><stop offset=".5" stop-color="#2b2527"/><stop offset="1" stop-color="#1a1617"/></linearGradient>
<linearGradient id="hudbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3335"/><stop offset="1" stop-color="#1c1819"/></linearGradient>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#2c0c0a" stroke-width="1"/></pattern>
<filter id="gC" x="-60%" y="-60%" width="220%" height="220%"><feFlood flood-color="#00d9ff"/><feComposite in2="SourceAlpha" operator="in"/><feGaussianBlur stdDeviation="4" result="c"/><feMerge><feMergeNode in="c"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="gR" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace}.pnl{fill:url(#panel);stroke:#5e5457;stroke-width:2}.hotp{stroke:#d0301c}.bl{fill:none;stroke:#fff;stroke-opacity:.16;stroke-width:2}.bd{fill:none;stroke:#000;stroke-opacity:.6;stroke-width:2}.t{fill:#ff5a40;font-size:17px;font-weight:800;letter-spacing:1px}.l{fill:#efe2e0;font-size:13px}.dim{fill:#c4adab;font-size:12px}.lbl{fill:#a99d9f;font-size:12px;font-weight:700;letter-spacing:3px}.rule{stroke:#3d3537;stroke-width:2;stroke-dasharray:2 4}.head{fill:url(#hell);stroke:#2a0504;stroke-width:2;paint-order:stroke;font-size:30px;font-weight:900;letter-spacing:5px}.wire{fill:none;stroke:#6a1a14;stroke-width:4}.trace{fill:none;stroke:#ff3b24;stroke-width:2;stroke-dasharray:8 10;animation:trace 1.6s linear infinite}@keyframes trace{to{stroke-dashoffset:-36}}.lane{fill:none;stroke:#00e5ff;stroke-width:2;stroke-dasharray:6 6;animation:trace 1.2s linear infinite}.wl{fill:#ff6a50;font-size:11px;font-weight:800;letter-spacing:1px}.wlc{fill:#00d9ff;font-size:11px;font-weight:800;letter-spacing:1px}.ico{fill:none;stroke:#ff5a40;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.ringin{fill:none;stroke:#7a1a12;stroke-width:2.5}.glow{fill:none;stroke:#ff2a1a;stroke-width:2;stroke-linejoin:round}.spin{animation:spin 24s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.core{animation:core 4s ease-in-out infinite}@keyframes core{0%,100%{opacity:.45}50%{opacity:1}}.vb{fill:#1d0f11;stroke:#4a4144;stroke-width:1.5}.vt{fill:#efe2e0;font-size:11px;font-weight:700}.vbc{fill:#00222a;stroke:#00d9ff;stroke-width:1.5}.vtc{fill:#00d9ff;font-size:11px;font-weight:800}.led{stroke:#000;stroke-width:1;fill:#6eff6e}.blink{animation:blink 1.4s steps(1) infinite}@keyframes blink{50%{opacity:.25}}.hs{fill:#ff6a50;font-size:13px;font-weight:800;letter-spacing:1px}.hud{fill:#ff3b24;font-size:15px;font-weight:900;letter-spacing:2px}@media (prefers-reduced-motion: reduce){.trace,.lane,.spin,.core,.blink{animation:none}.core{opacity:1}}@media (prefers-color-scheme: light){.frame{stroke:#9a9093;stroke-width:1}}@media (prefers-color-scheme: dark){.frame{stroke:none}}</style></defs>
