<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 452" width="900" height="452" role="img" aria-labelledby="t d">
  <title id="t">thurbox: one interface, several Fleets</title>
  <desc id="d">thurbox lists the sessions of every Fleet in settings.toml; Ctrl+N picks a Fleet, a place and a repository. Fleet laptop runs on this machine, where thurbox starts fleet up. Fleet box runs on another machine, reached over ssh or WSL, where a systemd unit runs fleet up. Each Fleet starts a runtime (runtime-mux, or yours), which runs a workspace provider (workspace-git, or yours) and runs sessions at a place: Fleet laptop at local (the laptop) and mux/devbox over ssh, Fleet box at local (box itself) and mux/wsl-dev. A session is a Task of one Fleet: it keeps running when thurbox quits, and a Fleet that cannot be reached keeps its rows, marked unreachable.</desc>
