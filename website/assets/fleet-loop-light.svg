<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 438" width="900" height="438" role="img" aria-labelledby="t d">
  <title id="t">Fleet: resources in a store, controllers that reconcile them</title>
  <desc id="d">You declare resources with fleet apply, thurbox or a script: a Task with its spec, and TaskConfig, EnvProvider, ChangeRequest, CronTask, Board, Conversation and Listener. The store keeps them. Controllers, run by fleet up, watch the spec, observe the runtime and the forge, compare, and act: the runtime makes the workspace and starts, briefs, pauses, revives or releases the session at a place; the forge is mirrored into ChangeRequests. The controllers write the phase and conditions back to the status. Each effect is recorded as an intent before it runs, and an unknown observation never means gone.</desc>
