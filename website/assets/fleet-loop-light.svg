  <rect x="20" y="362" width="860" height="52" rx="10" class="ft"/>
  <rect x="20" y="362" width="4" height="52" rx="2" class="fb"/>
  <text x="38" y="383" class="fs">The plan lives in the store.<tspan class="d" font-weight="400" dx="5">Sessions come and go; the spec says what they should be.</tspan></text>
  <text x="38" y="402" class="d">Each effect is recorded as an intent before it runs, and an unknown answer never means gone.</text>
