  # ── Injected by the kernel ────────────────────────────────────────────────
  # Everything readable. Read-only — a write never reaches the engine, which is
  # what `command` is for.
  #
  # The shape is spelled out rather than left as a wildcard so a typo is a lint
  # error: `thurbox.sesions` would otherwise just be nil, and the pane would
  # render empty with nothing to explain it.
  #
  # selene checks a *dotted* path one segment at a time and stops at the first
  # computed index, so a record such as `thurbox.platform` has an entry per field
  # while a list such as `sessions` stops at the list: a row is reached through
  # `[i]`. `runs` is the one map keyed by a literal the plugin chose, so it takes
  # `*`. Declaring a field implies its parents, so only leaves are written.
  #
  # These entries are generated from `src/kernel/lua_api.rs`, which also renders
  # the matching types in `ui/lib/thurbox.d.lua`; `tests/lua_api.rs` fails when
  # this region drifts from it.
  # BEGIN GENERATED by src/kernel/lua_api.rs: edit there, then `just lua-api`
  thurbox.api:
    property: read-only
  thurbox.sessions:
    property: read-only
