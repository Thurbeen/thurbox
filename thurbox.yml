---
# The plugin VM's standard library, as selene sees it.
#
# This file IS the sandbox contract, checked statically.
#
# There is deliberately **no `base:`**. `kernel::host::plugin_stdlib` grants
# plugins `string`, `table`, `math`, `coroutine` and `utf8` and nothing else, and
# the capability model is enforced by *absence* rather than by a binding that
# refuses. Declaring the granted set and inheriting nothing
# reproduces that exactly: `os`, `io`, `debug`, `package`, `print` and the loaders
# are simply not here, so reaching for one is `undefined_variable` — a lint
# failure instead of "attempt to index a nil value" when someone opens the pane.
#
# Inheriting `lua53` and marking things `removed` does NOT work: selene applies
# that to plain functions but not to a table's fields, so `os.time()` passed
# review while `dofile` was caught. Verified by probing both.
#
# Keep in step with `plugin_stdlib` and `install_api` in `src/kernel/host/`.
# Events and the palette add nothing here on purpose: `events`, `commands` and
# `on_event` are fields of the declaration table, and `emit` is a kind of
# `command` — the one write channel a plugin already has.
# Arguments are declared as varargs: the value here is knowing a name exists and
# is reachable, not policing arity that Lua itself does not.

globals:
  # ── Base ──────────────────────────────────────────────────────────────────
  # mlua loads the base library alongside the tables above. Listed rather than
  # inherited so this file stays the single statement of what a plugin may touch.
  #
  # `_G` is reachable too and is deliberately NOT here. Declaring it would buy
  # nothing — selene's own `global_usage` lint rejects `_G` whether or not the
  # standard library knows the name — while `_G["io"]` is a spelling this file
  # cannot see, so the entry would only blur what "the sandbox is what is
  # declared here" means.
  _VERSION:
    property: read-only
  assert:
    args:
      - type: "..."
  error:
    args:
      - type: "..."
  getmetatable:
    args:
      - type: "..."
  ipairs:
    args:
      - type: "..."
  next:
    args:
      - type: "..."
  pairs:
    args:
      - type: "..."
  pcall:
    args:
      - type: "..."
  rawequal:
    args:
      - type: "..."
  rawget:
    args:
      - type: "..."
  rawlen:
    args:
      - type: "..."
  rawset:
    args:
      - type: "..."
  select:
    args:
      - type: "..."
  setmetatable:
    args:
      - type: "..."
  tonumber:
    args:
      - type: "..."
  tostring:
    args:
      - type: "..."
  type:
    args:
      - type: "..."
  xpcall:
    args:
      - type: "..."

  # ── string ────────────────────────────────────────────────────────────────
  string.byte:
    args:
      - type: "..."
  string.char:
    args:
      - type: "..."
  string.dump:
    args:
      - type: "..."
  string.find:
    args:
      - type: "..."
  string.format:
    args:
      - type: "..."
  string.gmatch:
    args:
      - type: "..."
  string.gsub:
    args:
      - type: "..."
  string.len:
    args:
      - type: "..."
  string.lower:
    args:
      - type: "..."
  string.match:
    args:
      - type: "..."
  string.pack:
    args:
      - type: "..."
  string.packsize:
    args:
      - type: "..."
  string.rep:
    args:
      - type: "..."
  string.reverse:
    args:
      - type: "..."
  string.sub:
    args:
      - type: "..."
  string.unpack:
    args:
      - type: "..."
  string.upper:
    args:
      - type: "..."

  # ── table ─────────────────────────────────────────────────────────────────
  table.concat:
    args:
      - type: "..."
  table.insert:
    args:
      - type: "..."
  table.move:
    args:
      - type: "..."
  table.pack:
    args:
      - type: "..."
  table.remove:
    args:
      - type: "..."
  table.sort:
    args:
      - type: "..."
  table.unpack:
    args:
      - type: "..."

  # ── math ──────────────────────────────────────────────────────────────────
  # The trigonometry is Lua 5.4's own. What is NOT here is the handful mlua's
  # vendored Lua still answers because it is built with LUA_COMPAT_MATHLIB
  # (`pow`, `ldexp`, `frexp`, `log10`, `atan2`, `cosh`, `sinh`, `tanh`): 5.4
  # removed them, so declaring one would bless a name a dependency bump can take
  # away — the "lints clean, nil at runtime" failure this file exists to avoid.
  math.abs:
    args:
      - type: "..."
  math.acos:
    args:
      - type: "..."
  math.asin:
    args:
      - type: "..."
  math.atan:
    args:
      - type: "..."
  math.ceil:
    args:
      - type: "..."
  math.cos:
    args:
      - type: "..."
  math.deg:
    args:
      - type: "..."
  math.exp:
    args:
      - type: "..."
  math.floor:
    args:
      - type: "..."
  math.fmod:
    args:
      - type: "..."
  math.log:
    args:
      - type: "..."
  math.max:
    args:
      - type: "..."
  math.min:
    args:
      - type: "..."
  math.modf:
    args:
      - type: "..."
  math.rad:
    args:
      - type: "..."
  math.random:
    args:
      - type: "..."
  math.randomseed:
    args:
      - type: "..."
  math.sin:
    args:
      - type: "..."
  math.sqrt:
    args:
      - type: "..."
  math.tan:
    args:
      - type: "..."
  math.tointeger:
    args:
      - type: "..."
  math.type:
    args:
      - type: "..."
  math.ult:
    args:
      - type: "..."
  math.huge:
    property: read-only
  math.maxinteger:
    property: read-only
  math.mininteger:
    property: read-only
  math.pi:
    property: read-only

  # ── coroutine ─────────────────────────────────────────────────────────────
  coroutine.close:
    args:
      - type: "..."
  coroutine.create:
    args:
      - type: "..."
  coroutine.isyieldable:
    args:
      - type: "..."
  coroutine.resume:
    args:
      - type: "..."
  coroutine.running:
    args:
      - type: "..."
  coroutine.status:
    args:
      - type: "..."
  coroutine.wrap:
    args:
      - type: "..."
  coroutine.yield:
    args:
      - type: "..."

  # ── utf8 ──────────────────────────────────────────────────────────────────
  # Granted because text handling needs it: Lua's `#` counts bytes, so a name
  # like "Rosé Pine" measures one column short without it.
  utf8.char:
    args:
      - type: "..."
  utf8.codepoint:
    args:
      - type: "..."
  utf8.codes:
    args:
      - type: "..."
  utf8.len:
    args:
      - type: "..."
  utf8.offset:
    args:
      - type: "..."
  utf8.charpattern:
    property: read-only

  # ── Injected by the kernel ────────────────────────────────────────────────
  # Everything readable. Read-only — a write never reaches the engine, which is
  # what `command` is for.
  #
  # The shape is spelled out rather than left as a wildcard so a typo is a lint
  # error: `thurbox.sesions` would otherwise just be nil, and the pane would
  # render empty with nothing to explain it.
  #
  # What decides how deep an entry goes is that selene checks a *dotted* path,
  # one segment at a time, and stops at the first computed index. So a table
  # read as `thurbox.platform.os` needs an entry per field or the read is an
  # error, while `sessions` stops at the table because a row is reached through
  # `[i]` — its fields are ordinary and unchecked. Declaring a field implies its
  # parents, so only the leaves a plugin names are written out.
  #
  # A newly published field used by a plugin fails lint until it is added here,
  # which is the right direction for the prompt to point.
  thurbox.sessions:
    property: read-only
  thurbox.deleted:
    property: read-only
  thurbox.repos:
    property: read-only
  thurbox.agents:
    property: read-only
  # What a bare launch would use, so a flow preselects it.
  thurbox.agent_default:
    property: read-only
  # The settings in force: every feature switch, plus the scalars a pane or the
  # arrangement needs.
  # Each switch is named because a pane that owns its own surface is the only
  # thing that can honour its own switch — `publish_settings` is the field set.
  thurbox.settings.features.tasks:
    property: read-only
  thurbox.settings.features.automations:
    property: read-only
  thurbox.settings.features.file_viewer:
    property: read-only
  thurbox.settings.features.global_search:
    property: read-only
  thurbox.settings.features.info_panel:
    property: read-only
  thurbox.settings.features.shell_pane:
    property: read-only
  thurbox.settings.features.code_review:
    property: read-only
  thurbox.settings.features.perf_hud:
    property: read-only
  thurbox.settings.features.mouse:
    property: read-only
  thurbox.settings.features.notifications:
    property: read-only
  thurbox.settings.features.soft_delete:
    property: read-only
  thurbox.settings.features.version_check:
    property: read-only
  thurbox.settings.features.auto_update:
    property: read-only
  thurbox.settings.two_panel_min_cols:
    property: read-only
  thurbox.settings.three_panel_min_cols:
    property: read-only
  thurbox.settings.scrollback_lines:
    property: read-only
  # The creation flow's four parameterised reads, each published only while it
  # is being asked for (`store.want_*`).
  thurbox.bookmarks.host:
    property: read-only
  thurbox.bookmarks.loading:
    property: read-only
  thurbox.bookmarks.rows:
    property: read-only
  thurbox.browse.host:
    property: read-only
  thurbox.browse.dir:
    property: read-only
  thurbox.browse.loading:
    property: read-only
  thurbox.browse.error:
    property: read-only
  thurbox.browse.entries:
    property: read-only
  thurbox.branches.host:
    property: read-only
  thurbox.branches.repo:
    property: read-only
  thurbox.branches.loading:
    property: read-only
  thurbox.branches.error:
    property: read-only
  thurbox.branches.list:
    property: read-only
  thurbox.worktrees.host:
    property: read-only
  thurbox.worktrees.repo:
    property: read-only
  thurbox.worktrees.loading:
    property: read-only
  thurbox.worktrees.error:
    property: read-only
  thurbox.worktrees.list:
    property: read-only
  thurbox.hosts:
    property: read-only
  # Whether the multiplexer a session's window needs is installed, so a flow can
  # say so before the user commits. A fixed record, so its three fields are
  # written out.
  thurbox.preflight.mux.binary:
    property: read-only
  thurbox.preflight.mux.presence:
    property: read-only
  thurbox.preflight.mux.advice:
    property: read-only
  thurbox.tasks:
    property: read-only
  thurbox.automations:
    property: read-only
  thurbox.commands:
    property: read-only
  thurbox.diffs:
    property: read-only
  # Keyed by SURFACE rather than by session: a session's companion shell is
  # `<id>#shell` and prints URLs of its own, whether or not the agent's pane is
  # the one on screen.
  thurbox.links:
    property: read-only
  # The content search's answer: lines found in every session's terminals,
  # scrollback included, ranked, each with how far back it is and the scroll
  # offset that shows it. Served only while a pane is asking for it
  # (`store.want_content`) — nobody wants every agent's history read on every
  # frame. Nil until the first answer lands.
  thurbox.search:
    property: read-only
  # Which sessions are producing output right now, keyed by session id. Its own
  # tiny group rather than a field on each session row: the answer moves with an
  # agent's output, and the rows must not be rebuilt at that rate. It is what
  # lets a `running` dot animate on evidence instead of asserting a turn no
  # process listing can see.
  thurbox.printing:
    property: read-only
  # Answers to the programs THIS plugin asked to be run. Set per plugin as it is
  # entered, so a pane reads its own and no other's.
  #
  # The one map that takes `*`. Every other is keyed by a session id and so is
  # only ever reached through a variable, which ends the checked path on its
  # own; this one is keyed by the key the plugin itself passed to `run`, so
  # `thurbox.runs.cpu.state` IS a dotted path and was rejected. There is no
  # field set to police — the keys are the plugin's — and `thurbox.Run` in the
  # definitions is what checks the answer's own fields.
  thurbox.runs:
    property: read-only
  thurbox.runs.*:
    property: read-only
  thurbox.runs.*.*:
    property: read-only
  # Which capabilities THIS plugin has been granted, as `granted.run` /
  # `granted.program`. Present because not every capability can be withheld by
  # absence: `run` is a global, so `if not run then` is the check, but a program
  # pane is asked for through `command`, which every plugin has. Without this a
  # pane could not tell "you have not trusted me" from "still starting".
  #
  # One entry per capability, from `Capability::ALL`, so a third one is a third
  # line here rather than a read that lints clean against a table nobody serves.
  thurbox.granted.run:
    property: read-only
  thurbox.granted.program:
    property: read-only
  # Machine, per-agent and account readings. `system` is a fixed record, so its
  # three fields are written out; `sessions` is keyed by session id and can only
  # be reached through a variable, which ends the checked path there.
  thurbox.metrics.system.cpu_percent:
    property: read-only
  thurbox.metrics.system.memory_used:
    property: read-only
  thurbox.metrics.system.memory_total:
    property: read-only
  thurbox.metrics.sessions:
    property: read-only
  # The machine this is running on: `platform.os` / `platform.arch`, from the
  # values the binary was built for. Here so a plugin that delivers more than one
  # build can pick — which is why platform selection is NOT in a package manifest.
  thurbox.platform.os:
    property: read-only
  thurbox.platform.arch:
    property: read-only
  # Both are on the root table (`kernel::host` sets them beside the snapshot) and
  # were missing here, so a pane reading a field the kernel genuinely serves was
  # rejected by `selene ui` — the same error class as the deliberate
  # `thurbox.sesions` typo, which is what this file exists to catch.
  thurbox.version:
    property: read-only
  thurbox.reloads:
    property: read-only
  thurbox.can_open_links:
    property: read-only
  thurbox.taken_at_ms:
    property: read-only
  thurbox.error:
    property: read-only
  thurbox.focus:
    property: read-only
  # The mouse text selection, empty when nothing is selected.
  thurbox.selection:
    property: read-only
  # What the pointer is over, as whichever of the two the affordance was marked
  # with — so both are absent when nothing is hovered, and a pane matches on the
  # one it painted with.
  thurbox.hover.id:
    property: read-only
  thurbox.hover.role:
    property: read-only
  # The interface's own files: where each came from, and which are running.
  thurbox.plugins:
    property: read-only
  thurbox.ui_dir:
    property: read-only
  # What the arrangement needs to know about the bands, and no more.
  thurbox.chrome.status_rows:
    property: read-only
  # The active palette as role -> colour, plus the selectable list.
  #
  # `roles` is written out rather than left at the table, reversing the call in
  # #1138. Nothing bundled forced it — `ui/lib/theme.lua` memoizes the table
  # through a local, which ends the checked path — but the kernel serves every
  # one of these, and a pane reaching for a role directly rather than through
  # that helper reads `thurbox.theme.roles.accent`, which was rejected against a
  # value that is genuinely there. The field set is `theme::palette_roles`', and
  # fixed, so spelling it out also makes `roles.acent` a lint error — the same
  # catch `thurbox.Role` makes on the lua-language-server side.
  thurbox.theme.name:
    property: read-only
  thurbox.theme.roles.accent:
    property: read-only
  thurbox.theme.roles.accent_bright:
    property: read-only
  thurbox.theme.roles.app_bg:
    property: read-only
  thurbox.theme.roles.border_focused:
    property: read-only
  thurbox.theme.roles.border_unfocused:
    property: read-only
  thurbox.theme.roles.branch_name:
    property: read-only
  thurbox.theme.roles.danger:
    property: read-only
  thurbox.theme.roles.diff_added:
    property: read-only
  thurbox.theme.roles.diff_added_bg:
    property: read-only
  thurbox.theme.roles.diff_removed:
    property: read-only
  thurbox.theme.roles.diff_removed_bg:
    property: read-only
  thurbox.theme.roles.inverted_fg:
    property: read-only
  thurbox.theme.roles.keybind_hint:
    property: read-only
  thurbox.theme.roles.modal_bg:
    property: read-only
  thurbox.theme.roles.modal_border:
    property: read-only
  thurbox.theme.roles.modal_dim_bg:
    property: read-only
  thurbox.theme.roles.role_name:
    property: read-only
  thurbox.theme.roles.search_bar:
    property: read-only
  thurbox.theme.roles.selection_bg:
    property: read-only
  thurbox.theme.roles.selection_fg:
    property: read-only
  thurbox.theme.roles.status_blocked:
    property: read-only
  thurbox.theme.roles.status_done:
    property: read-only
  thurbox.theme.roles.status_error:
    property: read-only
  thurbox.theme.roles.status_idle:
    property: read-only
  thurbox.theme.roles.status_running:
    property: read-only
  thurbox.theme.roles.status_unknown:
    property: read-only
  thurbox.theme.roles.status_unreachable:
    property: read-only
  thurbox.theme.roles.status_working:
    property: read-only
  thurbox.theme.roles.text_muted:
    property: read-only
  thurbox.theme.roles.text_primary:
    property: read-only
  thurbox.theme.roles.text_secondary:
    property: read-only
  thurbox.theme.roles.tool_allowed:
    property: read-only
  thurbox.theme.roles.tool_disallowed:
    property: read-only
  thurbox.theme.choices:
    property: read-only
  # What every plugin declared, so help and settings render from it.
  thurbox.registry.keys:
    property: read-only
  thurbox.registry.settings:
    property: read-only
  thurbox.registry.sections:
    property: read-only

  # The only way to change anything. Enqueues and returns; never blocks.
  command:
    args:
      - type: "..."

  # Persistent and private to the declaring plugin; survives a reload.
  state:
    property: new-fields

  # Persistent and shared by every plugin — the bus between them.
  store:
    property: new-fields

  # Directory entries and file text, rooted at a session's directory. Not a
  # filesystem: a path outside the root is refused.
  files.list:
    args:
      - type: "..."
  files.read:
    args:
      - type: "..."

  # Display width, which Lua cannot compute: `#` counts bytes and `utf8.len`
  # counts codepoints, and a terminal budget is columns. Backed by the same
  # `unicode-width` the painter measures with.
  text.width:
    args:
      - type: "..."
  text.truncate:
    args:
      - type: "..."
  text.pad:
    args:
      - type: "..."

  # Loads `lib/*.lua`, and nothing outside the plugin directory.
  require:
    args:
      - type: "..."

  # Granted only to a plugin that DECLARES `capabilities = { "run" }` and that
  # the user has TRUSTED (settings → Interface → `t`). Declared here so the
  # linters know the shape; absent at runtime for a plugin that has neither, so
  # calling it there is a nil call rather than a refusal.
  run:
    args:
      - type: "..."
