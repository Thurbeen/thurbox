---
# The plugin VM's standard library, as selene sees it.
#
# This file IS the sandbox contract, checked statically.
#
# There is deliberately **no `base:`**. `kernel::host::plugin_stdlib` grants
# plugins `string`, `table`, `math`, `coroutine` and `utf8` and nothing else, and
# the capability model is enforced by *absence* rather than by a binding that
# refuses. Declaring the granted set and inheriting nothing
# reproduces that exactly: `os`, `io`, `debug`, `package`, `print` and the loaders
# are simply not here, so reaching for one is `undefined_variable` — a lint
# failure instead of "attempt to index a nil value" when someone opens the pane.
#
# Inheriting `lua53` and marking things `removed` does NOT work: selene applies
# that to plain functions but not to a table's fields, so `os.time()` passed
# review while `dofile` was caught. Verified by probing both.
#
# Keep in step with `plugin_stdlib` and `install_api` in `src/kernel/host/`.
# Events and the palette add nothing here on purpose: `events`, `commands` and
# `on_event` are fields of the declaration table, and `emit` is a kind of
# `command` — the one write channel a plugin already has.
# Arguments are declared as varargs: the value here is knowing a name exists and
# is reachable, not policing arity that Lua itself does not.

globals:
  # ── Base ──────────────────────────────────────────────────────────────────
  # mlua loads the base library alongside the tables above. Listed rather than
  # inherited so this file stays the single statement of what a plugin may touch.
  #
  # `_G` is reachable too and is deliberately NOT here. Declaring it would buy
  # nothing — selene's own `global_usage` lint rejects `_G` whether or not the
  # standard library knows the name — while `_G["io"]` is a spelling this file
  # cannot see, so the entry would only blur what "the sandbox is what is
  # declared here" means.
  _VERSION:
    property: read-only
  assert:
    args:
      - type: "..."
  error:
    args:
      - type: "..."
  getmetatable:
    args:
      - type: "..."
  ipairs:
    args:
      - type: "..."
  next:
    args:
      - type: "..."
  pairs:
    args:
      - type: "..."
  pcall:
