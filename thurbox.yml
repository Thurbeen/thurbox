  # ── utf8 ──────────────────────────────────────────────────────────────────
  # Granted because text handling needs it: Lua's `#` counts bytes, so a name
  # like "Rosé Pine" measures one column short without it.
  utf8.char:
    args:
      - type: "..."
  utf8.codepoint:
    args:
      - type: "..."
  utf8.codes:
